<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const loadingEl = document.getElementById('loading');
const barEl = document.querySelector('#bar i');
const loadingTextEl = document.getElementById('loadingText');
function setProgress(p, text) { barEl.style.width = (p * 100) + '%'; if (text) loadingTextEl.textContent = text; }

// =====================================================================
// Renderer, scene, camera
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = 0x0a3548;
scene.background = new THREE.Color(FOG_COLOR);
scene.fog = new THREE.FogExp2(FOG_COLOR, 0.02);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(14, 8, 17);

const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;

// =====================================================================
// Procedural PBR-ish textures painted on canvas: diffuse + bump, real UVs.
// =====================================================================
const ANISO = renderer.capabilities.getMaxAnisotropy();
function mkTex(canvas, { repeat = [1, 1], srgb = true } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...repeat);
  t.anisotropy = ANISO;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function noise2D(size, freq, octaves = 4) {
  // cheap value-noise field, used to paint organic detail without external images
  const g = document.createElement('canvas'); g.width = g.height = size;
  const gx = g.getContext('2d');
  const img = gx.createImageData(size, size);
  const rnd = (() => { let s = 1234; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  // simple multi-octave value noise via randomly seeded grids + bilinear interpolation
  function grid(n) { const a = new Float32Array((n + 1) * (n + 1)); for (let i = 0; i < a.length; i++) a[i] = rnd(); return a; }
  const layers = [];
  for (let o = 0; o < octaves; o++) { const n = freq * Math.pow(2, o); layers.push({ n, g: grid(n), amp: 1 / Math.pow(1.9, o) }); }
  let total = layers.reduce((a, l) => a + l.amp, 0);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let v = 0;
    for (const l of layers) {
      const u = x / size * l.n, w = y / size * l.n, x0 = Math.floor(u), y0 = Math.floor(w), fx = u - x0, fy = w - y0;
      const at = (xx, yy) => l.g[(yy % (l.n + 1)) * (l.n + 1) + (xx % (l.n + 1))];
      const a0 = at(x0, y0) * (1 - fx) + at(x0 + 1, y0) * fx, a1 = at(x0, y0 + 1) * (1 - fx) + at(x0 + 1, y0 + 1) * fx;
      v += (a0 * (1 - fy) + a1 * fy) * l.amp;
    }
    v /= total;
    const idx = (y * size + x) * 4;
    const c = Math.round(v * 255);
    img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = c; img.data[idx + 3] = 255;
  }
  gx.putImageData(img, 0, 0);
  return g;
}
function shade(c1, c2, v) {
  const a = new THREE.Color(c1), b = new THREE.Color(c2);
  return a.clone().lerp(b, v);
}
function woodTexture({ base = '#9a7048', dark = '#5a3d20', planks = 14 } = {}) {
  const size = 1024, c = document.createElement('canvas'); c.width = size; c.height = size;
  const x = c.getContext('2d');
  const n = noise2D(size, 6, 5);
  const nx = n.getContext('2d').getImageData(0, 0, size, size).data;
  const grainN = noise2D(size, 40, 3);
  const gx = grainN.getContext('2d').getImageData(0, 0, size, size).data;
  const img = x.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    const plankY = Math.floor(y / (size / planks));
    const edgeDist = Math.min(y % (size / planks), (size / planks) - (y % (size / planks)));
    for (let xx = 0; xx < size; xx++) {
      const i = (y * size + xx) * 4;
      const grainV = gx[i] / 255, baseV = nx[i] / 255;
      let col = shade(base, dark, 0.15 + grainV * 0.5 + (plankY % 2 ? 0.06 : 0) + baseV * 0.15);
      if (edgeDist < 3) col = col.clone().lerp(new THREE.Color(dark), 0.6); // plank seams
      img.data[i] = Math.round(col.r * 255); img.data[i + 1] = Math.round(col.g * 255); img.data[i + 2] = Math.round(col.b * 255); img.data[i + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  return c;
}
function bumpFrom(canvas, { strength = 1 } = {}) {
  const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
  const x = c.getContext('2d');
  x.drawImage(canvas, 0, 0);
  const img = x.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < img.data.length; i += 4) {
    const l = (img.data[i] * 0.3 + img.data[i + 1] * 0.59 + img.data[i + 2] * 0.11);
    const v = Math.min(255, Math.max(0, 128 + (l - 128) * strength));
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
  }
  x.putImageData(img, 0, 0);
  return c;
}
function coralCanvas() {
  const size = 512, c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const n = noise2D(size, 8, 4).getContext('2d').getImageData(0, 0, size, size).data;
  const cols = ['#e8672f', '#c94f8a', '#7fd8c8', '#e8a13f', '#d64f6a'];
  const img = x.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = n[i] / 255;
    const col = new THREE.Color(cols[Math.floor(v * cols.length) % cols.length]).lerp(new THREE.Color('#3a2717'), Math.max(0, 0.55 - v));
    img.data[i] = col.r * 255; img.data[i + 1] = col.g * 255; img.data[i + 2] = col.b * 255; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}
function sandCanvas() {
  const size = 1024, c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const n = noise2D(size, 10, 5).getContext('2d').getImageData(0, 0, size, size).data;
  const img = x.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = n[i] / 255;
    const col = shade('#8a744a', '#d9c68a', v);
    img.data[i] = col.r * 255; img.data[i + 1] = col.g * 255; img.data[i + 2] = col.b * 255; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}
function rockCanvas() {
  const size = 512, c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const n = noise2D(size, 7, 5).getContext('2d').getImageData(0, 0, size, size).data;
  const img = x.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = n[i] / 255;
    const col = shade('#39433f', '#7a8a80', v);
    img.data[i] = col.r * 255; img.data[i + 1] = col.g * 255; img.data[i + 2] = col.b * 255; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}
function metalCanvas() {
  const size = 512, c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const n = noise2D(size, 9, 4).getContext('2d').getImageData(0, 0, size, size).data;
  const img = x.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = n[i] / 255;
    const col = shade('#3a3530', '#8a6a4a', v * 0.7); // rust-streaked dark metal
    img.data[i] = col.r * 255; img.data[i + 1] = col.g * 255; img.data[i + 2] = col.b * 255; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}

setProgress(0.15, 'جارٍ رسم الخامات…');
const woodCanvas = woodTexture();
const woodTex = mkTex(woodCanvas, { repeat: [3, 6] });
const woodBump = mkTex(bumpFrom(woodCanvas, { strength: 1.6 }), { repeat: [3, 6], srgb: false });
const woodDarkCanvas = woodTexture({ base: '#3a2a18', dark: '#1c130a' });
const woodDarkTex = mkTex(woodDarkCanvas, { repeat: [2, 3] });
const woodDarkBump = mkTex(bumpFrom(woodDarkCanvas, { strength: 1.8 }), { repeat: [2, 3], srgb: false });
const coralC = coralCanvas();
const coralTex = mkTex(coralC, { repeat: [2, 2] });
const coralBump = mkTex(bumpFrom(coralC, { strength: 2 }), { repeat: [2, 2], srgb: false });
const sandC = sandCanvas();
const sandTex = mkTex(sandC, { repeat: [10, 10] });
const sandBump = mkTex(bumpFrom(sandC, { strength: 1.2 }), { repeat: [10, 10], srgb: false });
const rockC = rockCanvas();
const rockTex = mkTex(rockC, { repeat: [2, 2] });
const rockBump = mkTex(bumpFrom(rockC, { strength: 2.2 }), { repeat: [2, 2], srgb: false });
const metalC = metalCanvas();
const metalTex = mkTex(metalC, { repeat: [2, 2] });
const metalBump = mkTex(bumpFrom(metalC, { strength: 1.4 }), { repeat: [2, 2], srgb: false });

// =====================================================================
// Materials — physically based, tuned for a wet, encrusted, sunken wreck.
// =====================================================================
const matWood = new THREE.MeshPhysicalMaterial({ map: woodTex, bumpMap: woodBump, bumpScale: 0.04, roughness: 0.6, metalness: 0.02, clearcoat: 0.12, clearcoatRoughness: 0.6 });
const matWoodDark = new THREE.MeshPhysicalMaterial({ map: woodDarkTex, bumpMap: woodDarkBump, bumpScale: 0.05, roughness: 0.7, metalness: 0.02, clearcoat: 0.3, clearcoatRoughness: 0.55 });
const matCoral = new THREE.MeshPhysicalMaterial({ map: coralTex, bumpMap: coralBump, bumpScale: 0.06, roughness: 0.75, metalness: 0, clearcoat: 0.15 });
const matSand = new THREE.MeshPhysicalMaterial({ map: sandTex, bumpMap: sandBump, bumpScale: 0.05, roughness: 0.95, metalness: 0 });
const matRock = new THREE.MeshPhysicalMaterial({ map: rockTex, bumpMap: rockBump, bumpScale: 0.08, roughness: 0.85, metalness: 0.02 });
const matMetal = new THREE.MeshPhysicalMaterial({ map: metalTex, bumpMap: metalBump, bumpScale: 0.03, roughness: 0.45, metalness: 0.85, clearcoat: 0.4, clearcoatRoughness: 0.3 });

// =====================================================================
// Seabed
// =====================================================================
setProgress(0.3, 'جارٍ بناء قاع البحر…');
const seabedGeo = new THREE.CircleGeometry(40, 96);
seabedGeo.rotateX(-Math.PI / 2);
// gentle undulation so the sand isn't perfectly flat
{
  const pos = seabedGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = Math.sin(x * 0.25) * 0.12 + Math.cos(z * 0.22) * 0.1 + Math.sin((x + z) * 0.5) * 0.04;
    pos.setY(i, y);
  }
  seabedGeo.computeVertexNormals();
}
const seabed = new THREE.Mesh(seabedGeo, matSand);
seabed.receiveShadow = true;
scene.add(seabed);

function rockMesh(radius, detail = 1) {
  const geo = new THREE.IcosahedronGeometry(radius, detail);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
    const n = v.clone().normalize();
    const disp = (Math.sin(n.x * 6) * Math.cos(n.y * 5) * 0.18 + Math.sin(n.z * 7) * 0.12) * radius * 0.35;
    v.addScaledVector(n, disp);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, matRock);
  m.castShadow = m.receiveShadow = true;
  return m;
}
const rockField = new THREE.Group();
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 16; i++) {
  const a = rnd() * Math.PI * 2, r = 6 + rnd() * 16;
  const m = rockMesh(0.5 + rnd() * 1.3, 1);
  m.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  m.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6);
  m.scale.y *= 0.55 + rnd() * 0.3;
  rockField.add(m);
}
scene.add(rockField);

// coral clusters (small displaced spheres + branching tubes) scattered on rocks/sand
const CORAL_TINTS = [0xe8672f, 0xc94f8a, 0x3fd0c0, 0xe8a13f, 0xd64f6a];
function coralCluster(scale = 1) {
  const g = new THREE.Group();
  const tint = CORAL_TINTS[Math.floor(rnd() * CORAL_TINTS.length)];
  const mat = matCoral.clone();
  mat.color = new THREE.Color(tint);
  const branches = 5 + Math.floor(rnd() * 6);
  for (let b = 0; b < branches; b++) {
    const ang = rnd() * Math.PI * 2, len = (0.32 + rnd() * 0.5) * scale;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(Math.cos(ang) * len * 0.4, len * 0.5, Math.sin(ang) * len * 0.4),
      new THREE.Vector3(Math.cos(ang) * len * 0.7, len, Math.sin(ang + 0.3) * len * 0.7),
    ]);
    const tube = new THREE.TubeGeometry(curve, 8, 0.065 * scale, 7, false);
    const m = new THREE.Mesh(tube, mat);
    m.castShadow = true;
    g.add(m);
    const tip = new THREE.Mesh(new THREE.IcosahedronGeometry(0.11 * scale, 1), mat);
    tip.position.copy(curve.getPoint(1));
    g.add(tip);
  }
  return g;
}
const coralGroup = new THREE.Group();
for (let i = 0; i < 20; i++) {
  const a = rnd() * Math.PI * 2, r = 3 + rnd() * 15;
  const cl = coralCluster(0.7 + rnd() * 1.1);
  cl.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  coralGroup.add(cl);
}
scene.add(coralGroup);

// =====================================================================
// The wreck: a curved, broken, coral-encrusted wooden hull resting on its side.
// =====================================================================
setProgress(0.5, 'جارٍ بناء هيكل السفينة…');
const wreck = new THREE.Group();

// ---- A proper lofted hull: naval-style cross-sections (keel → bilge → waterline
// bulge → tumblehome → deck edge), swept along the length with bow taper, stern
// transom and sheer, so it reads as a real old warship instead of a tapered tube.
const HULL_LEN = 18, HALF_BEAM = 2.6, HULL_H = 5.6, STATIONS = 44;
const PROFILE = [ // [u: 0 keel..1 deck edge, rFactor: half-width factor]
  [0.00, 0.04], [0.12, 0.26], [0.26, 0.52], [0.40, 0.72],
  [0.54, 0.85], [0.68, 0.80], [0.80, 0.68], [0.91, 0.59], [1.00, 0.52],
];
const P = PROFILE.length;
function lenTaper(t) { // t: 0 stern .. 1 bow
  if (t < 0.1) return 0.55 + (t / 0.1) * 0.45; // flattish transom, ramps up fast
  if (t > 0.76) { const k = (t - 0.76) / 0.24; return 1 - Math.pow(k, 1.7) * 0.97; } // pointed bow
  return 1;
}
function sheer(t) { return Math.pow(Math.abs(t - 0.5) * 2, 2.2) * 0.7; } // deck rises at bow/stern
function hHeight(t) { return HULL_H * (0.62 + 0.38 * lenTaper(t)); }
function ringPointsAt(s) {
  const t = s / STATIONS, x = -HULL_LEN / 2 + t * HULL_LEN;
  const wScale = lenTaper(t), y0 = sheer(t), h = hHeight(t);
  const pts = []; // side/u recorded for hole-cutting + UVs
  for (let i = P - 1; i >= 0; i--) { const [u, rF] = PROFILE[i]; pts.push({ x, y: y0 + u * h, z: -rF * HALF_BEAM * wScale, u, side: 'L' }); }
  for (let i = 1; i < P; i++) { const [u, rF] = PROFILE[i]; pts.push({ x, y: y0 + u * h, z: rF * HALF_BEAM * wScale, u, side: 'R' }); }
  return pts; // length 2P-1; index 0 = left deck edge, P-1 = keel, 2P-2 = right deck edge
}
// battle damage: a splintered cannonball hole through the starboard hull, amidships —
// the entrance. Right side (+z) spans profile indices ~3..6 => ring indices P+2..P+5.
const HOLE_S0 = Math.round(STATIONS * 0.42), HOLE_S1 = Math.round(STATIONS * 0.58);
const HOLE_K0 = P + 2, HOLE_K1 = P + 5;
function inHole(s, k) { return s >= HOLE_S0 && s < HOLE_S1 && k >= HOLE_K0 && k < HOLE_K1; }
function buildHull() {
  const rings = []; for (let s = 0; s <= STATIONS; s++) rings.push(ringPointsAt(s));
  // jagged splintering around the hole boundary
  for (let s = HOLE_S0 - 2; s <= HOLE_S1 + 1; s++) {
    if (s < 0 || s > STATIONS) continue;
    for (let k = HOLE_K0 - 2; k <= HOLE_K1 + 1; k++) {
      if (k < 0 || k >= rings[s].length) continue;
      const nearEdge = s === HOLE_S0 - 1 || s === HOLE_S1 || k === HOLE_K0 - 1 || k === HOLE_K1;
      const inside = s >= HOLE_S0 && s < HOLE_S1 && k >= HOLE_K0 && k < HOLE_K1;
      if (nearEdge || inside) {
        const p = rings[s][k], jr = (rnd() - 0.5) * (inside ? 0.5 : 0.32);
        const len2 = Math.hypot(p.z, p.y - sheer(s / STATIONS)) || 1;
        p.z *= 1 + jr / len2; p.y += (rnd() - 0.5) * 0.22;
      }
    }
  }
  const positions = [], uvs = [], indices = [];
  const idx = (s, k) => s * (2 * P - 1) + k;
  for (const ring of rings) for (const p of ring) { positions.push(p.x, p.y, p.z); uvs.push((p.side === 'L' ? -p.u : p.u) * 1.4, p.x / HULL_LEN * 4); }
  for (let s = 0; s < STATIONS; s++) {
    for (let k = 0; k < 2 * P - 2; k++) {
      if (inHole(s, k)) continue;
      const a = idx(s, k), b = idx(s, k + 1), c = idx(s + 1, k), d = idx(s + 1, k + 1);
      indices.push(a, c, b, b, c, d);
    }
  }
  // stern transom cap and bow-tip cap (fans from each end ring's centroid) — without
  // these the hull is an open tube and daylight leaks straight through at both ends
  for (const ring of [rings[0], rings[STATIONS]]) {
    const sIdx = ring === rings[0] ? 0 : STATIONS, base = positions.length / 3;
    const cx = ring.reduce((a, p) => a + p.x, 0) / ring.length, cy = ring.reduce((a, p) => a + p.y, 0) / ring.length;
    positions.push(cx, cy, 0); uvs.push(0, 0);
    for (let k = 0; k < ring.length - 1; k++) {
      if (sIdx === 0) indices.push(base, idx(sIdx, k + 1), idx(sIdx, k));
      else indices.push(base, idx(sIdx, k), idx(sIdx, k + 1));
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, matWood);
  mesh.material.side = THREE.DoubleSide; // so the hollow interior renders when seen through the hole
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}
function hullHalfWidthAt(t, u) {
  const wScale = lenTaper(t);
  let lo = PROFILE[0], hi = PROFILE[P - 1];
  for (let i = 0; i < P - 1; i++) if (u >= PROFILE[i][0] && u <= PROFILE[i + 1][0]) { lo = PROFILE[i]; hi = PROFILE[i + 1]; break; }
  const span = hi[0] - lo[0], k = span > 1e-6 ? (u - lo[0]) / span : 0;
  return (lo[1] + (hi[1] - lo[1]) * k) * HALF_BEAM * wScale;
}
const hull = buildHull();
wreck.add(hull);

// interior deck: a walkable lower-hold floor, following the hull's own taper, that a
// visitor reaches through the cannonball hole in the starboard side.
const FLOOR_U = 0.34;
{
  const positions = [], indices = [];
  const segs = 36, x0 = -HULL_LEN * 0.42, x1 = HULL_LEN * 0.4;
  for (let s = 0; s <= segs; s++) {
    const x = x0 + (x1 - x0) * (s / segs), t = (x + HULL_LEN / 2) / HULL_LEN;
    const y = sheer(t) + FLOOR_U * hHeight(t), r = hullHalfWidthAt(t, FLOOR_U) * 0.94;
    positions.push(x, y, -r, x, y, r);
  }
  for (let s = 0; s < segs; s++) { const a = s * 2, b = a + 1, c = a + 2, d = a + 3; indices.push(a, c, b, b, c, d); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.computeVertexNormals();
  const uvArr = []; for (let i = 0; i < positions.length / 3; i++) uvArr.push((i % 2), Math.floor(i / 2) / segs * 6);
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvArr, 2));
  const floor = new THREE.Mesh(geo, matWoodDark);
  floor.receiveShadow = floor.castShadow = true;
  wreck.add(floor);
}
// interior frames (the hull's structural ribs), spaced along the walkable hold
for (let s = 6; s <= STATIONS - 6; s += 4) {
  const t = s / STATIONS, x = -HULL_LEN / 2 + t * HULL_LEN, h = hHeight(t), y0 = sheer(t);
  const g = new THREE.Group();
  for (let seg = 0; seg < 10; seg++) {
    const u0 = seg / 10, u1 = (seg + 1) / 10;
    const r0 = hullHalfWidthAt(t, u0) * 0.92, r1 = hullHalfWidthAt(t, u1) * 0.92;
    for (const side of [-1, 1]) {
      const a = new THREE.Vector3(x, y0 + u0 * h, side * r0), b = new THREE.Vector3(x, y0 + u1 * h, side * r1);
      const mid = a.clone().add(b).multiplyScalar(0.5), dir = b.clone().sub(a);
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.055, dir.length(), 6), matWoodDark);
      beam.position.copy(mid);
      beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      beam.castShadow = true;
      g.add(beam);
    }
  }
  wreck.add(g);
}
// a horizontal deck beam over the hold, near the hole, to walk under
for (const s of [HOLE_S0 - 3, HOLE_S1 + 3]) {
  const t = s / STATIONS, x = -HULL_LEN / 2 + t * HULL_LEN, h = hHeight(t), y0 = sheer(t);
  const r = hullHalfWidthAt(t, 0.92) * 1.7;
  const beam = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, r), matWoodDark);
  beam.position.set(x, y0 + 0.95 * h, 0);
  beam.castShadow = beam.receiveShadow = true;
  wreck.add(beam);
}
// splinter shards scattered around the hole — sells the "broken by a cannonball" story
{
  const holeT = ((HOLE_S0 + HOLE_S1) / 2) / STATIONS, holeX = -HULL_LEN / 2 + holeT * HULL_LEN;
  const holeY = sheer(holeT) + 0.7 * hHeight(holeT), holeR = hullHalfWidthAt(holeT, 0.7);
  for (let i = 0; i < 10; i++) {
    const shard = new THREE.Mesh(new THREE.ConeGeometry(0.04 + rnd() * 0.05, 0.3 + rnd() * 0.5, 4), matWood);
    const a = rnd() * Math.PI * 2, rr = 0.3 + rnd() * 1.1;
    shard.position.set(holeX + (rnd() - 0.5) * 1.6, holeY + Math.sin(a) * rr * 0.6, holeR + (rnd() - 0.5) * 0.6);
    shard.rotation.set(rnd() * Math.PI, rnd() * Math.PI, rnd() * Math.PI);
    shard.castShadow = true;
    wreck.add(shard);
  }
}
// upper (weather) deck, with the classic broken-planks gap, sized to the real hull width
for (let s = 4; s <= STATIONS - 4; s++) {
  if (s % 6 < 2 && s > STATIONS * 0.3 && s < STATIONS * 0.65) continue; // storm-broken gap
  const t = s / STATIONS, x = -HULL_LEN / 2 + t * HULL_LEN, h = hHeight(t), y0 = sheer(t);
  const r = hullHalfWidthAt(t, 1.0);
  if (r < 0.15) continue;
  const plank = new THREE.Mesh(new THREE.BoxGeometry(HULL_LEN / STATIONS * 1.3, 0.07, r * 1.9), matWood);
  plank.position.set(x, y0 + h * 1.0, 0);
  plank.rotation.z = 0.02 * (rnd() - 0.5);
  plank.castShadow = plank.receiveShadow = true;
  wreck.add(plank);
}
// two masts, broken, resting across the deck (a warship's scale needs more than one)
for (const [x, z, len] of [[-3.5, 0.4, 11], [2.8, -0.5, 8.5]]) {
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.26, len, 14), matWoodDark);
  mast.position.set(x, hHeight(0.5) + 0.5, z);
  mast.rotation.set(0.15 + rnd() * 0.15, rnd() * 0.6, 1.2 + rnd() * 0.3);
  mast.castShadow = true;
  wreck.add(mast);
  const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.6, 14), matWoodDark);
  stump.position.set(x, hHeight(0.5) + 0.3, z);
  stump.castShadow = true;
  wreck.add(stump);
}

// rusted anchor, hanging off the bow
const anchorGroup = new THREE.Group();
const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 10), matMetal);
shank.castShadow = true;
anchorGroup.add(shank);
const stock = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.8, 8), matMetal);
stock.rotation.z = Math.PI / 2; stock.position.y = 0.58; stock.castShadow = true;
anchorGroup.add(stock);
for (const s of [-1, 1]) {
  const fluke = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.72, 4), matMetal);
  fluke.position.set(s * 0.26, -0.8, 0); fluke.rotation.z = s * 0.9; fluke.castShadow = true;
  anchorGroup.add(fluke);
}
anchorGroup.position.set(HULL_LEN * 0.42, hHeight(0.9) * 0.4, hullHalfWidthAt(0.9, 0.5) + 0.3);
anchorGroup.rotation.z = 0.3;
wreck.add(anchorGroup);

// coral growth patches directly on the hull exterior (skipping the hole itself)
for (let i = 0; i < 40; i++) {
  const t = rnd(), x = -HULL_LEN / 2 + t * HULL_LEN, side = rnd() > 0.5 ? 1 : -1, u = rnd();
  if (t > HOLE_S0 / STATIONS - 0.03 && t < HOLE_S1 / STATIONS + 0.03 && side > 0 && u > 0.4 && u < 0.85) continue;
  const r = hullHalfWidthAt(t, u);
  if (r < 0.1) continue;
  const cl = coralCluster(0.3 + rnd() * 0.55);
  cl.position.set(x, sheer(t) + u * hHeight(t), side * r);
  cl.lookAt(cl.position.clone().add(new THREE.Vector3(0, 0, side)));
  wreck.add(cl);
}

wreck.rotation.z = -0.1; // a slight list, but standing — this is a ship to walk into, not lying flat
wreck.position.set(0, 0.3, 0);
scene.add(wreck);
const holeWorld = (() => { const t = ((HOLE_S0 + HOLE_S1) / 2) / STATIONS, x = -HULL_LEN / 2 + t * HULL_LEN, y = sheer(t) + 0.72 * hHeight(t), r = hullHalfWidthAt(t, 0.72);
  const p = new THREE.Vector3(x, y, r); wreck.localToWorld(p); return p; })();
const interiorWorld = (() => { const t = ((HOLE_S0 + HOLE_S1) / 2) / STATIONS, x = -HULL_LEN / 2 + t * HULL_LEN, y = sheer(t) + FLOOR_U * hHeight(t) + 1.5;
  const p = new THREE.Vector3(x, y, 0); wreck.localToWorld(p); return p; })();

// scattered broken barrels / crates for storytelling — some outside, some in the hold
function barrel() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.34, 0.6, 16), matWood);
  body.castShadow = body.receiveShadow = true;
  g.add(body);
  for (const y of [-0.24, 0.24]) {
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.02, 6, 20), matMetal);
    band.rotation.x = Math.PI / 2; band.position.y = y;
    g.add(band);
  }
  return g;
}
for (let i = 0; i < 3; i++) {
  const b = barrel();
  b.position.set(-3 + rnd() * 2, 0.3, 6 + rnd() * 1.5);
  b.rotation.set(rnd() * 0.6 - 0.3, rnd() * 6, Math.PI / 2 * (rnd() > 0.5 ? 1 : 0));
  scene.add(b);
}
// crates inside the hold, near the entrance
for (let i = 0; i < 4; i++) {
  const crate = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), matWood);
  crate.castShadow = crate.receiveShadow = true;
  const t = 0.46 + rnd() * 0.12, x = -HULL_LEN / 2 + t * HULL_LEN, y = sheer(t) + FLOOR_U * hHeight(t) + 0.26;
  crate.position.set(x, y, 0.9 + rnd() * 0.6); // kept to one side so the centre walkway stays clear
  crate.rotation.y = rnd() * Math.PI;
  wreck.add(crate);
  const b2 = barrel(); b2.scale.setScalar(0.85);
  b2.position.set(x + (rnd() - 0.5) * 1.5, y - 0.06, 0.9 + rnd() * 0.6);
  wreck.add(b2);
}

// =====================================================================
// Lighting: a sunlit-from-above look with soft fill and a rim light.
// =====================================================================
setProgress(0.7, 'جارٍ ضبط الإضاءة…');
scene.add(new THREE.AmbientLight(0x5a9ab0, 0.85));
const sun = new THREE.DirectionalLight(0xfff2da, 4.2);
sun.position.set(6, 18, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18; sun.shadow.camera.top = 18; sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
sun.shadow.bias = -0.0015;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x3fa0c0, 0.4);
fill.position.set(-8, 4, -6);
scene.add(fill);
const rim = new THREE.PointLight(0x7fe8d8, 1.5, 20, 2);
rim.position.set(-2, 3, -5);
scene.add(rim);

// volumetric-looking light shafts (additive-blended cones, animated)
const shaftTex = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 256;
  const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, 'rgba(255,255,255,.65)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 256);
  return new THREE.CanvasTexture(c);
})();
const shafts = [];
for (let i = 0; i < 5; i++) {
  const shaft = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 22), new THREE.MeshBasicMaterial({ map: shaftTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, opacity: 0.14 }));
  shaft.position.set((rnd() - 0.5) * 20, 11, (rnd() - 0.5) * 14);
  shaft.rotation.x = 0.12; shaft.rotation.y = rnd() * Math.PI;
  scene.add(shaft); shafts.push(shaft);
}

// rising bubble particles
const bubbleGeo = new THREE.BufferGeometry();
const N = 260;
const bubblePos = new Float32Array(N * 3);
const bubbleSpeed = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const a = rnd() * Math.PI * 2, r = rnd() * 18;
  bubblePos[i * 3] = Math.cos(a) * r; bubblePos[i * 3 + 1] = rnd() * 14; bubblePos[i * 3 + 2] = Math.sin(a) * r;
  bubbleSpeed[i] = 0.3 + rnd() * 0.5;
}
bubbleGeo.setAttribute('position', new THREE.BufferAttribute(bubblePos, 3));
const bubbleTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 4; x.beginPath(); x.arc(32, 32, 22, 0, Math.PI * 2); x.stroke();
  return new THREE.CanvasTexture(c);
})();
const bubbles = new THREE.Points(bubbleGeo, new THREE.PointsMaterial({ map: bubbleTex, size: 0.12, transparent: true, opacity: 0.75, depthWrite: false, sizeAttenuation: true }));
scene.add(bubbles);

// floating particulate ("marine snow") for depth cues
const dustGeo = new THREE.BufferGeometry();
const D = 400;
const dustPos = new Float32Array(D * 3);
for (let i = 0; i < D; i++) { dustPos[i * 3] = (rnd() - 0.5) * 40; dustPos[i * 3 + 1] = rnd() * 14; dustPos[i * 3 + 2] = (rnd() - 0.5) * 40; }
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xbfe0e8, size: 0.02, transparent: true, opacity: 0.5, depthWrite: false }));
scene.add(dust);

// =====================================================================
// Post-processing: bloom + ACES tonemapping (set on renderer) for a cinematic look.
// =====================================================================
setProgress(0.85, 'جارٍ تجهيز التأثيرات البصرية…');
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// =====================================================================
// Controls: smooth damped orbit for precise, cinematic movement.
// =====================================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 38;
controls.maxPolarAngle = Math.PI * 0.53;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// =====================================================================
// Two viewing modes: an exterior hero orbit, and stepping inside through the
// cannonball hole to look around the hold — a smooth camera tween between them,
// not physics-based walking, since this is a viewing showcase.
// =====================================================================
let insideShip = false;
function flyCamera(toPos, toTarget, dur = 1.6) {
  const fromPos = camera.position.clone(), fromTarget = controls.target.clone();
  controls.enabled = false; controls.autoRotate = false;
  const t0 = performance.now();
  function step() {
    const k = Math.min(1, (performance.now() - t0) / (dur * 1000));
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    if (k < 1) requestAnimationFrame(step); else controls.enabled = true;
  }
  step();
}
function enterShip() {
  insideShip = true;
  controls.minDistance = 0.3; controls.maxDistance = 9; controls.maxPolarAngle = Math.PI * 0.85;
  const approach = holeWorld.clone().add(new THREE.Vector3(2.2, 0.4, 2.4));
  flyCamera(approach, holeWorld, 1.1);
  const standPos = interiorWorld.clone().add(new THREE.Vector3(-3.2, -0.9, -0.6));
  const lookAt = interiorWorld.clone().add(new THREE.Vector3(3, -1.1, -0.6));
  setTimeout(() => flyCamera(standPos, lookAt, 1.5), 1150);
  modeBtn.textContent = '🔭 اخرج إلى المنظر الخارجي';
}
function exitShip() {
  insideShip = false;
  controls.minDistance = 5; controls.maxDistance = 38; controls.maxPolarAngle = Math.PI * 0.53;
  flyCamera(new THREE.Vector3(14, 8, 17), new THREE.Vector3(0, 2.2, 0), 1.6);
  modeBtn.textContent = '🚪 ادخل السفينة من الفتحة';
}
const modeBtn = document.createElement('button');
modeBtn.textContent = '🚪 ادخل السفينة من الفتحة';
modeBtn.style.cssText = 'position:fixed;left:18px;bottom:52px;z-index:6;pointer-events:auto;border:0;cursor:pointer;' +
  'font:inherit;font-weight:800;font-size:14px;color:#04141e;background:linear-gradient(180deg,#7fe8d8,#3fd0c0);' +
  'padding:11px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.4)';
modeBtn.addEventListener('click', () => (insideShip ? exitShip() : enterShip()));
document.body.appendChild(modeBtn);

// =====================================================================
// Resize + render loop
// =====================================================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
const fpsEl = document.getElementById('fps');
let frames = 0, fpsT = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;

  const pos = bubbleGeo.attributes.position;
  for (let i = 0; i < N; i++) {
    let y = pos.getY(i) + bubbleSpeed[i] * dt;
    if (y > 14) y = 0;
    pos.setY(i, y);
    pos.setX(i, pos.getX(i) + Math.sin(t * 0.6 + i) * 0.002);
  }
  pos.needsUpdate = true;

  for (const [i, s] of shafts.entries()) s.material.opacity = 0.1 + Math.sin(t * 0.3 + i) * 0.04;
  dust.rotation.y = t * 0.01;
  rim.intensity = 1.3 + Math.sin(t * 0.8) * 0.3;

  controls.update();
  composer.render();

  frames++; fpsT += dt;
  if (fpsT > 0.5) { fpsEl.textContent = Math.round(frames / fpsT) + ' fps'; frames = 0; fpsT = 0; }
}

setProgress(1, 'جاهز!');
setTimeout(() => { loadingEl.style.opacity = '0'; setTimeout(() => loadingEl.remove(), 650); }, 300);
animate();

window.__t = { ready: () => true, camera, scene, wreck, woodCanvas, coralC, sandC, rockC, metalC, controls };
</script>
