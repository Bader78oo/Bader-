<style>
  :root {
    --ink: #1f3a4d;
    --sand: #e7d9ad;
    --sun: #f4b942;
    --om-red: #d6172b;
    --om-green: #00843d;
    --paper: #fffdf7;
    --deep: #0c3a52;
    --font: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #0c3a52; font-family: var(--font); color: var(--ink); }
  #loader {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(#0c3a52, #157089); text-align: center; padding-inline: 16px; color: #fff;
  }
  #loader .flag { display: flex; width: 84px; height: 48px; margin: 0 auto 14px; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  #loader .flag i { display: block; }
  #loader b { display: block; font-size: clamp(26px, 6vw, 42px); font-weight: 800; }
  #loader span { font-size: 18px; opacity: .85; }
  #start { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }
  #start button { border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 22px; color: var(--ink);

  #start #govr { background: #2a9d8f; color: #fff; }
  #start button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #menuBtn { pointer-events: auto; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 15px;
    background: #7a5cff; color: #fff; border-radius: 999px; padding: 8px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #turnL, #turnR { pointer-events: auto; border: 0; cursor: pointer; font-size: 18px; background: #fffdf7;
    border-radius: 999px; width: 40px; height: 40px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #topbar {
    position: fixed; top: env(safe-area-inset-top, 0px); inset-inline: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 16px; pointer-events: none;
  }
  #topbar .hint {
    background: rgba(12, 58, 82, .82); color: #fff; border-radius: 999px; padding: 6px 14px;
    font-size: 15px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }

</style>
<script>
  // Components must be registered before the scene is parsed.
  AFRAME.registerComponent('snap-turn', {
    // Right (and left) thumbstick: flick sideways to turn 30°. Arrow keys do the same on desktop.
    schema: { angle: { default: 30 } },
    init() {
      this.latched = false;
      this.cam = document.getElementById('cam');
      const onMove = e => {
        const x = e.detail.x;
        if (!this.latched && Math.abs(x) > 0.65) { this.latched = true; this.turn(x > 0 ? -1 : 1); }
        else if (Math.abs(x) < 0.3) this.latched = false;
      };
      this.el.querySelectorAll('[laser-controls]').forEach(h => h.addEventListener('thumbstickmoved', onMove));
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') this.turn(1);
        if (e.key === 'ArrowRight') this.turn(-1);
      });
    },
    turn(dir) {
      const o = this.el.object3D, before = new THREE.Vector3(), after = new THREE.Vector3();
      this.cam.object3D.getWorldPosition(before);
      o.rotation.y += dir * this.data.angle * Math.PI / 180;
      o.updateMatrixWorld(true);
      this.cam.object3D.getWorldPosition(after);
      o.position.x += before.x - after.x; o.position.z += before.z - after.z;
      this.el.emit('snapturn');
    }
  });
</script>

<body>
<div id="loader"><div>
  <div class="flag" aria-hidden="true"><i style="width:33%;background:var(--om-red)"></i><i style="flex:1;background:linear-gradient(#fff 0 33.3%,var(--om-red) 33.3% 66.6%,var(--om-green) 66.6%)"></i></div>
  <b>سَفِينَةُ مَسْقَطَ الْغَارِقَةُ</b>
  <span id="loading">جَارٍ تَجْهِيزُ الْغَوْصَةِ…</span>
  <div id="start" hidden>
    <button id="go" type="button">🤿 هَيَّا نَغُوصُ</button>
    <button id="govr" type="button" hidden>🥽 ادْخُلْ بِالنَّظَّارَةِ</button>
  </div>
</div></div>
<div id="topbar">
  <span class="hint">اسحب لتنظر حولك • المس الأماكن اللامعة • ← → للالتفاف • زر VR للنظارة</span>
  <span style="display:flex;gap:8px"><button id="turnL" type="button">↩️</button><button id="turnR" type="button">↪️</button><button id="menuBtn" type="button">🎮 القائمة</button><button id="sound" type="button" aria-pressed="true">🔊 الصوت</button></span>
</div>

<a-scene id="scene" loading-screen="enabled: false" renderer="antialias: true; foveationLevel: 1; highRefreshRate: true"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 80" background="color: #0c3a52">
  <a-entity light="type: hemisphere; color: #bfe8f2; groundColor: #1a4a3a; intensity: 1.1"></a-entity>
  <a-entity light="type: directional; color: #cdeaff; intensity: 1.1" position="1 14 2"></a-entity>
  <a-entity light="type: directional; color: #2a9d8f; intensity: 0.3" position="-6 3 -8"></a-entity>

  <a-entity id="rig" snap-turn>
    <a-entity id="cam" camera="near: 0.05; far: 900" look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
    <a-entity id="handR" laser-controls="hand: right" raycaster="objects: .clickable; far: 80; lineColor: #7fe8d8; lineOpacity: 0.9"></a-entity>
    <a-entity id="handL" laser-controls="hand: left" raycaster="objects: .clickable; far: 80; lineColor: #7fe8d8; lineOpacity: 0.9"></a-entity>
    <!-- Hand tracking: only active when the headset sees bare hands (controllers set down), inert otherwise. -->
    <a-entity id="handTR" hand-tracking-controls="hand: right; modelStyle: mesh"></a-entity>
    <a-entity id="handTL" hand-tracking-controls="hand: left; modelStyle: mesh"></a-entity>
  </a-entity>

  <a-entity id="world"></a-entity>
  <a-entity id="ui"></a-entity>
</a-scene>

<script>
(() => {
  'use strict';
  const L = window.LESSON, T = THREE;
  const TEST = /[?&]test\b/.test(location.search);
  const WALK_R = 15; // how far from the centre the child may walk

  const rad = d => d * Math.PI / 180;
  const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const scene = document.getElementById('scene');
  const worldEl = document.getElementById('world');
  const uiEl = document.getElementById('ui');
  const camEl = document.getElementById('cam');

  // =====================================================================
  // Geometry kit: builds each model from simple shapes, then merges them into
  // one vertex-coloured mesh (one draw call per model — important on Quest).
  // =====================================================================
  const MAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0 });
  const MAT_FLAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true });
  const GEO = {
    sph: new T.SphereGeometry(1, 24, 18),
    sphLo: new T.SphereGeometry(1, 10, 8),
    cyl: (rt, rb, h, s = 16) => new T.CylinderGeometry(rt, rb, h, s),
    cone: (r, h, s = 16) => new T.ConeGeometry(r, h, s),
    box: (w, h, d) => new T.BoxGeometry(w, h, d),
    tor: (R, r, arc = Math.PI * 2) => new T.TorusGeometry(R, r, 8, 20, arc),
    ico: (r, d = 0) => new T.IcosahedronGeometry(r, d),
  };
  const _m = new T.Matrix4(), _q = new T.Quaternion(), _e = new T.Euler(), _p = new T.Vector3(), _s = new T.Vector3();

  class Kit {
    constructor() { this.smooth = []; this.flat = []; }
    add(geo, color, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1], flat = false) {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      _e.set(r[0], r[1], r[2], r[3] || 'XYZ'); _q.setFromEuler(_e);
      _m.compose(_p.set(p[0], p[1], p[2]), _q, _s.set(s[0], s[1], s[2]));
      const n = g.attributes.position.count, col = new Float32Array(n * 3), pos = g.attributes.position;
      if (Array.isArray(color)) {
        const c0 = new T.Color(color[0]), c1 = new T.Color(color[1]), c = new T.Color();
        g.computeBoundingBox(); const y0 = g.boundingBox.min.y, y1 = g.boundingBox.max.y;
        for (let i = 0; i < n; i++) { c.copy(c0).lerp(c1, (pos.getY(i) - y0) / Math.max(1e-6, y1 - y0)); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      } else {
        const c = new T.Color(color);
        for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      }
      g.setAttribute('color', new T.BufferAttribute(col, 3));
      g.applyMatrix4(_m);
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(k)) g.deleteAttribute(k);
      (flat ? this.flat : this.smooth).push(g);
      return this;
    }
    ell(color, p, s, r = [0, 0, 0], flat = false) {
      const big = Math.max(s[0], s[1], s[2]) > 0.09;
      return this.add(big ? GEO.sph : GEO.sphLo, color, p, r, s, flat);
    }
    build() {
      const g = new T.Group();
      if (this.smooth.length) g.add(new T.Mesh(merge(this.smooth), MAT));
      if (this.flat.length) g.add(new T.Mesh(merge(this.flat), MAT_FLAT));
      return g;
    }
  }
  function merge(list) {
    let n = 0; for (const g of list) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    for (const g of list) {
      pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); col.set(g.attributes.color.array, o * 3);
      o += g.attributes.position.count; g.dispose();
    }
    const out = new T.BufferGeometry();
    out.setAttribute('position', new T.BufferAttribute(pos, 3));
    out.setAttribute('normal', new T.BufferAttribute(nor, 3));
    out.setAttribute('color', new T.BufferAttribute(col, 3));
    out.computeBoundingSphere(); out.computeBoundingBox();
    return out;
  }
  const _up = new T.Vector3(0, 1, 0);
  function seg(k, color, a, b, r1, r2, flat = false) {
    const A = new T.Vector3(...a), B = new T.Vector3(...b), d = B.clone().sub(A);
    const q = new T.Quaternion().setFromUnitVectors(_up, d.clone().normalize());
    const e = new T.Euler().setFromQuaternion(q);
    const mid = A.clone().add(B).multiplyScalar(0.5);
    k.add(GEO.cyl(r2, r1, d.length(), 12), color, mid.toArray(), [e.x, e.y, e.z], [1, 1, 1], flat);
  }
  function limb(k, color, pts, r0, r1) {
    for (let i = 0; i < pts.length - 1; i++) {
      const a = r0 + (r1 - r0) * i / (pts.length - 1), b = r0 + (r1 - r0) * (i + 1) / (pts.length - 1);
      seg(k, color, pts[i], pts[i + 1], a, b);
      if (i > 0) k.ell(color, pts[i], [a, a, a]);
    }
  }
  function eyes2(k, x, y, z, r, o = {}) {
    const iris = o.iris || '#4a2e14', ry = o.ry || 0;
    for (const s of [-1, 1]) {
      const d = [s * Math.sin(ry), 0, Math.cos(ry)], P = (f, up = 0, side = 0) => [s * x + d[0] * f + side * d[2] * s, y + up, z + d[2] * f - side * d[0] * s];
      const rot = [0, s * ry, 0];
      k.ell('#ffffff', P(0), [r, r * 1.08, r * 0.72], rot);
      k.ell(iris, P(r * 0.52, -r * 0.04), [r * 0.66, r * 0.7, r * 0.38], rot);
      k.ell('#111111', P(r * 0.7, -r * 0.04), [r * 0.36, r * 0.38, r * 0.2], rot);
      k.ell('#ffffff', P(r * 0.86, r * 0.26, r * 0.2), [r * 0.2, r * 0.2, r * 0.08], rot);
      k.ell('#ffffff', P(r * 0.86, -r * 0.3, -r * 0.24), [r * 0.09, r * 0.09, r * 0.05], rot);
    }
  }
  function heightOf(obj) { const b = new T.Box3().setFromObject(obj); return b.max.y - b.min.y; }

  // =====================================================================
  // Sea creature and ship models. Each faces +Z (unless noted), stands on y = 0.
  // =====================================================================
  const MODELS = {
    fish(main = '#f4b942', accent = '#e8672f') {
      const k = new Kit();
      k.ell(main, [0, 0, 0], [0.16, 0.14, 0.26]);
      k.ell(accent, [0, 0.02, -0.02], [0.14, 0.1, 0.2]);
      k.ell(main, [0, 0.1, -0.16], [0.09, 0.11, 0.09]);
      k.ell(accent, [0, 0, -0.32], [0.02, 0.14, 0.14], [0, 0, 0.6]);
      k.ell(accent, [0, 0, 0.32], [0.02, 0.14, 0.14], [0, 0, -0.6]);
      for (const s of [-1, 1]) k.ell(accent, [s * 0.14, -0.02, 0.02], [0.09, 0.02, 0.06], [0, 0, s * 0.5]);
      eyes2(k, 0.12, 0.05, 0.19, 0.035);
      return k.build();
    },
    crab(color = '#d6483a') {
      const k = new Kit(), dark = '#8a2a20';
      k.ell(color, [0, 0.09, 0], [0.22, 0.1, 0.26]);
      for (const s of [-1, 1]) {
        seg(k, color, [s * 0.2, 0.09, 0.1], [s * 0.36, 0.1, 0.28], 0.04, 0.03);
        k.ell(color, [s * 0.4, 0.11, 0.32], [0.09, 0.06, 0.07]);
        k.ell(dark, [s * 0.46, 0.11, 0.4], [0.05, 0.035, 0.04]);
      }
      for (const s of [-1, 1]) for (const i of [0, 1, 2]) {
        const z = -0.12 + i * 0.12;
        limb(k, color, [[s * 0.2, 0.08, z], [s * 0.32, 0.02, z + 0.03], [s * 0.38, -0.02, z + 0.05]], 0.025, 0.012);
      }
      eyes2(k, 0.07, 0.16, 0.2, 0.03);
      return k.build();
    },
    turtle(color = '#3f8f6a') {
      const k = new Kit(), belly = '#e8d9a8', dark = '#245a44';
      k.ell(dark, [0, 0.18, 0], [0.32, 0.16, 0.4]);
      k.ell(color, [0, 0.19, 0], [0.28, 0.13, 0.35]);
      k.ell(belly, [0, 0.06, 0], [0.24, 0.06, 0.32]);
      k.ell(color, [0, 0.11, 0.38], [0.13, 0.11, 0.15]);
      eyes2(k, 0.08, 0.15, 0.48, 0.025);
      for (const [sx, sz, fx] of [[-1, 1, 0.28], [1, 1, 0.28], [-1, -1, 0.24], [1, -1, 0.24]])
        k.ell(color, [sx * fx, 0.08, sz * 0.3], [0.14, 0.04, 0.1], [0, 0, sx * 0.3]);
      return k.build();
    },
    eel(color = '#5a7a4a') {
      const k = new Kit(), spot = '#3a5a30';
      const pts = []; for (let i = 0; i <= 8; i++) pts.push([Math.sin(i * 0.5) * 0.15, 0.05, -0.5 + i * 0.14]);
      limb(k, color, pts, 0.09, 0.02);
      for (let i = 2; i < 7; i += 2) k.ell(spot, pts[i], [0.04, 0.04, 0.04]);
      eyes2(k, 0.05, 0.06, pts[0][2] - 0.03, 0.022);
      return k.build();
    },
    octopus(color = '#a15fa0') {
      const k = new Kit(), spot = '#7a3f7a';
      k.ell(color, [0, 0.22, 0], [0.2, 0.22, 0.2]);
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI * 2 / 8, x0 = Math.sin(a) * 0.14, z0 = Math.cos(a) * 0.14;
        limb(k, color, [[x0, 0.08, z0], [x0 * 1.9, 0.03, z0 * 1.9], [x0 * 2.6 + Math.sin(a + 1) * 0.06, 0.01, z0 * 2.6 + Math.cos(a + 1) * 0.06]], 0.045, 0.012);
      }
      for (const [x, y, z] of [[0.06, 0.28, 0.05], [-0.05, 0.24, 0.08], [0.02, 0.15, 0.1]]) k.ell(spot, [x, y, z], [0.02, 0.02, 0.02]);
      eyes2(k, 0.09, 0.24, 0.15, 0.035);
      return k.build();
    },
  };

  // =====================================================================
  // Salem — the Omani guide character, verbatim from earlier lessons.
  // =====================================================================
  const SALEM_TEX = {};
  function kummaTexture() {
    if (SALEM_TEX.kumma) return SALEM_TEX.kumma;
    const W = 1024, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#fbfaf3'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#e4e0d2';
    for (let yy = 8; yy < H; yy += 9) for (let xx = (yy % 18) / 2; xx < W; xx += 9) { x.beginPath(); x.arc(xx, yy, 1.3, 0, Math.PI * 2); x.fill(); }
    const teal = '#15807f', maroon = '#8c1c3a', gold = '#c9971c', navy = '#24407a', green = '#2f7d3a';
    const band = (y, h, col) => { x.fillStyle = col; x.fillRect(0, y, W, h); };
    const zig = (y, h, col, n) => { x.fillStyle = col; x.beginPath(); for (let i = 0; i <= n; i++) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0)); } for (let i = n; i >= 0; i--) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0) + 4); } x.fill(); };
    band(0, 7, teal); zig(10, 10, maroon, 64); band(26, 3, gold);
    const n = 8, cy = 128;
    for (let i = 0; i < n; i++) {
      const cx = (i + 0.5) * W / n;
      const star = (r, col) => { x.fillStyle = col; x.beginPath(); for (let j = 0; j < 16; j++) { const a = j * Math.PI / 8, rr = j % 2 ? r * 0.7 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath(); x.fill(); };
      star(52, [teal, navy, maroon, green][i % 4]); star(40, '#fbfaf3'); star(32, [maroon, gold, teal, navy][i % 4]);
      x.fillStyle = '#fbfaf3'; x.beginPath(); x.arc(cx, cy, 16, 0, Math.PI * 2); x.fill();
      x.fillStyle = gold; x.beginPath(); x.arc(cx, cy, 9, 0, Math.PI * 2); x.fill();
      for (let j = 0; j < 8; j++) { const a = j * Math.PI / 4; x.fillStyle = teal; x.beginPath(); x.arc(cx + Math.cos(a) * 24, cy + Math.sin(a) * 24, 2.4, 0, Math.PI * 2); x.fill(); }
      const mx = cx + W / n / 2;
      for (const dy of [-34, 0, 34]) { x.fillStyle = dy ? gold : maroon; x.beginPath(); x.moveTo(mx, cy + dy - 9); x.lineTo(mx + 7, cy + dy); x.lineTo(mx, cy + dy + 9); x.lineTo(mx - 7, cy + dy); x.fill(); }
    }
    band(H - 29, 3, gold); zig(H - 22, 10, maroon, 64); band(H - 7, 7, teal);
    const side = new T.CanvasTexture(c); side.colorSpace = T.SRGBColorSpace; side.wrapS = T.RepeatWrapping; side.anisotropy = maxAniso;
    const t = document.createElement('canvas'); t.width = t.height = 512;
    const y = t.getContext('2d');
    y.fillStyle = '#fbfaf3'; y.fillRect(0, 0, 512, 512);
    const ring = (r, col, w) => { y.strokeStyle = col; y.lineWidth = w; y.beginPath(); y.arc(256, 256, r, 0, Math.PI * 2); y.stroke(); };
    for (let r = 230; r > 60; r -= 26) ring(r, [teal, maroon, gold, navy][(r / 26 | 0) % 4], 5);
    for (let j = 0; j < 24; j++) {
      const a = j * Math.PI / 12; y.fillStyle = j % 2 ? maroon : teal;
      y.save(); y.translate(256 + Math.cos(a) * 150, 256 + Math.sin(a) * 150); y.rotate(a);
      y.beginPath(); y.ellipse(0, 0, 22, 8, 0, 0, Math.PI * 2); y.fill(); y.restore();
    }

    k.add(GEO.box(1.1, 0.9, 4.6), wood, [0, 0.45, 0], [0, 0, 0], [1, 1, 1], true);
    k.add(GEO.box(1.35, 0.35, 4.7), woodDark, [0, 0.06, 0], [0, 0, 0], [1, 1, 1], true);
    // bow and stern taper
    k.add(GEO.cone(0.65, 1.3, 4), wood[1], [0, 0.45, 2.5], [Math.PI / 2, 0, 0.78], [1, 0.7, 1], true);
    k.ell(wood[1], [0, 0.5, -2.5], [0.5, 0.5, 0.5]);
    // deck planks, some broken/missing
    for (let i = -10; i <= 10; i++) {
      if (broken && (i === -3 || i === 1 || i === 5)) continue; // gaps
      k.add(GEO.box(1.0, 0.05, 0.2), i % 2 ? wood[0] : wood[1], [0, 0.92, i * 0.21], [0, 0, broken && i % 4 === 0 ? 0.15 : 0], [1, 1, 1], true);
    }
    // broken mast, tilted
    seg(k, woodDark, [0, 0.9, 0.3], [0.9, 3.1, 0.9], 0.09, 0.05);
    k.ell(woodDark, [0.9, 3.1, 0.9], [0.07, 0.07, 0.07]);
    // crow's nest ring
    k.add(GEO.tor(0.24, 0.03), woodDark, [0.55, 2.1, 0.65], [Math.PI / 2, 0, 0]);
    // portholes
    for (const [x, z] of [[0.55, 1.4], [0.55, 0.6], [0.55, -0.4], [0.55, -1.2]]) {
      k.add(GEO.tor(0.13, 0.025), metal, [x, 0.55, z], [0, Math.PI / 2, 0]);
      k.ell('#0b2530', [x + 0.03, 0.55, z], [0.02, 0.11, 0.11], [0, Math.PI / 2, 0]);
    }
    // anchor + chain at the bow
    const ak = new Kit();
    ak.add(GEO.tor(0.09, 0.018), metal, [0, 1.2, 2.4], [Math.PI / 2, 0, 0]);
    for (let i = 0; i < 6; i++) ak.ell(metal, [0.02 * (i % 2 ? 1 : -1), 1.05 - i * 0.13, 2.4], [0.045, 0.06, 0.03]);
    ak.add(GEO.cyl(0.02, 0.02, 0.5, 8), metal, [0, 0.15, 2.4], [Math.PI / 2, 0, 0]);
    for (const s of [-1, 1]) ak.add(GEO.cyl(0.02, 0.02, 0.32, 8), metal, [s * 0.16, 0.15, 2.4], [0, 0, Math.PI / 2]);
    const ship = k.build(); ship.add(ak.build());
    // coral & anemone growth patches over the hull (marks the passage of time)
    const ck = new Kit(); const coralCols = ['#e8672f', '#c94f8a', '#7fd8c8', '#e8a13f'];
    for (let i = 0; i < 34; i++) {
      const z = -2.2 + rnd() * 4.6, ang = rnd() * 6.28, x = Math.sin(ang) * 0.58, y = 0.15 + rnd() * 0.85;
      ck.ell(coralCols[i % coralCols.length], [x, y, z], [0.05 + rnd() * 0.05, 0.05 + rnd() * 0.05, 0.05 + rnd() * 0.05]);
    }
    ship.add(ck.build());
    // draped seaweed
    const wk = new Kit();
    for (let i = 0; i < 10; i++) {
      const z = -2 + rnd() * 4, x = Math.sin(rnd() * 6.28) * 0.6, h = 0.3 + rnd() * 0.5;
      seg(wk, '#2f7d4f', [x, 0.9, z], [x + (rnd() - 0.5) * 0.3, 0.9 - h, z], 0.03, 0.01);
    }

  }
  function buildShip() {

    blobShadow(worldEl.object3D, 3.2, SHIP_POS[0], SHIP_POS[2]);
    // discovery hotspots: glowing markers at points around the ship, in world space
    const localSpots = {

    const markerTex = (() => {

  // ---------- Sea creatures roaming near the ship, and inside it ----------
  function scatterCreatures() {
    const near = [
      { id: 'fish', n: 5, r0: 2, r1: 6 }, { id: 'turtle', n: 1, r0: 3, r1: 7 }, { id: 'crab', n: 2, r0: 1, r1: 3 },
    ];
    for (const grp of near) for (let i = 0; i < grp.n; i++) {
      const a = rnd() * 360, r = grp.r0 + rnd() * (grp.r1 - grp.r0), [x, z] = polar(a, r);
      const m = MODELS[grp.id](); const y = grp.id === 'crab' ? 0 : 0.8 + rnd() * 1.4;
      m.position.set(SHIP_POS[0] + x, y, SHIP_POS[2] + z); m.rotation.y = rnd() * 6.28;
      const scale = grp.id === 'fish' ? 1.4 : grp.id === 'turtle' ? 2.2 : 1.6; m.scale.setScalar(scale);
      worldEl.object3D.add(m);
      const home = m.position.clone(), ph = rnd() * 6;
      idlers.push({ step(t) {
        if (grp.id === 'crab') { m.position.x = home.x + Math.sin(t * 0.3 + ph) * 0.3; m.position.z = home.z + Math.cos(t * 0.4 + ph) * 0.3; return; }
        const a2 = t * 0.15 + ph;
        m.position.x = home.x + Math.sin(a2) * 0.6; m.position.z = home.z + Math.cos(a2) * 0.6;
        m.position.y = home.y + Math.sin(t * 0.6 + ph) * 0.15;
        m.rotation.y = -a2 + Math.PI / 2;

  }

  // =====================================================================
  // Panels near the child

  let panel = null, infoCard = null, hudMesh = null;
  const inXR = () => scene.is('vr-mode') || scene.is('ar-mode');
  function eyeY() { return Math.min(1.75, Math.max(1.0, camPos.y - 0.08)); }
  function frontOf(dist, dirOverride) {
    const dir = dirOverride ? dirOverride.clone() : new T.Vector3();
    if (!dirOverride) scene.camera.getWorldDirection(dir);
    dir.y = 0; if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1); dir.normalize();
    const d = dist * (!inXR() && innerWidth < innerHeight ? 1.7 : 1);
    return { pos: new T.Vector3(camPos.x + dir.x * d, 0, camPos.z + dir.z * d), rotY: Math.atan2(-dir.x, -dir.z) };
  }
  function place(el, dist, dir, halfW) {
    const { pos, rotY } = frontOf(dist, dir);
    pos.y = eyeY();
    el.object3D.position.copy(pos); el.object3D.rotation.set(0, rotY, 0);
    el.object3D.scale.setScalar(0.6);
    tween(0.25, k => el.object3D.scale.setScalar(0.6 + 0.4 * (1 - Math.pow(1 - k, 3))));
    salemBeside(pos, rotY, halfW);

  function closePanel() { if (panel) { panel.remove(); panel = null; } }

  function showPanel(spec, buttons = [], dist = 2.2) {
    closePanel(); closeInfo();
    const el = document.createElement('a-entity'); uiEl.appendChild(el);
    const card = planeMesh(cardCanvas(spec), spec.w);
    el.object3D.add(card);
    const h = card.userData.h;
    const bw = Math.min(0.95, (spec.w - 0.2) / Math.max(1, buttons.length) - 0.08);
    buttons.forEach((b, i) => {
      const btn = button(b.label, el, { w: bw, h: 0.22, color: b.color || C.sun, text: b.text || C.ink }, b.onClick);
      const n = buttons.length, x = (n - 1 - i - (n - 1) / 2) * (bw + 0.1);
      btn.object3D.position.set(x, -h / 2 - 0.09, 0.02);
    });
    card.position.y = buttons.length ? 0.12 : 0;
    el.object3D.children.forEach(o => { if (o !== card) o.position.y += 0.12; });

    place(el, dist, null, spec.w / 2);

  function setHud(text, sub) {
    const W = 900, H = 170, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = 'rgba(12,58,82,.88)'; x.beginPath(); x.roundRect(4, 4, W - 8, H - 8, (H - 8) / 2); x.fill();
    x.fillStyle = C.red; x.fillRect(H / 2, 4, 90, 8); x.fillStyle = '#fff'; x.fillRect(H / 2 + 90, 4, 90, 8); x.fillStyle = C.green; x.fillRect(H / 2 + 180, 4, 90, 8);
    x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
    let fs = sub ? 54 : 62; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(text).width > W - 90 && fs > 26) { fs -= 3; x.font = `800 ${fs}px ${FONT}`; }

    const banner = planeMesh(introCanvas(), 2.8); banner.position.set(0, eyeY() + 0.55, 0.05); el.object3D.add(banner);
    banner.scale.setScalar(0.01);
    tween(0.9, t => { const e = 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2); banner.scale.setScalar(Math.max(0.01, e)); });

    setMood('wave'); sfx.fanfare();
    for (let i = 0; i < 5; i++) setTimeout(() => {

    }, 300 + i * 650);

    setTimeout(() => { setMood('cheer'); }, 2400);

  function handWalk(he) {

    const v = 7.5, g = 9.8; let hit = null, last = o.clone();

      const t = i * 0.05, p = new T.Vector3(o.x + dir.x * v * t, o.y + dir.y * v * t - 0.5 * g * t * t, o.z + dir.z * v * t);

      last = p;

  }

    buttons: () => [...(panel ? panel.querySelectorAll('.clickable') : [])],
    stageEls: () => stage ? [...stage.el.querySelectorAll('.clickable')] : [],
    spots: () => [...spotEls.keys()], spotEls, discovered: () => [...discovered],
    spotClick: id => spotEls.get(id) && spotEls.get(id).emit('click'),
    enter: () => stageEnter(), habitat: () => startHabitat(), quiz: () => quizIntro(),
    interiorClick: id => interiorEls.get(id) && interiorEls.get(id).emit('click'), exitShip: () => exitShip(),
    quizStart: startQuiz, quizPick: i => quizAnswer(L.quiz[quiz.i], i),
    habitatPick: id => { const c = L.creatures.find(x => x.id === id); const t = habitatUi.tiles[L.creatures.indexOf(c)]; t.emit('click'); },
    bottleCarry: () => { if (game.lostEl) { game.lostEl.emit('mousedown', { cursorEl: hands[0] }, false); onBottleDrop(game.lostEl, salem.root.position.clone()); } },
    walk: (x, z) => walkToNow(new T.Vector3(x, 0, z)),
    turn: dir => rigEl.components['snap-turn'].turn(dir),
    gazeAt: el => { gazeTarget = el; }, gazeTarget: () => gazeTarget, handPinch: (id, on) => document.getElementById(id).emit(on ? 'pinchstarted' : 'pinchended'),
    menu: () => openLevelMenu(), menuItems: () => MENU_ITEMS.map(i => i.label), menuPick: i => menuTiles[i].emit('click'),
    companion: () => ({ stage: companion.stage, xp: hub.xp() }), showCompanion, journal: () => hub.journalList(), showJournal,
    portal: () => onPortal('صَغِيرِ الْإِنْسَانِ وَصَغِيرِ الْحَيَوَانِ', '../lesson-02-young-animals/'), portalWent: () => window.__portalWent, portalConfirm: () => panel.querySelectorAll('.clickable')[0].emit('click'),
  };

  // ---------- Boot ----------
  async function boot() {
    const timeout = ms => new Promise(r => setTimeout(r, ms));
    await Promise.race([
      Promise.all([document.fonts.load(`800 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`600 40px "Baloo Bhaijaan 2"`, 'عربي'),
        document.fonts.load(`700 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`40px "Noto Color Emoji"`, '🐪')]),
      timeout(3500),
    ]).catch(() => {});
    try { maxAniso = scene.renderer.capabilities.getMaxAnisotropy(); } catch (e) { /* keep default */ }
    buildSeabed();
    buildShip();
    scatterCreatures();
    hub.recordVisit(LESSON_ID);
    buildCompanionEntity();
    buildPortal('صَغِيرِ الْإِنْسَانِ وَصَغِيرِ الْحَيَوَانِ', '٢ — صَغِيرُ الْإِنْسَانِ وَصَغِيرُ الْحَيَوَانِ 🦁', '../lesson-02-young-animals/');
    salem = buildSalem(); salem.baseY = 0;
    scene.object3D.add(salem.root);
    document.getElementById('menuBtn').addEventListener('click', () => { unlockAudio(); openLevelMenu(); });
    const snapTurn = () => rigEl.components['snap-turn'];
    document.getElementById('turnL').addEventListener('click', () => { unlockAudio(); snapTurn().turn(1); });
    document.getElementById('turnR').addEventListener('click', () => { unlockAudio(); snapTurn().turn(-1); });
    scene.addEventListener('enter-vr', setupHandInteract, { once: true });
    if (TEST) setupHandInteract();
    const begin = () => {
      document.getElementById('loader').hidden = true;
      unlockAudio();
      setTimeout(intro, 150);
    };
    document.getElementById('loading').hidden = true;
    document.getElementById('start').hidden = false;
    document.getElementById('go').addEventListener('click', begin);
    const vrBtn = document.getElementById('govr');
    if (navigator.xr && navigator.xr.isSessionSupported) navigator.xr.isSessionSupported('immersive-vr').then(ok => { vrBtn.hidden = !ok; }).catch(() => {});
    vrBtn.addEventListener('click', () => { try { scene.enterVR(); } catch (e) { /* stays on screen */ } begin(); });
    if (TEST) begin();
  }
  if (scene.hasLoaded) boot(); else scene.addEventListener('loaded', boot);
})();
</script>
</body>
