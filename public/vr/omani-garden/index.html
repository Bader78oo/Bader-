<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<style>
  :root {
    --ink: #1f3a4d; --sand: #f6e7c8; --sun: #f4b942; --om-red: #d6172b; --om-green: #00843d; --paper: #fffdf7;
    --font: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #cdeefc; font-family: var(--font); color: var(--ink); }
  #loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(#bfe6fb, #f6e7c8); text-align: center; padding-inline: 16px; }
  #loader .flag { display: flex; width: 84px; height: 48px; margin: 0 auto 14px; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px rgba(31,58,77,.2); }
  #loader .flag i { display: block; }
  #loader b { display: block; font-size: clamp(26px, 6vw, 42px); font-weight: 800; }
  #loader span { font-size: 18px; opacity: .8; }
  #topbar { position: fixed; top: env(safe-area-inset-top, 0px); inset-inline: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; pointer-events: none; }
  #topbar .hint { background: rgba(255, 253, 247, .94); border-radius: 999px; padding: 6px 14px;
    font-size: 15px; font-weight: 700; box-shadow: 0 2px 8px rgba(31, 58, 77, .15); }
  #turnL, #turnR { pointer-events: auto; border: 0; cursor: pointer; font-size: 18px; background: #fffdf7;
    border-radius: 999px; width: 40px; height: 40px; box-shadow: 0 2px 8px rgba(31, 58, 77, .2); }
  #sound { pointer-events: auto; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 15px;
    background: var(--sun); color: var(--ink); border-radius: 999px; padding: 8px 14px; box-shadow: 0 2px 8px rgba(31, 58, 77, .2); }
  #sound:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .a-enter-vr { z-index: 11; }
  [hidden] { display: none !important; }
</style>
<script>
  AFRAME.registerComponent('snap-turn', {
    schema: { angle: { default: 30 } },
    init() {
      this.latched = false;
      this.cam = document.getElementById('cam');
      const onMove = e => {
        const x = e.detail.x;
        if (!this.latched && Math.abs(x) > 0.65) { this.latched = true; this.turn(x > 0 ? -1 : 1); }
        else if (Math.abs(x) < 0.3) this.latched = false;
      };
      this.el.querySelectorAll('[laser-controls]').forEach(h => h.addEventListener('thumbstickmoved', onMove));
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') this.turn(1);
        if (e.key === 'ArrowRight') this.turn(-1);
      });
    },
    turn(dir) {
      const o = this.el.object3D, before = new THREE.Vector3(), after = new THREE.Vector3();
      this.cam.object3D.getWorldPosition(before);
      o.rotation.y += dir * this.data.angle * Math.PI / 180;
      o.updateMatrixWorld(true);
      this.cam.object3D.getWorldPosition(after);
      o.position.x += before.x - after.x; o.position.z += before.z - after.z;
      this.el.emit('snapturn');
    }
  });
</script>
</head>
<body>
<div id="loader"><div>
  <div class="flag" aria-hidden="true"><i style="width:33%;background:var(--om-red)"></i><i style="flex:1;background:linear-gradient(#fff 0 33.3%,var(--om-red) 33.3% 66.6%,var(--om-green) 66.6%)"></i></div>
  <b>ازْرَعْ وَاحْصُدِ الثَّمَرَةَ</b>
  <span>جَارٍ تَجْهِيزُ الْمَشْتَلِ…</span>
</div></div>
<div id="topbar">
  <span class="hint">اسحب لتنظر حولك • المس النبتات • ← → للالتفاف • زر VR للنظارة</span>
  <span style="display:flex;gap:8px"><button id="turnL" type="button">↩️</button><button id="turnR" type="button">↪️</button><button id="sound" type="button" aria-pressed="true">🔊 الصوت</button></span>
</div>

<a-scene id="scene" loading-screen="enabled: false" renderer="antialias: true; foveationLevel: 1; highRefreshRate: true"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 80" background="color: #cdeefc">
  <a-entity light="type: hemisphere; color: #e6f5ff; groundColor: #a08a62; intensity: 1.25"></a-entity>
  <a-entity light="type: directional; color: #fff0d2; intensity: 1.55" position="-6 12 8"></a-entity>
  <a-entity light="type: directional; color: #cfe6ff; intensity: 0.35" position="8 5 -6"></a-entity>

  <a-entity id="rig" snap-turn>
    <a-entity id="cam" camera="near: 0.05; far: 900" look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
    <a-entity id="handR" laser-controls="hand: right" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
    <a-entity id="handL" laser-controls="hand: left" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
    <a-entity id="handTR" hand-tracking-controls="hand: right; modelStyle: mesh"></a-entity>
    <a-entity id="handTL" hand-tracking-controls="hand: left; modelStyle: mesh"></a-entity>
  </a-entity>

  <a-entity id="world"></a-entity>
  <a-entity id="ui"></a-entity>
</a-scene>

<script>
(() => {
  'use strict';
  const L = window.LESSON, T = THREE;
  const POTS = L.pots, STAGES = L.stages;
  const EXPLORE_GOAL = POTS.length, POT_R = 3.3;
  const TEST = /[?&]test\b/.test(location.search);

  const rad = d => d * Math.PI / 180;
  const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const potById = id => POTS.find(p => p.id === id);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const scene = document.getElementById('scene');
  const worldEl = document.getElementById('world');
  const uiEl = document.getElementById('ui');
  const camEl = document.getElementById('cam');

  // =====================================================================
  // Geometry kit
  // =====================================================================
  const MAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0 });
  const MAT_FLAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true });
  const GEO = {
    sph: new T.SphereGeometry(1, 24, 18), sphLo: new T.SphereGeometry(1, 10, 8),
    cyl: (rt, rb, h, s = 16) => new T.CylinderGeometry(rt, rb, h, s),
    cone: (r, h, s = 16) => new T.ConeGeometry(r, h, s),
    box: (w, h, d) => new T.BoxGeometry(w, h, d),
    tor: (R, r, arc = Math.PI * 2) => new T.TorusGeometry(R, r, 8, 20, arc),
    ico: (r, d = 0) => new T.IcosahedronGeometry(r, d),
  };
  const _m = new T.Matrix4(), _q = new T.Quaternion(), _e = new T.Euler(), _p = new T.Vector3(), _s = new T.Vector3();
  class Kit {
    constructor() { this.smooth = []; this.flat = []; }
    add(geo, color, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1], flat = false) {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      _e.set(r[0], r[1], r[2], r[3] || 'XYZ'); _q.setFromEuler(_e);
      _m.compose(_p.set(p[0], p[1], p[2]), _q, _s.set(s[0], s[1], s[2]));
      const n = g.attributes.position.count, col = new Float32Array(n * 3), pos = g.attributes.position;
      if (Array.isArray(color)) {
        const c0 = new T.Color(color[0]), c1 = new T.Color(color[1]), c = new T.Color();
        g.computeBoundingBox(); const y0 = g.boundingBox.min.y, y1 = g.boundingBox.max.y;
        for (let i = 0; i < n; i++) { c.copy(c0).lerp(c1, (pos.getY(i) - y0) / Math.max(1e-6, y1 - y0)); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      } else { const c = new T.Color(color); for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; } }
      g.setAttribute('color', new T.BufferAttribute(col, 3));
      g.applyMatrix4(_m);
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(k)) g.deleteAttribute(k);
      (flat ? this.flat : this.smooth).push(g);
      return this;
    }
    ell(color, p, s, r = [0, 0, 0], flat = false) { const big = Math.max(s[0], s[1], s[2]) > 0.09; return this.add(big ? GEO.sph : GEO.sphLo, color, p, r, s, flat); }
    build() { const g = new T.Group(); if (this.smooth.length) g.add(new T.Mesh(merge(this.smooth), MAT)); if (this.flat.length) g.add(new T.Mesh(merge(this.flat), MAT_FLAT)); return g; }
  }
  function merge(list) {
    let n = 0; for (const g of list) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    for (const g of list) { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); col.set(g.attributes.color.array, o * 3); o += g.attributes.position.count; g.dispose(); }
    const out = new T.BufferGeometry();
    out.setAttribute('position', new T.BufferAttribute(pos, 3)); out.setAttribute('normal', new T.BufferAttribute(nor, 3)); out.setAttribute('color', new T.BufferAttribute(col, 3));
    out.computeBoundingSphere(); out.computeBoundingBox();
    return out;
  }
  const _up = new T.Vector3(0, 1, 0);
  function seg(k, color, a, b, r1, r2, flat = false) {
    const A = new T.Vector3(...a), B = new T.Vector3(...b), d = B.clone().sub(A);
    const q = new T.Quaternion().setFromUnitVectors(_up, d.clone().normalize());
    const e = new T.Euler().setFromQuaternion(q);
    const mid = A.clone().add(B).multiplyScalar(0.5);
    k.add(GEO.cyl(r2, r1, d.length(), 12), color, mid.toArray(), [e.x, e.y, e.z], [1, 1, 1], flat);
  }
  function heightOf(obj) { const b = new T.Box3().setFromObject(obj); return b.max.y - b.min.y; }
  const jitter = (geo, amt) => {
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) if (p.getY(i) > -geo.parameters.height / 2 + 0.01) p.setXYZ(i, p.getX(i) + (rnd() - 0.5) * amt, p.getY(i) + (rnd() - 0.5) * amt * 0.6, p.getZ(i) + (rnd() - 0.5) * amt);
    geo.computeVertexNormals(); return geo;
  };

  // =====================================================================
  // Plants: a generic bushy herb (tomato/strawberry) and a small potted tree
  // (lemon/apple), each built at any of the 6 growth stages.
  // =====================================================================
  function bushPlant(p, stage) {
    const k = new Kit(), stemC = '#3f7d3f', leaf1 = '#4f9d5d', leaf2 = '#6fae6a';
    if (stage <= 1) { k.ell(leaf1, [0, 0.03, 0], [0.05, 0.03, 0.05]); return k.build(); }
    const h = 0.1 + stage * 0.09;
    seg(k, stemC, [0, 0, 0], [0, h, 0], 0.025, 0.014);
    const leaves = 4 + stage * 2;
    for (let i = 0; i < leaves; i++) {
      const a = (i / leaves) * Math.PI * 2 + rnd(), y = 0.08 + (i % (stage + 1)) * (h / (stage + 2));
      k.ell(i % 2 ? leaf1 : leaf2, [Math.cos(a) * 0.13, y, Math.sin(a) * 0.13], [0.09, 0.045, 0.13], [0.25, a, 0]);
    }
    if (stage >= 5) for (let i = 0; i < 5; i++) { const a = i * 1.3 + 0.4; k.ell(p.flower, [Math.cos(a) * 0.15, h * 0.75, Math.sin(a) * 0.15], [0.032, 0.032, 0.032]); }
    if (stage >= 6) for (let i = 0; i < 6; i++) { const a = i * 1.1; k.ell(p.fruit, [Math.cos(a) * 0.17, h * 0.5 + (i % 3) * 0.04, Math.sin(a) * 0.17], [0.05, 0.05, 0.05]); }
    return k.build();
  }
  function potTree(p, stage) {
    const k = new Kit(), trunk = '#7a5234', leaf1 = '#3f8f4f', leaf2 = '#59a862';
    const h = 0.18 + stage * 0.16;
    seg(k, trunk, [0, 0, 0], [0, h, 0], 0.045, 0.028);
    if (stage <= 1) { k.ell(leaf1, [0, h, 0], [0.07, 0.07, 0.07]); return k.build(); }
    const canopyR = 0.14 + stage * 0.035;
    const n = 10 + stage * 3;
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, el2 = rnd() * Math.PI - Math.PI / 2, r = canopyR * (0.6 + rnd() * 0.5);
      const x = Math.cos(a) * Math.cos(el2) * r, z = Math.sin(a) * Math.cos(el2) * r, y = h + Math.sin(el2) * r * 0.7;
      k.ell(i % 2 ? leaf1 : leaf2, [x, y, z], [0.06, 0.06, 0.06]);
    }
    if (stage >= 5) for (let i = 0; i < 6; i++) { const a = i * 1.1; k.ell(p.flower, [Math.cos(a) * canopyR * 0.7, h + 0.03, Math.sin(a) * canopyR * 0.7], [0.03, 0.03, 0.03]); }
    if (stage >= 6) for (let i = 0; i < 7; i++) { const a = i * 0.95 + 0.3; k.ell(p.fruit, [Math.cos(a) * canopyR * 0.75, h - 0.04 + (i % 3) * 0.05, Math.sin(a) * canopyR * 0.75], [0.055, 0.055, 0.055]); }
    return k.build();
  }
  function terracottaPot(r = 0.42, h = 0.4) {
    const k = new Kit(), clay = '#b5673c', clayD = '#9a5430', rim = '#c67a4c';
    k.add(GEO.cyl(r, r * 0.72, h, 20), [clayD, clay], [0, h / 2, 0]);
    k.add(GEO.cyl(r * 1.05, r * 1.0, 0.06, 20), rim, [0, h + 0.02, 0]);
    k.add(GEO.cyl(r * 1.15, r * 1.15, 0.03, 20), clayD, [0, -0.015, 0]);
    return k.build();
  }

  // =====================================================================
  // Salem — the Omani guide character
  // =====================================================================
  const SALEM_TEX = {};
  function kummaTexture() {
    if (SALEM_TEX.kumma) return SALEM_TEX.kumma;
    const W = 1024, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#fbfaf3'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#e4e0d2';
    for (let yy = 8; yy < H; yy += 9) for (let xx = (yy % 18) / 2; xx < W; xx += 9) { x.beginPath(); x.arc(xx, yy, 1.3, 0, Math.PI * 2); x.fill(); }
    const teal = '#15807f', maroon = '#8c1c3a', gold = '#c9971c', navy = '#24407a', green = '#2f7d3a';
    const band = (y, h, col) => { x.fillStyle = col; x.fillRect(0, y, W, h); };
    const zig = (y, h, col, n) => { x.fillStyle = col; x.beginPath(); for (let i = 0; i <= n; i++) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0)); } for (let i = n; i >= 0; i--) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0) + 4); } x.fill(); };
    band(0, 7, teal); zig(10, 10, maroon, 64); band(26, 3, gold);
    const n = 8, cy = 128;
    for (let i = 0; i < n; i++) {
      const cx = (i + 0.5) * W / n;
      const star = (r, col) => { x.fillStyle = col; x.beginPath(); for (let j = 0; j < 16; j++) { const a = j * Math.PI / 8, rr = j % 2 ? r * 0.7 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath(); x.fill(); };
      star(52, [teal, navy, maroon, green][i % 4]); star(40, '#fbfaf3'); star(32, [maroon, gold, teal, navy][i % 4]);
      x.fillStyle = '#fbfaf3'; x.beginPath(); x.arc(cx, cy, 16, 0, Math.PI * 2); x.fill();
      x.fillStyle = gold; x.beginPath(); x.arc(cx, cy, 9, 0, Math.PI * 2); x.fill();
      for (let j = 0; j < 8; j++) { const a = j * Math.PI / 4; x.fillStyle = teal; x.beginPath(); x.arc(cx + Math.cos(a) * 24, cy + Math.sin(a) * 24, 2.4, 0, Math.PI * 2); x.fill(); }
      const mx = cx + W / n / 2;
      for (const dy of [-34, 0, 34]) { x.fillStyle = dy ? gold : maroon; x.beginPath(); x.moveTo(mx, cy + dy - 9); x.lineTo(mx + 7, cy + dy); x.lineTo(mx, cy + dy + 9); x.lineTo(mx - 7, cy + dy); x.fill(); }
    }
    band(H - 29, 3, gold); zig(H - 22, 10, maroon, 64); band(H - 7, 7, teal);
    const side = new T.CanvasTexture(c); side.colorSpace = T.SRGBColorSpace; side.wrapS = T.RepeatWrapping; side.anisotropy = maxAniso;
    const t = document.createElement('canvas'); t.width = t.height = 512;
    const y = t.getContext('2d');
    y.fillStyle = '#fbfaf3'; y.fillRect(0, 0, 512, 512);
    const ring = (r, col, w) => { y.strokeStyle = col; y.lineWidth = w; y.beginPath(); y.arc(256, 256, r, 0, Math.PI * 2); y.stroke(); };
    for (let r = 230; r > 60; r -= 26) ring(r, [teal, maroon, gold, navy][(r / 26 | 0) % 4], 5);
    for (let j = 0; j < 24; j++) {
      const a = j * Math.PI / 12; y.fillStyle = j % 2 ? maroon : teal;
      y.save(); y.translate(256 + Math.cos(a) * 150, 256 + Math.sin(a) * 150); y.rotate(a);
      y.beginPath(); y.ellipse(0, 0, 22, 8, 0, 0, Math.PI * 2); y.fill(); y.restore();
    }
    y.fillStyle = gold; y.beginPath(); for (let j = 0; j < 16; j++) { const a = j * Math.PI / 8, rr = j % 2 ? 34 : 56; y.lineTo(256 + Math.cos(a) * rr, 256 + Math.sin(a) * rr); } y.fill();
    y.fillStyle = teal; y.beginPath(); y.arc(256, 256, 18, 0, Math.PI * 2); y.fill();
    const top = new T.CanvasTexture(t); top.colorSpace = T.SRGBColorSpace; top.anisotropy = maxAniso;
    return (SALEM_TEX.kumma = { side, top });
  }
  function dishdashaTexture() {
    if (SALEM_TEX.dish) return SALEM_TEX.dish;
    const W = 1024, H = 1024, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#f9f8f3'; x.fillRect(0, 0, W, H);
    for (let i = 0; i < 26; i++) {
      const px = (i + 0.5) * W / 26, g = x.createLinearGradient(px - 18, 0, px + 18, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, 'rgba(120,110,90,0.045)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.fillRect(px - 18, 0, 36, H);
    }
    const thread = '#d6c69c', thread2 = '#bfae82';
    for (const [yy, col] of [[16, thread], [30, thread2], [44, thread]]) { x.fillStyle = col; x.fillRect(0, yy, W, 5); }
    for (let i = 0; i < 64; i++) { x.fillStyle = thread2; x.beginPath(); const px = i * 16 + 8; x.moveTo(px, 52); x.lineTo(px + 6, 60); x.lineTo(px, 68); x.lineTo(px - 6, 60); x.fill(); }
    for (const cx of [0, W]) {
      x.fillStyle = thread; x.fillRect(cx - 14, 0, 28, 300);
      x.fillStyle = '#f9f8f3'; x.fillRect(cx - 9, 0, 18, 296);
      for (let yy = 60; yy < 290; yy += 22) { x.fillStyle = thread2; x.beginPath(); x.moveTo(cx, yy - 7); x.lineTo(cx + 6, yy); x.lineTo(cx, yy + 7); x.lineTo(cx - 6, yy); x.fill(); }
    }
    for (const yy of [H - 26, H - 16]) { x.fillStyle = '#e2dccb'; x.fillRect(0, yy, W, 3); }
    const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = maxAniso;
    t.flipY = true;
    return (SALEM_TEX.dish = t);
  }
  function buildSalem() {
    const root = new T.Group();
    const skin = '#b97a55', white = '#f7f6f1', shade = '#e4e0d4', hair = '#2a1d17';
    const prof = [[0.255, 0.075], [0.25, 0.12], [0.22, 0.35], [0.185, 0.58], [0.18, 0.72], [0.205, 0.83], [0.19, 0.875], [0.12, 0.915], [0.07, 0.935]];
    const lathe = new T.LatheGeometry(prof.map(p => new T.Vector2(...p)), 36);
    const robe = new T.Mesh(lathe, new T.MeshStandardMaterial({ map: dishdashaTexture(), roughness: 0.85 }));
    robe.scale.set(1, 1, 0.82); root.add(robe);
    const k = new Kit();
    k.add(GEO.tor(0.25, 0.008), shade, [0, 0.08, 0], [Math.PI / 2, 0, 0], [1, 0.82, 1]);
    k.add(GEO.tor(0.068, 0.011), '#d6c69c', [0, 0.93, 0.012], [Math.PI / 2 - 0.15, 0, 0]);

  function trackDiscovery(key, icon, label) { hub.recordDiscovery(LESSON_ID, key, icon, label); refreshCompanionIfGrown(); }
  function companionModel(stage) {
    const k = new Kit(), tan = '#c88a4a', dark = '#8a5a2a', cream = '#f4e6c8', speck = '#a87840', eyeC = '#2a1810';
    if (stage === 0) { k.ell(cream, [0, 0.09, 0], [0.09, 0.11, 0.095]); for (const [x, y, z] of [[0.03, 0.14, 0.04], [-0.04, 0.06, -0.03], [0.02, 0.03, 0.06]]) k.ell(speck, [x, y, z], [0.012, 0.01, 0.012]); return k.build(); }
    const s = stage === 1 ? 0.6 : stage === 2 ? 0.85 : 1.1;
    k.ell(tan, [0, 0.11 * s, 0], [0.11 * s, 0.11 * s, 0.14 * s]);
    k.ell(cream, [0, 0.07 * s, 0.06 * s], [0.08 * s, 0.075 * s, 0.09 * s]);
    k.ell(tan, [0, 0.19 * s, 0.08 * s], [0.075 * s, 0.075 * s, 0.075 * s]);
    for (const sx of [-1, 1]) { k.ell('#ffffff', [sx * 0.035 * s, 0.2 * s, 0.13 * s], [0.024 * s, 0.024 * s, 0.02 * s]); k.ell(eyeC, [sx * 0.035 * s, 0.2 * s, 0.145 * s], [0.013 * s, 0.013 * s, 0.008 * s]); }
    k.add(GEO.cone(0.02 * s, 0.045 * s, 8), dark, [0, 0.185 * s, 0.155 * s], [Math.PI / 2, 0, 0]);
    const wingA = stage === 1 ? 0.15 : stage === 2 ? 0.5 : 1.0;
    for (const sx of [-1, 1]) k.ell(dark, [sx * 0.1 * s, 0.1 * s, -0.02 * s], [0.05 * s, 0.09 * s * (0.6 + wingA * 0.5), 0.13 * s], [0, 0, sx * (0.25 + wingA * 0.9)]);
    if (stage >= 2) for (const sx of [-1, 1]) for (let i = 0; i < 3; i++) k.ell(speck, [sx * (0.12 + i * 0.03) * s, 0.03 * s, -0.2 * s], [0.018 * s, 0.012 * s, 0.05 * s], [0, 0, sx * 0.3]);
    if (stage >= 3) k.ell(dark, [0, 0.24 * s, 0.02 * s], [0.02 * s, 0.03 * s, 0.02 * s]);
    for (const sx of [-1, 1]) k.add(GEO.cyl(0.006 * s, 0.005 * s, 0.05 * s, 6), dark, [sx * 0.02 * s, 0.005 * s, 0.02 * s]);

  function portalTexture(t) {
    const c = document.createElement('canvas'); c.width = c.height = 300; const x = c.getContext('2d');
    const g = x.createRadialGradient(150, 150, 10, 150, 150, 150);
    g.addColorStop(0, '#fff3c4'); g.addColorStop(0.5, '#2a9d8f'); g.addColorStop(1, '#1f3a4d');
    x.fillStyle = g; x.beginPath(); x.arc(150, 150, 148, 0, Math.PI * 2); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 3;
    for (let r = 20; r < 145; r += 22) { x.beginPath(); x.arc(150, 150, r + Math.sin(t * 2 + r) * 6, 0, Math.PI * 2); x.stroke(); }
    return c;
  }

    disc.position.set(0, 1.3, 0); g.add(disc); disc.userData.t = rnd() * 6;
    tickers.push({ step() { disc.userData.t += 0.02; disc.material.map.dispose(); disc.material.map = new T.CanvasTexture(portalTexture(disc.userData.t)); disc.material.map.colorSpace = T.SRGBColorSpace; disc.material.needsUpdate = true; } });

  let gazeDot = null, gazeRay = null, gazeTarget = null;
  function buildGazeDot() {

      let held = null;
      he.addEventListener('pinchstarted', () => { if (gazeTarget) { held = gazeTarget; buzz(he, 0.25, 30); held.emit('mousedown', { cursorEl: he }, false); } });
      he.addEventListener('pinchended', () => { if (held) held.emit('click', {}, false); held = null; });
    }
  }
  function buzz(cursorEl, strength = 0.4, ms = 50) {
    try {
      const src = cursorEl && cursorEl.components && cursorEl.components['tracked-controls'] && cursorEl.components['tracked-controls'].controller;
      const act = src && src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0];
      if (act) act.pulse(strength, ms);
    } catch (e) {}
  }

  // Test hooks
  if (TEST) window.__t = {
    mode: () => mode, panel: () => panel,
    buttons: () => [...(panel ? panel.querySelectorAll('.clickable') : [])],
    pots: () => POTS.map(p => p.id), potStage: id => potStage.get(id), discovered: () => [...discovered],
    potClick: id => potEls.get(id).emit('click'),
    explore: () => exploreIntro(), care: () => careIntro(),
    careStart: startCare, carePick: id => { const round = care.rounds[care.i]; const idx = ['water', 'sun', 'soil'].indexOf(id); care.chips[idx] && care.chips[idx].emit('click'); },
    harvest: id => harvest(potById(id)), harvested: () => [...harvested],
    turn: dir => rigEl.components['snap-turn'].turn(dir),
    gazeAt: el => { gazeTarget = el; }, gazeTarget: () => gazeTarget, handPinch: (id, on) => document.getElementById(id).emit(on ? 'pinchstarted' : 'pinchended'),
    companion: () => ({ stage: companion.stage, xp: hub.xp() }), showCompanion, journal: () => hub.journalList(),
    portal: () => onPortal('رِحْلَةِ الْبِيئَاتِ الْمَحَلِّيَّةِ', '../lesson-01-local-habitats/'), portalWent: () => window.__portalWent, portalConfirm: () => panel.querySelectorAll('.clickable')[0].emit('click'),
  };

  const rigEl = document.getElementById('rig');

  // ---------- Boot ----------
  async function boot() {
    const timeout = ms => new Promise(r => setTimeout(r, ms));
    await Promise.race([
      Promise.all([document.fonts.load(`800 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`600 40px "Baloo Bhaijaan 2"`, 'عربي'),
        document.fonts.load(`700 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`40px "Noto Color Emoji"`, '🐪')]),
      timeout(3500),
    ]).catch(() => {});
    try { maxAniso = scene.renderer.capabilities.getMaxAnisotropy(); } catch (e) {}
    buildGarden();
    buildPots();
    worldEl.object3D.add(basketModel());
    hub.recordVisit(LESSON_ID);
    buildCompanionEntity();
    buildPortal('رِحْلَةِ الْبِيئَاتِ الْمَحَلِّيَّةِ', '١ — الْبِيئَاتُ الْمَحَلِّيَّةُ 🌍', '../lesson-01-local-habitats/', 180);
    salem = buildSalem(); salem.baseY = 0;
    scene.object3D.add(salem.root);
    const snapTurn = () => rigEl.components['snap-turn'];
    document.getElementById('turnL').addEventListener('click', () => { unlockAudio(); snapTurn().turn(1); });
    document.getElementById('turnR').addEventListener('click', () => { unlockAudio(); snapTurn().turn(-1); });
    scene.addEventListener('enter-vr', setupHandInteract, { once: true });
    if (TEST) setupHandInteract();
    setTimeout(() => {
      if (scene.camera) scene.camera.getWorldPosition(camPos);
      welcome();
      document.getElementById('loader').hidden = true;
    }, 200);
  }
  if (scene.hasLoaded) boot(); else scene.addEventListener('loaded', boot);
})();
</script>
</body>
</html>
