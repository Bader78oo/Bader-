<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ازرع واحصد الثمرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">

<style>
  :root {
    --ink: #1f3a4d; --sand: #f6e7c8; --sun: #f4b942; --om-red: #d6172b; --om-green: #00843d; --paper: #fffdf7;
    --font: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #cdeefc; font-family: var(--font); color: var(--ink); }
  #loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(#bfe6fb, #f6e7c8); text-align: center; padding-inline: 16px; }
  #loader .flag { display: flex; width: 84px; height: 48px; margin: 0 auto 14px; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px rgba(31,58,77,.2); }
  #loader .flag i { display: block; }
  #loader b { display: block; font-size: clamp(26px, 6vw, 42px); font-weight: 800; }
  #loader span { font-size: 18px; opacity: .8; }
  #topbar { position: fixed; top: env(safe-area-inset-top, 0px); inset-inline: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; pointer-events: none; }
  #topbar .hint { background: rgba(255, 253, 247, .94); border-radius: 999px; padding: 6px 14px;
    font-size: 15px; font-weight: 700; box-shadow: 0 2px 8px rgba(31, 58, 77, .15); }
  #turnL, #turnR { pointer-events: auto; border: 0; cursor: pointer; font-size: 18px; background: #fffdf7;
    border-radius: 999px; width: 40px; height: 40px; box-shadow: 0 2px 8px rgba(31, 58, 77, .2); }
  #sound { pointer-events: auto; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 15px;
    background: var(--sun); color: var(--ink); border-radius: 999px; padding: 8px 14px; box-shadow: 0 2px 8px rgba(31, 58, 77, .2); }
  #sound:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .a-enter-vr { z-index: 11; }
  [hidden] { display: none !important; }
</style>
<script>
  AFRAME.registerComponent('snap-turn', {
    schema: { angle: { default: 30 } },
    init() {
      this.latched = false;
      this.cam = document.getElementById('cam');
      const onMove = e => {
        const x = e.detail.x;
        if (!this.latched && Math.abs(x) > 0.65) { this.latched = true; this.turn(x > 0 ? -1 : 1); }
        else if (Math.abs(x) < 0.3) this.latched = false;
      };
      this.el.querySelectorAll('[laser-controls]').forEach(h => h.addEventListener('thumbstickmoved', onMove));
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') this.turn(1);
        if (e.key === 'ArrowRight') this.turn(-1);
      });
    },
    turn(dir) {
      const o = this.el.object3D, before = new THREE.Vector3(), after = new THREE.Vector3();
      this.cam.object3D.getWorldPosition(before);
      o.rotation.y += dir * this.data.angle * Math.PI / 180;
      o.updateMatrixWorld(true);
      this.cam.object3D.getWorldPosition(after);
      o.position.x += before.x - after.x; o.position.z += before.z - after.z;
      this.el.emit('snapturn');
    }
  });
</script>
</head>
<body>
<div id="loader"><div>
  <div class="flag" aria-hidden="true"><i style="width:33%;background:var(--om-red)"></i><i style="flex:1;background:linear-gradient(#fff 0 33.3%,var(--om-red) 33.3% 66.6%,var(--om-green) 66.6%)"></i></div>
  <b>ازْرَعْ وَاحْصُدِ الثَّمَرَةَ</b>
  <span>جَارٍ تَجْهِيزُ الْمَشْتَلِ…</span>
</div></div>
<div id="topbar">
  <span class="hint">اسحب لتنظر حولك • المس النبتات • ← → للالتفاف • زر VR للنظارة</span>
  <span style="display:flex;gap:8px"><button id="turnL" type="button">↩️</button><button id="turnR" type="button">↪️</button><button id="sound" type="button" aria-pressed="true">🔊 الصوت</button></span>
</div>

<a-scene id="scene" loading-screen="enabled: false" renderer="antialias: true; foveationLevel: 1; highRefreshRate: true"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 80" background="color: #cdeefc"
         fog="type: linear; color: #cdeefc; near: 15; far: 33">
  <a-entity light="type: hemisphere; color: #e6f5ff; groundColor: #a08a62; intensity: 1.25"></a-entity>
  <a-entity light="type: directional; color: #fff0d2; intensity: 1.55" position="-6 12 8"></a-entity>
  <a-entity light="type: directional; color: #cfe6ff; intensity: 0.35" position="8 5 -6"></a-entity>

  <a-entity id="rig" snap-turn>
    <a-entity id="cam" camera="near: 0.05; far: 900" look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
    <a-entity id="handR" laser-controls="hand: right" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
    <a-entity id="handL" laser-controls="hand: left" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
    <a-entity id="handTR" hand-tracking-controls="hand: right; modelStyle: mesh"></a-entity>
    <a-entity id="handTL" hand-tracking-controls="hand: left; modelStyle: mesh"></a-entity>
  </a-entity>

  <a-entity id="world"></a-entity>
  <a-entity id="ui"></a-entity>
</a-scene>

<script>
(() => {
  'use strict';
  const L = window.LESSON, T = THREE;
  const POTS = L.pots, STAGES = L.stages;
  const POT_R = 3.3;
  const TEST = /[?&]test\b/.test(location.search);

  const rad = d => d * Math.PI / 180;
  const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const potById = id => POTS.find(p => p.id === id);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const scene = document.getElementById('scene');
  const worldEl = document.getElementById('world');
  const uiEl = document.getElementById('ui');
  const camEl = document.getElementById('cam');

  // =====================================================================
  // Geometry kit
  // =====================================================================
  const MAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0 });
  const MAT_FLAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true });
  const GEO = {
    sph: new T.SphereGeometry(1, 24, 18), sphLo: new T.SphereGeometry(1, 10, 8),
    cyl: (rt, rb, h, s = 16) => new T.CylinderGeometry(rt, rb, h, s),
    cone: (r, h, s = 16) => new T.ConeGeometry(r, h, s),
    box: (w, h, d) => new T.BoxGeometry(w, h, d),
    tor: (R, r, arc = Math.PI * 2) => new T.TorusGeometry(R, r, 8, 20, arc),
    ico: (r, d = 0) => new T.IcosahedronGeometry(r, d),
  };
  const _m = new T.Matrix4(), _q = new T.Quaternion(), _e = new T.Euler(), _p = new T.Vector3(), _s = new T.Vector3();
  class Kit {
    constructor() { this.smooth = []; this.flat = []; }
    add(geo, color, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1], flat = false) {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      _e.set(r[0], r[1], r[2], r[3] || 'XYZ'); _q.setFromEuler(_e);
      _m.compose(_p.set(p[0], p[1], p[2]), _q, _s.set(s[0], s[1], s[2]));
      const n = g.attributes.position.count, col = new Float32Array(n * 3), pos = g.attributes.position;
      if (Array.isArray(color)) {
        const c0 = new T.Color(color[0]), c1 = new T.Color(color[1]), c = new T.Color();
        g.computeBoundingBox(); const y0 = g.boundingBox.min.y, y1 = g.boundingBox.max.y;
        for (let i = 0; i < n; i++) { c.copy(c0).lerp(c1, (pos.getY(i) - y0) / Math.max(1e-6, y1 - y0)); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      } else { const c = new T.Color(color); for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; } }
      g.setAttribute('color', new T.BufferAttribute(col, 3));
      g.applyMatrix4(_m);
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(k)) g.deleteAttribute(k);
      (flat ? this.flat : this.smooth).push(g);
      return this;
    }
    ell(color, p, s, r = [0, 0, 0], flat = false) { const big = Math.max(s[0], s[1], s[2]) > 0.09; return this.add(big ? GEO.sph : GEO.sphLo, color, p, r, s, flat); }
    build() { const g = new T.Group(); if (this.smooth.length) g.add(new T.Mesh(merge(this.smooth), MAT)); if (this.flat.length) g.add(new T.Mesh(merge(this.flat), MAT_FLAT)); return g; }
  }
  function merge(list) {
    let n = 0; for (const g of list) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    for (const g of list) { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); col.set(g.attributes.color.array, o * 3); o += g.attributes.position.count; g.dispose(); }
    const out = new T.BufferGeometry();
    out.setAttribute('position', new T.BufferAttribute(pos, 3)); out.setAttribute('normal', new T.BufferAttribute(nor, 3)); out.setAttribute('color', new T.BufferAttribute(col, 3));
    out.computeBoundingSphere(); out.computeBoundingBox();
    return out;
  }
  const _up = new T.Vector3(0, 1, 0);
  function seg(k, color, a, b, r1, r2, flat = false) {
    const A = new T.Vector3(...a), B = new T.Vector3(...b), d = B.clone().sub(A);
    const q = new T.Quaternion().setFromUnitVectors(_up, d.clone().normalize());
    const e = new T.Euler().setFromQuaternion(q);
    const mid = A.clone().add(B).multiplyScalar(0.5);
    k.add(GEO.cyl(r2, r1, d.length(), 12), color, mid.toArray(), [e.x, e.y, e.z], [1, 1, 1], flat);
  }
  function heightOf(obj) { const b = new T.Box3().setFromObject(obj); return b.max.y - b.min.y; }
  const jitter = (geo, amt) => {
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) if (p.getY(i) > -geo.parameters.height / 2 + 0.01) p.setXYZ(i, p.getX(i) + (rnd() - 0.5) * amt, p.getY(i) + (rnd() - 0.5) * amt * 0.6, p.getZ(i) + (rnd() - 0.5) * amt);
    geo.computeVertexNormals(); return geo;
  };

  // =====================================================================
  // Plants: a generic bushy herb (tomato/strawberry) and a small potted tree
  // (lemon/apple), each built at any of the 6 growth stages.
  // =====================================================================
  // a thin flat blade, splayed out from a base point at angle `a` and tilted down by `droop` —
  // the same trick the palm fronds use; flat shading keeps each blade's edge crisp instead of
  // reading as a round blob.
  function leafBlade(k, color, base, a, len, width, droop) {
    k.ell(color, [base[0] + Math.cos(a) * len * 0.18, base[1], base[2] + Math.sin(a) * len * 0.18],
      [width, 0.014, len], [droop, a, 0, 'YXZ'], true);
  }
  function bushPlant(p, stage) {
    const k = new Kit(), stemC = '#3f7d3f', leaf1 = '#4f9d5d', leaf2 = '#6fae6a';
    if (stage <= 1) {
      for (let i = 0; i < 2; i++) { const a = i * Math.PI + 0.3; leafBlade(k, leaf1, [0, 0.015, 0], a, 0.08, 0.028, 0.1); }
      return k.build();
    }
    const h = 0.1 + stage * 0.09;
    const stems = stage >= 4 ? 3 : stage >= 2 ? 2 : 1;
    for (let s = 0; s < stems; s++) {
      const sa = (s / stems) * Math.PI * 2 + rnd() * 0.6;
      const sh = h * (0.78 + rnd() * 0.3);
      const sx = Math.cos(sa) * 0.03 * s, sz = Math.sin(sa) * 0.03 * s;
      seg(k, stemC, [sx, 0, sz], [sx * 1.3, sh, sz * 1.3], 0.02, 0.011);
      const leaves = 5 + stage * 2;
      for (let i = 0; i < leaves; i++) {
        const a = (i / leaves) * Math.PI * 2 + rnd() * 0.8 + sa;
        const y = 0.06 + (i % (stage + 1)) * (sh / (stage + 2));
        const len = 0.15 + rnd() * 0.06, droop = 0.2 + rnd() * 0.35;
        leafBlade(k, i % 2 ? leaf1 : leaf2, [sx, y, sz], a, len, 0.03, droop);
      }
    }
    if (stage >= 5) for (let i = 0; i < 5; i++) { const a = i * 1.3 + 0.4; k.ell(p.flower, [Math.cos(a) * 0.15, h * 0.75, Math.sin(a) * 0.15], [0.032, 0.032, 0.032]); }
    if (stage >= 6) for (let i = 0; i < 6; i++) { const a = i * 1.1; k.ell(p.fruit, [Math.cos(a) * 0.17, h * 0.5 + (i % 3) * 0.04, Math.sin(a) * 0.17], [0.05, 0.05, 0.05]); }
    return k.build();
  }
  // a small potted tree with a barked, banded trunk (the same ring technique as the big palms)
  // and a layered canopy of flat leaf-blade clusters instead of round blobs.
  // scatters small flat leaf-blade clumps over the surface of a canopy sphere, each oriented
  // outward from the trunk — many little crisp-edged chips read as full rounded foliage, where
  // blades all converging on one central point read as a spiky starburst instead.
  function treeCanopy(k, leaf1, leaf2, topY, canopyR, layers, perLayer) {
    const total = layers * perLayer;
    for (let i = 0; i < total; i++) {
      const az = rnd() * Math.PI * 2, el = (rnd() - 0.5) * Math.PI * 0.85;
      const rr = canopyR * (0.55 + rnd() * 0.5);
      const cx = Math.cos(az) * Math.cos(el) * rr, cz = Math.sin(az) * Math.cos(el) * rr, cy = topY + Math.sin(el) * rr * 0.75;
      const len = canopyR * (0.3 + rnd() * 0.22);
      leafBlade(k, i % 2 ? leaf1 : leaf2, [cx, cy, cz], az, len, 0.055, 0.15 + rnd() * 0.3);
    }
  }
  function potTree(p, stage) {
    const k = new Kit(), trunkA = '#8a6a45', trunkB = '#7a5234', leaf1 = '#3f8f4f', leaf2 = '#59a862';
    const h = 0.18 + stage * 0.16;
    const segs = Math.max(2, Math.round(h / 0.07));
    for (let i = 0; i < segs; i++) {
      const y0 = i * h / segs, y1 = (i + 1) * h / segs, rr = 0.045 - i * (0.022 / segs);
      k.add(GEO.cyl(Math.max(0.018, rr - 0.012), Math.max(0.022, rr), y1 - y0, 10), i % 2 ? trunkA : trunkB, [0, (y0 + y1) / 2, 0], [0, 0, 0], [1, 1, 1], true);
    }
    if (stage <= 1) { k.ell(leaf1, [0, h, 0], [0.07, 0.07, 0.07]); return k.build(); }
    const canopyR = 0.15 + stage * 0.038;
    treeCanopy(k, leaf1, leaf2, h, canopyR, 2 + Math.min(stage, 3), 6 + stage * 2);
    if (stage >= 5) for (let i = 0; i < 6; i++) { const a = i * 1.1; k.ell(p.flower, [Math.cos(a) * canopyR * 0.7, h + 0.03, Math.sin(a) * canopyR * 0.7], [0.03, 0.03, 0.03]); }
    if (stage >= 6) for (let i = 0; i < 7; i++) { const a = i * 0.95 + 0.3; k.ell(p.fruit, [Math.cos(a) * canopyR * 0.75, h - 0.04 + (i % 3) * 0.05, Math.sin(a) * canopyR * 0.75], [0.055, 0.055, 0.055]); }
    return k.build();
  }
  // a bigger, un-potted version of the same tree for the orchard scattered around the farm
  function orchardTree(ht = 1.6) {
    const k = new Kit(), trunkA = '#8a6a45', trunkB = '#6b4a2e', leaf1 = '#3f8f4f', leaf2 = '#59a862';
    const segs = Math.max(3, Math.round(ht / 0.22)), lean = (rnd() - 0.5) * 0.16;
    for (let i = 0; i < segs; i++) {
      const y0 = i * ht / segs, y1 = (i + 1) * ht / segs, rr = 0.1 - i * (0.07 / segs), lx = lean * (i / segs) * ht;
      k.add(GEO.cyl(Math.max(0.025, rr - 0.018), Math.max(0.035, rr), y1 - y0, 10), i % 2 ? trunkA : trunkB, [lx, (y0 + y1) / 2, 0], [0, 0, lean * 0.5], [1, 1, 1], true);
    }
    treeCanopy(k, leaf1, leaf2, ht * 0.95, ht * 0.55, 4, 13);
    return k.build();
  }
  let clayTex = null;
  function clayTexture() {
    if (clayTex) return clayTex;
    const W = 256, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#c87d4d'); g.addColorStop(0.55, '#b5673c'); g.addColorStop(1, '#8f4e2b');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.strokeStyle = 'rgba(70,35,15,.22)'; x.lineWidth = 2;
    for (let y = 8; y < H; y += 11) { x.beginPath(); x.moveTo(0, y); for (let xx = 0; xx <= W; xx += 16) x.lineTo(xx, y + Math.sin(xx * 0.1 + y) * 1.4); x.stroke(); }
    for (let i = 0; i < 650; i++) {
      x.globalAlpha = 0.1 + rnd() * 0.22; x.fillStyle = rnd() > 0.5 ? '#6f3a1f' : '#e0935e';
      const r = 0.5 + rnd() * 1.6; x.beginPath(); x.arc(rnd() * W, rnd() * H, r, 0, Math.PI * 2); x.fill();
    }
    x.globalAlpha = 1;
    clayTex = texFrom(c); clayTex.wrapS = T.RepeatWrapping; clayTex.wrapT = T.ClampToEdgeWrapping; clayTex.repeat.set(3, 1);
    return clayTex;
  }
  function terracottaPot(r = 0.42, h = 0.4) {
    const k = new Kit(), clayD = '#9a5430', rim = '#c67a4c', soil = '#4a3320', soilD = '#3a2715';
    // open-ended: a closed top would cap the pot with a solid clay "lid", sealing the soil out of
    // sight instead of showing it from above.
    const body = new T.Mesh(new T.CylinderGeometry(r, r * 0.72, h, 24, 1, true), new T.MeshStandardMaterial({ map: clayTexture(), roughness: 0.92, side: T.DoubleSide }));
    body.position.y = h / 2;
    k.add(GEO.cyl(r * 1.05, r * 1.0, 0.06, 20), rim, [0, h + 0.02, 0]);
    k.add(GEO.cyl(r * 0.97, r * 0.97, 0.022, 20), clayD, [0, h * 0.36, 0]);
    k.add(GEO.cyl(r * 0.86, r * 0.86, 0.022, 20), clayD, [0, h * 0.72, 0]);
    k.add(GEO.cyl(r * 1.15, r * 1.15, 0.03, 20), clayD, [0, -0.015, 0]);
    // real soil, visible from directly above, filling the pot almost to the rim
    k.add(GEO.cyl(r * 0.93, r * 0.9, 0.05, 20), [soilD, soil], [0, h - 0.025, 0], [0, 0, 0], [1, 1, 1], true);
    // a dark floor inside, so the now-open-ended body doesn't look hollow from a low angle
    k.add(GEO.cyl(r * 0.68, r * 0.68, 0.02, 20), soilD, [0, 0.05, 0], [0, 0, 0], [1, 1, 1], true);
    const group = k.build();
    group.add(body);
    return group;
  }

  // =====================================================================
  // Salem — the Omani guide character
  // =====================================================================
  const SALEM_TEX = {};
  function kummaTexture() {
    if (SALEM_TEX.kumma) return SALEM_TEX.kumma;
    const W = 1024, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#fbfaf3'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#e4e0d2';
    for (let yy = 8; yy < H; yy += 9) for (let xx = (yy % 18) / 2; xx < W; xx += 9) { x.beginPath(); x.arc(xx, yy, 1.3, 0, Math.PI * 2); x.fill(); }
    const teal = '#15807f', maroon = '#8c1c3a', gold = '#c9971c', navy = '#24407a', green = '#2f7d3a';
    const band = (y, h, col) => { x.fillStyle = col; x.fillRect(0, y, W, h); };
    const zig = (y, h, col, n) => { x.fillStyle = col; x.beginPath(); for (let i = 0; i <= n; i++) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0)); } for (let i = n; i >= 0; i--) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0) + 4); } x.fill(); };
    band(0, 7, teal); zig(10, 10, maroon, 64); band(26, 3, gold);
    const n = 8, cy = 128;
    for (let i = 0; i < n; i++) {
      const cx = (i + 0.5) * W / n;
      const star = (r, col) => { x.fillStyle = col; x.beginPath(); for (let j = 0; j < 16; j++) { const a = j * Math.PI / 8, rr = j % 2 ? r * 0.7 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath(); x.fill(); };
      star(52, [teal, navy, maroon, green][i % 4]); star(40, '#fbfaf3'); star(32, [maroon, gold, teal, navy][i % 4]);

      }, i * 110);
    }
    tween(1.0, () => {}, () => scene.object3D.remove(can));
  }
  function setToolHud(label) {
    if (toolMesh) { toolMesh.parent.remove(toolMesh); toolMesh.material.map.dispose(); toolMesh = null; }
    if (!label) return;
    const c = document.createElement('canvas'); c.width = 460; c.height = 130;
    const x = c.getContext('2d');
    x.fillStyle = 'rgba(31,58,77,.88)'; x.beginPath(); x.roundRect(4, 4, c.width - 8, c.height - 8, 40); x.fill();
    x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#ffe28a';
    let fs = 48; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(label).width > c.width - 40 && fs > 24) { fs -= 2; x.font = `800 ${fs}px ${FONT}`; }
    x.fillText(label, c.width / 2, c.height / 2);
    toolMesh = planeMesh(c, 0.46, { overlay: true });
    toolMesh.position.set(0.5, -0.62, -1); camEl.object3D.add(toolMesh);
  }
  function equip(tool, label) {
    heldTool = tool; sfx.pop(); setToolHud(`✋ ${label}`);
    if (!toolsUsed) { toolsUsed = true; say('tools'); }
    if (mode === 'plant') plantHud();
    updateToolHighlights();
  }
  function onPot(p) {
    const st = plant.get(p.id);
    if (mode === 'plant' && st.step < 3) { handlePlantStep(p, st); return; }
    if (st.needsWater) { handleRewater(p, st); return; }
    if (st.stage === 6 && !harvested.has(p.id)) { harvest(p); return; }
    if (st.stage === 0) return;
    sfx.pop();
    const el = potEls.get(p.id); hop(el);
    showInfo({ w: 1.75, accent: p.accent, icon: p.icon, title: p.name, subtitle: `الْمَرْحَلَةُ ${toAr(st.stage)} مِنْ ٦`,
      blocks: [{ t: p.about, size: 0.07 }, { type: 'chips', label: 'مَرْحَلَةُ النُّمُوِّ:', items: [{ i: '🌱', t: STAGES[st.stage - 1] }] }] }, el.object3D);
  }
  function handlePlantStep(p, st) {
    const el = potEls.get(p.id);
    if (st.step === 0) {
      if (heldTool !== 'trowel') { sfx.bad(); shake(el); return; }
      heldTool = null; setToolHud(null);
      st.step = 1; sfx.pop(); hop(el); animateDig(p); burst(potWorldPos(p)); refreshPotVisual(p);
      if (mode === 'plant') plantHud();
    } else if (st.step === 1) {
      if (heldTool !== 'seed') { sfx.bad(); shake(el); return; }
      heldTool = null; setToolHud(null);
      st.step = 2; sfx.pop(); hop(el); burst(potWorldPos(p)); refreshPotVisual(p);
      say([pick(['praise1', 'praise2', 'praise3']), 'f_' + p.id]);
      if (typeof hub !== 'undefined') trackDiscovery(p.id, p.icon, p.name);
      if (mode === 'plant') plantHud();
    } else if (st.step === 2) {
      if (heldTool !== 'water') { sfx.bad(); shake(el); return; }
      heldTool = null; setToolHud(null);
      st.step = 3; st.stage = 1; st.nextAt = clockT + stageDuration(p); st.readyAt = clockT + 5 * stageDuration(p);
      sfx.good(); setMood('cheer'); hop(el); animateWater(p); burst(potWorldPos(p)); refreshPotVisual(p);
      say(pick(['right1', 'right2', 'right3']));
      plantedCount++;
      if (mode === 'plant') {
        if (plantedCount === Math.ceil(POTS.length / 2)) setTimeout(() => say('half'), 1400);
        if (plantedCount === POTS.length) setTimeout(allPlantedDone, 1800); else plantHud();
      }
    }
    updateToolHighlights();
  }
  function allPlantedDone() {
    mode = 'free'; hideHud();
    showPanel({ w: 2.0, accent: C.gold, icon: '🏆', title: 'زَرَعْتَ كُلَّ النَّبَاتَاتِ!',
      blocks: [{ type: 'stars', n: 3, total: 3 }, { t: 'الْحِينْ رَاقِبْهَا تَكْبُرُ مَرْحَلَةً بَعْدَ مَرْحَلَةٍ، وَاقْطِفِ الثِّمَارَ لَمَّا تَنْضَجُ!', size: 0.062, align: 'center' }] },
      [{ label: 'تَمَامٌ', onClick: closePanel }]);
    setMood('cheer'); say('m1done');
  }
  function onProp(id) { sfx.pop(); setMood('point'); say(id === 'tools' ? 'tools' : 'falaj'); }

  // ---------- growth, over real time ----------
  // every pot pauses once, partway through (stage 3), and needs a second watering to keep going —
  // so the growing period stays interactive instead of being pure wait-and-watch.
  let clockT = 0;
  idlers.push({
    step(t) {
      clockT = t;
      for (const p of POTS) {
        const st = plant.get(p.id);
        if (st.stage < 1 || st.stage >= 6 || st.needsWater) continue;
        if (t >= st.nextAt) {
          st.stage++;
          if (st.stage === 3 && !st.rewateredOnce) {
            st.rewateredOnce = true; st.needsWater = true;
            refreshPotVisual(p); pulse(potEls.get(p.id), true); updateToolHighlights(); say('rewaterPrompt');
            continue;
          }
          st.nextAt = t + stageDuration(p);
          if (st.stage === 6) { refreshPotVisual(p); pulse(potEls.get(p.id), true); say('harvestReady'); continue; }
          refreshPotVisual(p);
        } else {
          const remain = Math.max(0, Math.round(st.readyAt - t));
          if (remain !== st.shownRemain) updatePotLabel(p, st);
        }
      }
    },
  });
  function handleRewater(p, st) {
    if (heldTool !== 'water') { sfx.bad(); shake(potEls.get(p.id)); return; }
    heldTool = null; setToolHud(null);
    st.needsWater = false; st.readyAt = clockT + (6 - st.stage) * stageDuration(p); st.nextAt = clockT + stageDuration(p);
    sfx.good(); setMood('cheer'); hop(potEls.get(p.id)); animateWater(p); burst(potWorldPos(p));
    say(pick(['right1', 'right2', 'right3']));
    pulse(potEls.get(p.id), false); updatePotLabel(p, st); updateToolHighlights();
  }
  // a small colored dot flies from the pot to the basket beside the child, so harvesting reads as
  // "collect the fruit" rather than just a panel popping up.
  // the fruit doesn't vanish once it lands — it stays and piles up in the basket, so every harvest
  // stays visible as proof of what's been picked.
  let basketFillCount = 0;
  function flyToBasket(p) {
    const m = new T.Mesh(new T.SphereGeometry(0.055, 10, 8), new T.MeshStandardMaterial({ color: p.fruit, roughness: 0.55 }));
    const from = potWorldPos(p); m.position.copy(from); scene.object3D.add(m);
    const a = basketFillCount * 1.9 + rnd() * 0.6, r = 0.09 + rnd() * 0.1;
    const to = new T.Vector3(basketPos.x + Math.cos(a) * r, 0.1 + Math.min(basketFillCount, 6) * 0.03, basketPos.z + Math.sin(a) * r);
    basketFillCount++;
    tween(0.65, k => {
      const k2 = k * k * (3 - 2 * k);
      m.position.lerpVectors(from, to, k2);
      m.position.y += Math.sin(k * Math.PI) * 0.4;
    }, () => burst(to.clone().add(new T.Vector3(0, 0.12, 0))));
  }
  function harvest(p) {
    if (harvested.has(p.id)) return;
    harvested.add(p.id); sfx.good(); setMood('cheer');
    pulse(potEls.get(p.id), false);
    burst(potWorldPos(p)); flyToBasket(p);
    say('harvestDone');
    if (typeof hub !== 'undefined') trackDiscovery('harvest_' + p.id, p.icon, p.name + ' (مَحْصُودٌ)');
    showInfo({ w: 1.5, accent: p.accent, icon: p.icon, title: `قَطَفْتَ ${p.name}!`, blocks: [{ t: p.about, size: 0.068 }] }, potEls.get(p.id).object3D);
    if (harvested.size === 2 && !summaryOffered) { summaryOffered = true; setTimeout(offerSummary, 2400); }
  }
  function offerSummary() {
    showPanel({ w: 1.9, accent: C.gold, icon: '🏅', title: 'أَحْسَنْتَ! حَصَدْتَ أَوَّلَ ثِمَارِكَ!',
      blocks: [{ t: 'كَمِّلْ مُرَاقَبَةَ بَقِيَّةِ النَّبَاتَاتِ، أَوِ انْتَقِلْ لِلْمُلَخَّصِ الْآنَ.', size: 0.064, align: 'center' }] },
      [{ label: 'مَاذَا تَعَلَّمْتُ؟', onClick: summary }, { label: 'أُكْمِلُ الْمُرَاقَبَةَ', color: '#dff1ff', onClick: closePanel }]);
  }
  function summary() {
    mode = 'summary'; hideHud(); closePanel();
    showPanel({ w: 2.1, accent: C.teal, icon: '🎓', title: 'مَاذَا تَعَلَّمْتُ؟',
      blocks: [
        { type: 'bullet', t: 'النَّبَاتَاتُ تَمُرُّ بِسِتِّ مَرَاحِلِ نُمُوٍّ: بَذْرَةٌ، إِنْبَاتٌ، شَتْلَةٌ، نَبَاتٌ صَغِيرٌ، إِزْهَارٌ، ثُمَّ ثِمَارٌ.', size: 0.062 },
        { type: 'bullet', t: 'تَحْتَاجُ النَّبَاتَاتُ إِلَى الْمَاءِ وَالشَّمْسِ وَالتُّرْبَةِ لِتَكْبُرَ.', size: 0.062 },
        { type: 'bullet', t: 'الْأَشْجَارُ (مِثْلَ التُّفَّاحِ وَاللَّيْمُونِ) تَأْخُذُ وَقْتًا أَطْوَلَ لِتُثْمِرَ مِنَ الْخُضَارِ.', size: 0.062 },
        { type: 'chips', label: 'الْأَدَوَاتُ الَّتِي اسْتَخْدَمْتُهَا:', items: [{ i: '🪏', t: 'الْمِجْرَفَةُ' }, { i: '🌱', t: 'الْبُذُورُ' }, { i: '💧', t: 'إِبْرِيقُ الْمَاءِ' }, { i: '🧺', t: 'سَلَّةُ الْحَصَادِ' }] },
      ] }, [{ label: 'مِنَ الْبِدَايَةِ', onClick: welcome }]);
    setMood('cheer'); say('end');
  }

  // =====================================================================
  // Salem's Hub: field journal, shared across every page via localStorage. (No companion falcon
  // in this experience — the garden's own harvest basket plays that "keep coming back" role.)
  // =====================================================================
  const LESSON_ID = 'omani-garden';
  const HUB_OK = typeof window.SalemHub !== 'undefined';
  const hub = HUB_OK ? window.SalemHub : { addXp() {}, stage: () => 0, xpToNext: () => null, xp: () => 0, recordDiscovery: () => false, journalList: () => [], journalCount: () => 0, recordVisit: () => false, daysVisited: () => 0 };
  function trackDiscovery(key, icon, label) { hub.recordDiscovery(LESSON_ID, key, icon, label); }

  // =====================================================================
  // Portal back to "Local habitats"
  // =====================================================================
  function portalTexture(t) {
    const c = document.createElement('canvas'); c.width = c.height = 300; const x = c.getContext('2d');
    const g = x.createRadialGradient(150, 150, 10, 150, 150, 150);
    g.addColorStop(0, '#fff3c4'); g.addColorStop(0.5, '#2a9d8f'); g.addColorStop(1, '#1f3a4d');
    x.fillStyle = g; x.beginPath(); x.arc(150, 150, 148, 0, Math.PI * 2); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 3;
    for (let r = 20; r < 145; r += 22) { x.beginPath(); x.arc(150, 150, r + Math.sin(t * 2 + r) * 6, 0, Math.PI * 2); x.stroke(); }
    return c;
  }
  function buildPortal(toName, toLabel, toHref, angle) {
    const g = new T.Group();
    const k = new Kit(), wood = '#8a5a34';
    for (const s of [-1, 1]) k.add(GEO.cyl(0.14, 0.16, 2.6, 12), wood, [s * 0.85, 1.3, 0], [0, 0, 0], [1, 1, 1], true);
    k.add(GEO.cyl(0.15, 0.15, 2.0, 12), wood, [0, 2.55, 0], [0, 0, Math.PI / 2], [1, 1, 1], true);
    g.add(k.build());
    const disc = new T.Mesh(new T.CircleGeometry(0.78, 32), new T.MeshBasicMaterial({ map: new T.CanvasTexture(portalTexture(0)), fog: false }));
    disc.position.set(0, 1.3, 0); g.add(disc); disc.userData.t = rnd() * 6;
    tickers.push({ step() { disc.userData.t += 0.02; disc.material.map.dispose(); disc.material.map = new T.CanvasTexture(portalTexture(disc.userData.t)); disc.material.map.colorSpace = T.SRGBColorSpace; disc.material.needsUpdate = true; } });
    const sign = planeMesh(buttonCanvas(toLabel, { color: '#fffdf7', text: C.ink, w: 1.4, h: 0.3 }), 1.3);
    sign.position.set(0, 2.4, 0); g.add(sign); billboards.push(sign);
    const hit = new T.Mesh(new T.CylinderGeometry(0.85, 0.85, 2.2, 12), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    hit.position.y = 1.3; g.add(hit);
    const [x, z] = polar(angle, 5.6);
    const el = entityWith(g, worldEl);
    el.object3D.position.set(x, 0, z); el.object3D.rotation.y = rad(-angle - 90);
    clickable(el, () => onPortal(toName, toHref), { hover: 1.02 });
  }
  function onPortal(toName, toHref) {
    if (mode === 'care') return;
    showPanel({ w: 1.8, accent: C.teal, icon: '🚪', title: 'بَوَّابَةٌ سِحْرِيَّةٌ', blocks: [{ t: `تَبِي تَزُورُ ${toName}؟`, size: 0.068 }] },
      [{ label: 'ادْخُلِ الْبَوَّابَةَ', color: C.teal, text: '#fff', onClick: () => (TEST ? window.__portalWent = toHref : (blink(() => { location.href = toHref; }, 0.5))) },
       { label: 'رُجُوعٌ', color: '#dff1ff', onClick: closePanel }]);
    setMood('point'); say('portalLine');
  }
  const fader = new T.Mesh(new T.SphereGeometry(0.25, 16, 12), new T.MeshBasicMaterial({ color: '#000', side: T.BackSide, transparent: true, opacity: 0, depthTest: false, depthWrite: false, fog: false }));
  fader.renderOrder = 999; fader.visible = false; camEl.object3D.add(fader);
  function blink(mid, dur = 0.18) { fader.visible = true; tween(dur, k => { fader.material.opacity = k; }, () => { mid(); tween(dur, k => { fader.material.opacity = 1 - k; }, () => { fader.visible = false; }); }); }

  // =====================================================================
  // Hand tracking: a head-gaze pointer for far interaction (pots, buttons, chips) — no
  // walking and no grabbing in this experience, so no near-field module is needed.
  // =====================================================================
  let gazeDot = null, gazeRay = null, gazeTarget = null;
  function buildGazeDot() {
    gazeDot = new T.Mesh(new T.RingGeometry(0.006, 0.011, 20), new T.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.85, depthTest: false, fog: false }));
    gazeDot.position.set(0, 0, -0.6); gazeDot.renderOrder = 998;
    camEl.object3D.add(gazeDot);
    gazeRay = document.createElement('a-entity');
    gazeRay.setAttribute('raycaster', 'objects: .clickable; far: 60; interval: 100');
    camEl.appendChild(gazeRay);
    tickers.push({ step() {
      const rc = gazeRay.components.raycaster;
      const hit = rc && rc.intersectedEls && rc.intersectedEls[0];
      gazeTarget = (hit && hit.object3D && hit.object3D.visible !== false) ? hit : null;
      gazeDot.material.color.set(gazeTarget ? '#ffd166' : '#ffffff');
      gazeDot.scale.setScalar(gazeTarget ? 1.8 : 1);
    } });
  }
  function setupHandInteract() {
    buildGazeDot();
    for (const id of ['handTL', 'handTR']) {
      const he = document.getElementById(id);
      if (!he) continue;
      let held = null;
      he.addEventListener('pinchstarted', () => { if (gazeTarget) { held = gazeTarget; buzz(he, 0.25, 30); held.emit('mousedown', { cursorEl: he }, false); } });
      he.addEventListener('pinchended', () => { if (held) held.emit('click', {}, false); held = null; });
    }
  }
  function buzz(cursorEl, strength = 0.4, ms = 50) {
    try {
      const src = cursorEl && cursorEl.components && cursorEl.components['tracked-controls'] && cursorEl.components['tracked-controls'].controller;
      const act = src && src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0];
      if (act) act.pulse(strength, ms);
    } catch (e) {}
  }

  // Test hooks
  if (TEST) window.__t = {
    mode: () => mode, panel: () => panel,
    buttons: () => [...(panel ? panel.querySelectorAll('.clickable') : [])],
    pots: () => POTS.map(p => p.id), potStage: id => plant.get(id).stage, potStep: id => plant.get(id).step,
    potClick: id => potEls.get(id).emit('click'),
    plantIntro: () => plantIntro(), startPlant, equip: tool => equip(tool, tool),
    heldTool: () => heldTool, plantedCount: () => plantedCount,
    forceGrow: id => { const st = plant.get(potById(id).id); if (st.stage >= 1 && st.stage < 6) { st.stage = 6; refreshPotVisual(potById(id)); } },
    needsWater: id => plant.get(id).needsWater,
    basketPos: () => basketPos.toArray(),
    potPos: id => { const v = new T.Vector3(); potEls.get(id).object3D.getWorldPosition(v); return v.toArray(); },
    toolGlow: name => toolGlows[name] && toolGlows[name].visible,
    harvest: id => harvest(potById(id)), harvested: () => [...harvested],
    turn: dir => rigEl.components['snap-turn'].turn(dir),
    gazeAt: el => { gazeTarget = el; }, gazeTarget: () => gazeTarget, handPinch: (id, on) => document.getElementById(id).emit(on ? 'pinchstarted' : 'pinchended'),
    journal: () => hub.journalList(),
    portal: () => onPortal('رِحْلَةِ الْبِيئَاتِ الْمَحَلِّيَّةِ', '../lesson-01-local-habitats/'), portalWent: () => window.__portalWent, portalConfirm: () => panel.querySelectorAll('.clickable')[0].emit('click'),
  };

  const rigEl = document.getElementById('rig');

  // ---------- Boot ----------
  async function boot() {
    const timeout = ms => new Promise(r => setTimeout(r, ms));
    await Promise.race([
      Promise.all([document.fonts.load(`800 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`600 40px "Baloo Bhaijaan 2"`, 'عربي'),
        document.fonts.load(`700 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`40px "Noto Color Emoji"`, '🐪')]),
      timeout(3500),
    ]).catch(() => {});
    try { maxAniso = scene.renderer.capabilities.getMaxAnisotropy(); } catch (e) {}
    buildGarden();
    buildPots();
    buildBasket();
    updateToolHighlights();
    hub.recordVisit(LESSON_ID);
    buildPortal('رِحْلَةِ الْبِيئَاتِ الْمَحَلِّيَّةِ', '١ — الْبِيئَاتُ الْمَحَلِّيَّةُ 🌍', '../lesson-01-local-habitats/', 180);
    salem = buildSalem(); salem.baseY = 0;
    scene.object3D.add(salem.root);
    const snapTurn = () => rigEl.components['snap-turn'];
    document.getElementById('turnL').addEventListener('click', () => { unlockAudio(); snapTurn().turn(1); });
    document.getElementById('turnR').addEventListener('click', () => { unlockAudio(); snapTurn().turn(-1); });
    scene.addEventListener('enter-vr', setupHandInteract, { once: true });
    if (TEST) setupHandInteract();
    setTimeout(() => {
      if (scene.camera) scene.camera.getWorldPosition(camPos);
      welcome();
      document.getElementById('loader').hidden = true;
    }, 200);
  }
  if (scene.hasLoaded) boot(); else scene.addEventListener('loaded', boot);
})();
</script>
</body>
