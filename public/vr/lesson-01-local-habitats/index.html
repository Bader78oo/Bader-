<!doctype html>

<head>

<style>
  :root {
    --ink: #1f3a4d;
    --sand: #f6e7c8;
    --sun: #f4b942;
    --om-red: #d6172b;
    --om-green: #00843d;
    --paper: #fffdf7;
    --font: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #cdeefc; font-family: var(--font); color: var(--ink); }
  #loader {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(#bfe6fb, #f6e7c8); text-align: center; padding-inline: 16px;
  }
  #loader .flag { display: flex; width: 84px; height: 48px; margin: 0 auto 14px; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px rgba(31,58,77,.2); }
  #loader .flag i { display: block; }
  #loader b { display: block; font-size: clamp(26px, 6vw, 42px); font-weight: 800; }
  #loader span { font-size: 18px; opacity: .8; }
  #topbar {
    position: fixed; top: env(safe-area-inset-top, 0px); inset-inline: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 16px; pointer-events: none;
  }
  #topbar .hint {
    background: rgba(255, 253, 247, .94); border-radius: 999px; padding: 6px 14px;
    font-size: 15px; font-weight: 700; box-shadow: 0 2px 8px rgba(31, 58, 77, .15);
  }
  #sound {
    pointer-events: auto; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 15px;
    background: var(--sun); color: var(--ink); border-radius: 999px; padding: 8px 14px;
    box-shadow: 0 2px 8px rgba(31, 58, 77, .2);
  }
  #sound:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .a-enter-vr { z-index: 11; }
  [hidden] { display: none !important; }
</style>
<script>
  // Components must be registered before the scene is parsed.
  AFRAME.registerComponent('snap-turn', {
    // Right (and left) thumbstick: flick sideways to turn 30°. Arrow keys do the same on desktop.
    schema: { angle: { default: 30 } },
    init() {
      this.latched = false;
      this.cam = document.getElementById('cam');
      const onMove = e => {
        const x = e.detail.x;
        if (!this.latched && Math.abs(x) > 0.65) { this.latched = true; this.turn(x > 0 ? -1 : 1); }
        else if (Math.abs(x) < 0.3) this.latched = false;
      };
      this.el.querySelectorAll('[laser-controls]').forEach(h => h.addEventListener('thumbstickmoved', onMove));
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') this.turn(1);
        if (e.key === 'ArrowRight') this.turn(-1);
      });
    },
    turn(dir) {
      const o = this.el.object3D, before = new THREE.Vector3(), after = new THREE.Vector3();
      this.cam.object3D.getWorldPosition(before);
      o.rotation.y += dir * this.data.angle * Math.PI / 180;
      o.updateMatrixWorld(true);
      this.cam.object3D.getWorldPosition(after);
      o.position.x += before.x - after.x; o.position.z += before.z - after.z;
      this.el.emit('snapturn');
    }
  });
</script>
</head>
<body>
<div id="loader"><div>
  <div class="flag" aria-hidden="true"><i style="width:33%;background:var(--om-red)"></i><i style="flex:1;background:linear-gradient(#fff 0 33.3%,var(--om-red) 33.3% 66.6%,var(--om-green) 66.6%)"></i></div>
  <b>رِحْلَةٌ إِلَى الْبِيئَاتِ الْمَحَلِّيَّةِ</b>
  <span>جَارٍ تَجْهِيزُ الرِّحْلَةِ…</span>
</div></div>
<div id="topbar">
  <span class="hint">اسحب لتنظر حولك • المس الكائنات • ← → للالتفاف • زر VR للنظارة</span>
  <button id="sound" type="button" aria-pressed="true">🔊 الصوت</button>
</div>

<a-scene id="scene" loading-screen="enabled: false" renderer="antialias: true; foveationLevel: 1; highRefreshRate: true"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 80" background="color: #cdeefc">
  <a-entity light="type: hemisphere; color: #e6f5ff; groundColor: #a08a62; intensity: 1.25"></a-entity>
  <a-entity light="type: directional; color: #fff0d2; intensity: 1.55" position="-6 12 8"></a-entity>
  <a-entity light="type: directional; color: #cfe6ff; intensity: 0.35" position="8 5 -6"></a-entity>

  <a-entity id="rig" snap-turn>
    <a-entity id="cam" camera="near: 0.05; far: 900" look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
    <a-entity id="handR" laser-controls="hand: right" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
    <a-entity id="handL" laser-controls="hand: left" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
  </a-entity>

  <a-entity id="world"></a-entity>
  <a-entity id="ui"></a-entity>
</a-scene>

<script>
(() => {
  'use strict';
  const L = window.LESSON, T = THREE;
  const ZONES = L.zones, CREATURES = L.creatures;
  const EXPLORE_GOAL = 12, GAME_ROUNDS = 8;
  const ZONE_R = 8.4, SIGN_Z = -5.2;
  const GALLERY = /[?&]gallery\b/.test(location.search);

  const ICON = { tree: '🌳', owl: '🦉', fox: '🦊', rabbit: '🐇', fish: '🐟', frog: '🐸', duck: '🦆', turtle: '🐢',
    camel: '🐪', oryx: '🏜️', lizard: '🦎', palm: '🌴', cow: '🐄', sheep: '🐑', goat: '🐐', hen: '🐔', lime: '🍋',
    cat: '🐈', parrot: '🦜', rose: '🌹' };
  // Small creatures are shown larger so children can see and select them easily.
  const SIZE = { rabbit: 1.35, frog: 1.9, duck: 1.5, turtle: 1.35, lizard: 1.5, fish: 1.9, fox: 1.3, hen: 1.35, cat: 1.55, parrot: 1.25, rose: 1.6, owl: 1.05 };

  const rad = d => d * Math.PI / 180;
  const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const zoneById = id => ZONES.find(z => z.id === id);
  const inZone = n => n.replace(/ُ$/, 'ِ'); // الصَّحْرَاءُ → (فِي) الصَّحْرَاءِ
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const scene = document.getElementById('scene');
  const worldEl = document.getElementById('world');
  const uiEl = document.getElementById('ui');
  const camEl = document.getElementById('cam');

  // =====================================================================
  // Geometry kit: builds each model from simple shapes, then merges them into
  // one vertex-coloured mesh (one draw call per model — important on Quest).
  // =====================================================================
  const MAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0 });
  const MAT_FLAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true });
  const GEO = {
    sph: new T.SphereGeometry(1, 18, 14),
    sphLo: new T.SphereGeometry(1, 10, 8),
    cyl: (rt, rb, h, s = 16) => new T.CylinderGeometry(rt, rb, h, s),
    cone: (r, h, s = 16) => new T.ConeGeometry(r, h, s),
    box: (w, h, d) => new T.BoxGeometry(w, h, d),
    tor: (R, r, arc = Math.PI * 2) => new T.TorusGeometry(R, r, 8, 20, arc),
    ico: (r, d = 0) => new T.IcosahedronGeometry(r, d),
  };
  const _m = new T.Matrix4(), _q = new T.Quaternion(), _e = new T.Euler(), _p = new T.Vector3(), _s = new T.Vector3();

  class Kit {
    constructor() { this.smooth = []; this.flat = []; }
    add(geo, color, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1], flat = false) {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      _e.set(r[0], r[1], r[2], r[3] || 'XYZ'); _q.setFromEuler(_e);
      _m.compose(_p.set(p[0], p[1], p[2]), _q, _s.set(s[0], s[1], s[2]));
      g.applyMatrix4(_m);
      const c = new T.Color(color), n = g.attributes.position.count, col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      g.setAttribute('color', new T.BufferAttribute(col, 3));
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(k)) g.deleteAttribute(k);
      (flat ? this.flat : this.smooth).push(g);
      return this;
    }
    // ellipsoid
    ell(color, p, s, r = [0, 0, 0], flat = false) {
      const big = Math.max(s[0], s[1], s[2]) > 0.09;
      return this.add(big ? GEO.sph : GEO.sphLo, color, p, r, s, flat);
    }
    build() {
      const g = new T.Group();
      if (this.smooth.length) g.add(new T.Mesh(merge(this.smooth), MAT));
      if (this.flat.length) g.add(new T.Mesh(merge(this.flat), MAT_FLAT));
      return g;
    }
  }
  function merge(list) {
    let n = 0; for (const g of list) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    for (const g of list) {
      pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); col.set(g.attributes.color.array, o * 3);
      o += g.attributes.position.count; g.dispose();
    }
    const out = new T.BufferGeometry();
    out.setAttribute('position', new T.BufferAttribute(pos, 3));
    out.setAttribute('normal', new T.BufferAttribute(nor, 3));
    out.setAttribute('color', new T.BufferAttribute(col, 3));
    out.computeBoundingSphere(); out.computeBoundingBox();
    return out;
  }
  function eyes(k, x, y, z, r, iris = '#2a1b12') {
    for (const s of [-1, 1]) {
      k.ell('#ffffff', [s * x, y, z], [r, r * 1.05, r * 0.8]);
      k.ell(iris, [s * x, y, z + r * 0.5], [r * 0.64, r * 0.68, r * 0.45]);
      k.ell('#ffffff', [s * x + r * 0.22, y + r * 0.28, z + r * 0.85], [r * 0.2, r * 0.2, r * 0.12]);
    }
  }
  const legs4 = (k, color, xs, zs, len, r, y0 = 0, hoof) => {
    for (const x of xs) for (const z of zs) {
      k.add(GEO.cyl(r, r * 0.85, len, 12), color, [x, y0 + len / 2, z]);
      if (hoof) k.add(GEO.cyl(r * 1.05, r * 1.1, 0.08, 12), hoof, [x, 0.04, z]);
    }
  };
  const jitter = (geo, amt) => {
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) if (p.getY(i) > -geo.parameters.height / 2 + 0.01) {
      p.setXYZ(i, p.getX(i) + (rnd() - 0.5) * amt, p.getY(i) + (rnd() - 0.5) * amt * 0.6, p.getZ(i) + (rnd() - 0.5) * amt);
    }
    geo.computeVertexNormals(); return geo;
  };

  // =====================================================================
  // Creature and plant models. Each faces +Z, stands on y = 0.
  // =====================================================================
  const MODELS = {
    camel() {
      const k = new Kit(), fur = '#d6a468', dark = '#b58045', light = '#edc795';
      k.ell(fur, [0, 1.32, 0], [0.5, 0.42, 0.95]);
      k.ell(fur, [0, 1.74, -0.15], [0.36, 0.38, 0.44]);
      // Omani saddle cloth: red, white and green
      k.ell('#d6172b', [0, 1.52, 0.38], [0.53, 0.2, 0.3]);
      k.ell('#ffffff', [0, 1.6, 0.38], [0.47, 0.16, 0.27]);
      k.ell('#00843d', [0, 1.66, 0.38], [0.41, 0.12, 0.24]);
      for (const x of [-0.53, 0.53]) for (const z of [0.2, 0.38, 0.56]) k.ell('#f4b942', [x, 1.36, z], [0.035, 0.05, 0.035]);
      for (const x of [-0.27, 0.27]) for (const z of [-0.58, 0.58]) {
        k.add(GEO.cyl(0.13, 0.09, 0.5, 12), fur, [x, 1.02, z]);
        k.add(GEO.cyl(0.075, 0.07, 0.8, 12), dark, [x, 0.42, z]);
        k.ell(dark, [x, 0.72, z], [0.1, 0.1, 0.1]);
        k.ell('#8a6038', [x, 0.04, z + 0.04], [0.13, 0.05, 0.16]);
      }
      k.add(GEO.cyl(0.13, 0.2, 0.98, 14), fur, [0, 1.74, 0.94], [0.55, 0, 0]);
      k.ell(fur, [0, 2.2, 1.3], [0.17, 0.16, 0.3]);
      k.ell(light, [0, 2.13, 1.55], [0.14, 0.12, 0.14]);
      for (const s of [-1, 1]) {
        k.ell('#5a3b22', [s * 0.05, 2.15, 1.68], [0.022, 0.016, 0.01]);
        k.ell(fur, [s * 0.14, 2.33, 1.16], [0.04, 0.075, 0.03], [0, 0, s * -0.3]);
      }
      eyes(k, 0.13, 2.26, 1.36, 0.045);
      k.add(GEO.cyl(0.025, 0.04, 0.55, 8), dark, [0, 1.12, -1.0], [-0.25, 0, 0]);
      k.ell('#6b4a2b', [0, 0.85, -1.07], [0.05, 0.09, 0.05]);
      return k.build();
    },
    oryx() {
      const k = new Kit(), white = '#f4f0e6', dark = '#3a2c24', tan = '#cdbba0';
      k.ell(white, [0, 1.05, 0], [0.32, 0.36, 0.72]);
      k.ell('#6b5444', [0, 0.86, 0], [0.325, 0.07, 0.6]);
      for (const x of [-0.18, 0.18]) for (const z of [-0.48, 0.48]) {
        k.add(GEO.cyl(0.08, 0.06, 0.42, 12), white, [x, 0.8, z]);
        k.add(GEO.cyl(0.045, 0.04, 0.6, 10), dark, [x, 0.32, z]);
        k.ell(dark, [x, 0.03, z + 0.02], [0.05, 0.035, 0.07]);
      }
      k.add(GEO.cyl(0.1, 0.14, 0.58, 12), white, [0, 1.43, 0.62], [0.45, 0, 0]);
      k.ell(white, [0, 1.72, 0.84], [0.12, 0.13, 0.25]);
      k.ell(dark, [0, 1.73, 0.97], [0.05, 0.1, 0.12]);
      k.ell(dark, [0, 1.6, 1.04], [0.07, 0.06, 0.06]);
      for (const s of [-1, 1]) {
        k.ell(dark, [s * 0.1, 1.74, 0.88], [0.04, 0.07, 0.07]);
        k.add(GEO.cone(0.028, 0.9, 10), dark, [s * 0.06, 2.18, 0.64], [-0.45, 0, 0]);
        k.ell(white, [s * 0.13, 1.86, 0.74], [0.03, 0.08, 0.03], [0, 0, s * -0.7]);
      }
      eyes(k, 0.11, 1.78, 0.9, 0.035);
      k.add(GEO.cyl(0.025, 0.03, 0.4, 8), dark, [0, 0.92, -0.74], [-0.3, 0, 0]);
      k.ell(tan, [0, 1.2, 0.2], [0.26, 0.16, 0.4]);
      return k.build();
    },
    lizard() {
      const k = new Kit(), c = '#b8975f', spot = '#8a6a3f', belly = '#dcc79c';
      k.ell(c, [0, 0.14, 0], [0.2, 0.11, 0.42]);
      k.ell(belly, [0, 0.09, 0.02], [0.17, 0.06, 0.36]);
      for (const [x, z] of [[0.08, 0.15], [-0.07, -0.05], [0.05, -0.22], [-0.1, 0.25], [0.11, -0.1]]) k.ell(spot, [x, 0.24, z], [0.04, 0.015, 0.05]);
      k.ell(c, [0, 0.17, 0.5], [0.13, 0.09, 0.17]);
      eyes(k, 0.08, 0.23, 0.56, 0.03);
      k.add(GEO.cone(0.13, 0.95, 12), c, [0, 0.12, -0.85], [-Math.PI / 2, 0, 0]);
      for (const s of [-1, 1]) for (const z of [0.25, -0.2]) k.ell(c, [s * 0.23, 0.07, z], [0.13, 0.04, 0.05], [0, s * 0.5, 0]);
      return k.build();
    },
    palm(h = 4) {
      const k = new Kit();
      const segs = Math.round(h / 0.4);
      let top = 0;
      for (let i = 0; i < segs; i++) {
        const r = 0.2 - i * 0.006, x = 0.012 * i * i * 0.1;
        k.add(GEO.cyl(r - 0.02, r, 0.42, 10), i % 2 ? '#8b6a45' : '#76593a', [x, 0.2 + i * 0.4, 0], [0, 0, -0.01 * i], [1, 1, 1], true);
        top = 0.2 + i * 0.4 + 0.2;
      }
      const tx = 0.012 * segs * segs * 0.1;
      k.ell('#6f8f3a', [tx, top, 0], [0.22, 0.18, 0.22]);
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI * 2 / 12, droop = i % 2 ? 0.55 : 0.3, len = i % 2 ? 1.05 : 1.2;
        k.ell(i % 3 ? '#3f8f3f' : '#4fa24b', [tx + Math.sin(a) * len * 0.85, top - 0.1 - droop * 0.5, Math.cos(a) * len * 0.85], [0.2, 0.025, len], [droop, a, 0, 'YXZ'], true);
      }
      for (let i = 0; i < 3; i++) {
        const a = i * 2.1 + 0.4;
        for (let j = 0; j < 7; j++) k.ell(j % 2 ? '#d9822b' : '#c56a1f', [tx + Math.sin(a) * 0.28 + (rnd() - 0.5) * 0.12, top - 0.35 - rnd() * 0.25, Math.cos(a) * 0.28 + (rnd() - 0.5) * 0.12], [0.055, 0.07, 0.055]);
      }
      return k.build();
    },
    cow() {
      const k = new Kit(), w = '#f6f3ec', b = '#2b2b2b', pink = '#f1aaa2';
      k.ell(w, [0, 1.0, 0], [0.45, 0.42, 0.8]);
      k.ell(b, [0.3, 1.1, 0.2], [0.18, 0.22, 0.3]);
      k.ell(b, [-0.3, 0.95, -0.3], [0.17, 0.2, 0.26]);
      k.ell(b, [0.05, 1.33, -0.35], [0.26, 0.11, 0.26]);
      legs4(k, w, [-0.25, 0.25], [-0.5, 0.5], 0.66, 0.085, 0.02, b);
      k.ell(w, [0, 1.32, 0.95], [0.22, 0.24, 0.28]);
      k.ell(b, [0.12, 1.4, 1.02], [0.1, 0.12, 0.1]);
      k.ell(pink, [0, 1.18, 1.18], [0.19, 0.13, 0.12]);
      for (const s of [-1, 1]) {
        k.ell('#6b3b36', [s * 0.07, 1.19, 1.29], [0.03, 0.025, 0.01]);
        k.add(GEO.cone(0.04, 0.2, 10), '#e8dcc0', [s * 0.15, 1.57, 0.9], [0, 0, -s * 0.6]);
        k.ell(w, [s * 0.28, 1.4, 0.88], [0.12, 0.05, 0.07], [0, 0, s * 0.3]);
      }
      eyes(k, 0.13, 1.42, 1.12, 0.045);
      k.ell(pink, [0, 0.62, -0.2], [0.14, 0.1, 0.14]);
      k.add(GEO.cyl(0.02, 0.02, 0.62, 6), w, [0, 0.8, -0.8]);
      k.ell(b, [0, 0.48, -0.8], [0.05, 0.09, 0.05]);
      return k.build();
    },
    sheep() {
      const k = new Kit(), wool = '#f5f2ea', face = '#3b302a';
      k.ell(wool, [0, 0.78, 0], [0.36, 0.33, 0.5]);
      for (const [x, y, z, r] of [[0.24, 0.9, 0.24, 0.2], [-0.24, 0.9, 0.24, 0.2], [0.24, 0.9, -0.24, 0.2], [-0.24, 0.9, -0.24, 0.2],
        [0, 1.04, 0.05, 0.22], [0, 1.0, -0.3, 0.2], [0.3, 0.72, 0, 0.19], [-0.3, 0.72, 0, 0.19], [0, 0.75, 0.42, 0.2], [0, 0.78, -0.46, 0.19], [0.14, 1.02, 0.3, 0.16], [-0.14, 1.02, 0.3, 0.16]])
        k.ell(wool, [x, y, z], [r, r, r]);
      legs4(k, face, [-0.18, 0.18], [-0.28, 0.28], 0.48, 0.05, 0);
      k.ell(face, [0, 0.95, 0.58], [0.15, 0.17, 0.2]);
      k.ell(wool, [0, 1.11, 0.52], [0.14, 0.1, 0.13]);
      for (const s of [-1, 1]) k.ell(face, [s * 0.18, 0.99, 0.52], [0.11, 0.04, 0.05], [0, 0, s * 0.35]);
      eyes(k, 0.08, 1.0, 0.72, 0.035);
      k.ell(wool, [0, 0.8, -0.52], [0.1, 0.1, 0.1]);
      return k.build();
    },
    goat() {
      const k = new Kit(), br = '#6e4a32', w = '#efe6d8', d = '#2e2320';

  function heightOf(obj) { const b = new T.Box3().setFromObject(obj); return b.max.y - b.min.y; }

  // cylinder from point a to point b (radius r1 at a, r2 at b)
  const _up = new T.Vector3(0, 1, 0);
  function seg(k, color, a, b, r1, r2, flat = false) {
    const A = new T.Vector3(...a), B = new T.Vector3(...b), d = B.clone().sub(A);
    const q = new T.Quaternion().setFromUnitVectors(_up, d.clone().normalize());
    const e = new T.Euler().setFromQuaternion(q);
    const mid = A.clone().add(B).multiplyScalar(0.5);
    k.add(GEO.cyl(r2, r1, d.length(), 12), color, mid.toArray(), [e.x, e.y, e.z], [1, 1, 1], flat);
  }

  // =====================================================================
  // Salem — the Omani guide character: an embroidered kumma and a white dishdasha with its
  // stitched neckline, front placket and farrakha (the perfumed tassel)
  // =====================================================================
  const SALEM_TEX = {};
  function kummaTexture() {
    if (SALEM_TEX.kumma) return SALEM_TEX.kumma;
    // side band, unrolled: dense hand embroidery on white cotton, tiny perforations, borders top and bottom
    const W = 1024, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#fbfaf3'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#e4e0d2';
    for (let yy = 8; yy < H; yy += 9) for (let xx = (yy % 18) / 2; xx < W; xx += 9) { x.beginPath(); x.arc(xx, yy, 1.3, 0, Math.PI * 2); x.fill(); }
    const teal = '#15807f', maroon = '#8c1c3a', gold = '#c9971c', navy = '#24407a', green = '#2f7d3a';
    const band = (y, h, col) => { x.fillStyle = col; x.fillRect(0, y, W, h); };
    const zig = (y, h, col, n) => { x.fillStyle = col; x.beginPath(); for (let i = 0; i <= n; i++) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0)); } for (let i = n; i >= 0; i--) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0) + 4); } x.fill(); };
    band(0, 7, teal); zig(10, 10, maroon, 64); band(26, 3, gold);
    // main field: 8 medallions (eight-point stars with rings), linked by diamond chains
    const n = 8, cy = 128;
    for (let i = 0; i < n; i++) {
      const cx = (i + 0.5) * W / n;
      const star = (r, col) => { x.fillStyle = col; x.beginPath(); for (let j = 0; j < 16; j++) { const a = j * Math.PI / 8, rr = j % 2 ? r * 0.7 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath(); x.fill(); };
      star(52, [teal, navy, maroon, green][i % 4]); star(40, '#fbfaf3'); star(32, [maroon, gold, teal, navy][i % 4]);
      x.fillStyle = '#fbfaf3'; x.beginPath(); x.arc(cx, cy, 16, 0, Math.PI * 2); x.fill();
      x.fillStyle = gold; x.beginPath(); x.arc(cx, cy, 9, 0, Math.PI * 2); x.fill();
      for (let j = 0; j < 8; j++) { const a = j * Math.PI / 4; x.fillStyle = teal; x.beginPath(); x.arc(cx + Math.cos(a) * 24, cy + Math.sin(a) * 24, 2.4, 0, Math.PI * 2); x.fill(); }
      const mx = cx + W / n / 2;
      for (const dy of [-34, 0, 34]) { x.fillStyle = dy ? gold : maroon; x.beginPath(); x.moveTo(mx, cy + dy - 9); x.lineTo(mx + 7, cy + dy); x.lineTo(mx, cy + dy + 9); x.lineTo(mx - 7, cy + dy); x.fill(); }
    }
    band(H - 29, 3, gold); zig(H - 22, 10, maroon, 64); band(H - 7, 7, teal);
    const side = new T.CanvasTexture(c); side.colorSpace = T.SRGBColorSpace; side.wrapS = T.RepeatWrapping; side.anisotropy = maxAniso;
    // crown: a stitched rosette
    const t = document.createElement('canvas'); t.width = t.height = 512;
    const y = t.getContext('2d');
    y.fillStyle = '#fbfaf3'; y.fillRect(0, 0, 512, 512);
    const ring = (r, col, w) => { y.strokeStyle = col; y.lineWidth = w; y.beginPath(); y.arc(256, 256, r, 0, Math.PI * 2); y.stroke(); };
    for (let r = 230; r > 60; r -= 26) ring(r, [teal, maroon, gold, navy][(r / 26 | 0) % 4], 5);
    for (let j = 0; j < 24; j++) {
      const a = j * Math.PI / 12; y.fillStyle = j % 2 ? maroon : teal;
      y.save(); y.translate(256 + Math.cos(a) * 150, 256 + Math.sin(a) * 150); y.rotate(a);
      y.beginPath(); y.ellipse(0, 0, 22, 8, 0, 0, Math.PI * 2); y.fill(); y.restore();
    }

  function dishdashaTexture() {

    const W = 1024, H = 1024, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');

  function buildSalem() {
    const root = new T.Group();
    const skin = '#b97a55', white = '#f7f6f1', shade = '#e4e0d4', hair = '#2a1d17';
    // the robe: a lathe (hem → shoulders → neck), textured so the embroidery sits where it should
    const prof = [[0.255, 0.075], [0.25, 0.12], [0.22, 0.35], [0.185, 0.58], [0.18, 0.72], [0.205, 0.83], [0.19, 0.875], [0.12, 0.915], [0.07, 0.935]];

    const robe = new T.Mesh(lathe, new T.MeshStandardMaterial({ map: dishdashaTexture(), roughness: 0.85 }));

    k.add(GEO.tor(0.068, 0.011), '#d6c69c', [0, 0.93, 0.012], [Math.PI / 2 - 0.15, 0, 0]);

    k.ell('#e2d3aa', [0.03, 0.765, 0.157], [0.017, 0.017, 0.017]);

    const kh = new Kit();
    kh.ell(skin, [0, 0.19, 0], [0.19, 0.185, 0.18]);
    kh.ell(skin, [0, 0.11, 0.05], [0.15, 0.1, 0.13]);
    for (const s of [-1, 1]) {
      kh.ell(skin, [s * 0.185, 0.18, 0], [0.036, 0.056, 0.03]);
      kh.ell('#a86b48', [s * 0.19, 0.18, 0.012], [0.018, 0.034, 0.012]);
      kh.ell(hair, [s * 0.16, 0.24, 0.05], [0.03, 0.05, 0.03]);
      kh.ell(hair, [s * 0.075, 0.278, 0.162], [0.045, 0.011, 0.014], [0, 0, s * -0.12]);
      kh.ell('#e8968a', [s * 0.115, 0.13, 0.145], [0.036, 0.021, 0.012]);
    }
    kh.ell('#a86b48', [0, 0.17, 0.182], [0.028, 0.03, 0.026]);
    for (const s of [-1, 1]) kh.ell('#8a5234', [s * 0.012, 0.155, 0.2], [0.008, 0.005, 0.005]);
    kh.ell(hair, [0, 0.3, -0.03], [0.19, 0.07, 0.172]);
    head.add(kh.build());
    const eyeG = new T.Group(); eyeG.position.set(0, 0.22, 0.152); head.add(eyeG);

    km.add(GEO.tor(0.042, 0.0065, Math.PI), '#8a3a30', [0, 0.108, 0.176], [0, 0, Math.PI]);
    const mouthClosed = km.build(); head.add(mouthClosed);
    const ko = new Kit();
    ko.ell('#5a1a1a', [0, 0.095, 0.172], [0.045, 0.034, 0.014]);
    ko.ell('#ffffff', [0, 0.118, 0.178], [0.032, 0.01, 0.006]);

  // =====================================================================
  // Canvas helpers: textures, Omani flag, cards, buttons, signs
  // =====================================================================
  const FONT = '"Baloo Bhaijaan 2","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif';
  const EMOJI = '"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
  const C = { ink: '#1f3a4d', soft: '#5d7486', paper: '#fffdf7', line: '#eadfc8', sun: '#f4b942', teal: '#2a9d8f', coral: '#e76f51',
    leaf: '#4f9d5d', sky: '#2f8fc4', red: '#d6172b', green: '#00843d', gold: '#e9a820' };
  let maxAniso = 4;

  function texFrom(canvas) {
    const t = new T.CanvasTexture(canvas);
    t.colorSpace = T.SRGBColorSpace; t.anisotropy = maxAniso;
    t.minFilter = T.LinearMipmapLinearFilter; t.generateMipmaps = true;

  }
  function wrap(ctx, text, maxW) {
    const out = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const w of para.split(' ')) {
        const t = line ? line + ' ' + w : w;
        if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
      }
      out.push(line);
    }
    return out;
  }
  function drawEmoji(x, e, cx, cy, size) {
    x.save(); x.globalAlpha = 1; x.fillStyle = '#000'; x.font = `${size}px ${EMOJI}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.direction = 'ltr';
    x.fillText(e, cx, cy + size * 0.06); x.restore();
  }
  function drawOmanFlag(x, fx, fy, w, h) {
    const red = C.red, green = C.green, band = w / 3;
    x.save();
    x.beginPath(); x.roundRect(fx, fy, w, h, Math.min(w, h) * 0.06); x.clip();
    x.fillStyle = '#ffffff'; x.fillRect(fx, fy, w, h / 3);
    x.fillStyle = red; x.fillRect(fx, fy + h / 3, w, h / 3);
    x.fillStyle = green; x.fillRect(fx, fy + 2 * h / 3, w, h / 3 + 1);
    x.fillStyle = red; x.fillRect(fx, fy, band, h);
    // national emblem (khanjar over crossed swords), simplified, in white
    const cx = fx + band / 2, cy = fy + h * 0.2, s = Math.min(band, h) * 0.34;
    x.strokeStyle = '#ffffff'; x.fillStyle = '#ffffff'; x.lineCap = 'round';
    x.lineWidth = s * 0.07;
    for (const d of [-1, 1]) {
      x.beginPath(); x.moveTo(cx - d * s * 0.5, cy - s * 0.42); x.quadraticCurveTo(cx + d * s * 0.1, cy + s * 0.05, cx + d * s * 0.52, cy + s * 0.45); x.stroke();
      x.beginPath(); x.moveTo(cx - d * s * 0.52 - s * 0.08, cy - s * 0.3); x.lineTo(cx - d * s * 0.3, cy - s * 0.5); x.stroke();
    }
    x.lineWidth = s * 0.16;
    x.beginPath(); x.moveTo(cx, cy - s * 0.35); x.lineTo(cx, cy + s * 0.12); x.quadraticCurveTo(cx, cy + s * 0.42, cx + s * 0.22, cy + s * 0.36); x.stroke();
    x.fillRect(cx - s * 0.16, cy - s * 0.5, s * 0.32, s * 0.12);
    x.fillRect(cx - s * 0.3, cy - s * 0.12, s * 0.6, s * 0.08);
    x.restore();
  }

  // ---- Cards: measured first, so text always fits inside the card ----
  const PX = 520; // canvas pixels per metre for UI (sharp text in the headset)
  function renderCard(x, spec, draw) {
    const W = Math.round(spec.w * PX), pad = Math.round(0.075 * PX), M = 18; // M: shadow margin
    const inner = W - 2 * M;
    const accent = spec.accent || C.teal;
    let y = M + pad * 0.8;
    x.direction = 'rtl';
    // header: icon (or flag) on the right, title and subtitle to its left
    if (spec.title) {
      const iconD = spec.icon || spec.flag ? Math.round(0.19 * PX) : 0;
      const tSize = Math.round((spec.titleSize || 0.105) * PX);
      x.font = `800 ${tSize}px ${FONT}`;
      const titleLines = wrap(x, spec.title, inner - 2 * pad - (iconD ? iconD + pad * 0.6 : 0));
      const sSize = Math.round(0.062 * PX);
      const blockH = titleLines.length * tSize * 1.5 + (spec.subtitle ? sSize * 1.6 : 0);
      const headH = Math.max(iconD, blockH);
      if (draw) {
        const rx = W - M - pad;
        if (spec.flag) {
          drawOmanFlag(x, rx - iconD * 1.25, y + (headH - iconD * 0.72) / 2, iconD * 1.25, iconD * 0.72);
        } else if (iconD) {
          x.fillStyle = accent + '26'; x.beginPath(); x.arc(rx - iconD / 2, y + headH / 2, iconD / 2, 0, Math.PI * 2); x.fill();
          drawEmoji(x, spec.icon, rx - iconD / 2, y + headH / 2, iconD * 0.62);
        }
        const tx = rx - (iconD ? (spec.flag ? iconD * 1.25 : iconD) + pad * 0.6 : 0);
        let ty = y + (headH - blockH) / 2;
        x.textAlign = 'right'; x.textBaseline = 'top'; x.fillStyle = C.ink; x.font = `800 ${tSize}px ${FONT}`;
        for (const l of titleLines) { x.fillText(l, tx, ty); ty += tSize * 1.5; }
        if (spec.subtitle) { x.font = `700 ${sSize}px ${FONT}`; x.fillStyle = accent; x.fillText(spec.subtitle, tx, ty + sSize * 0.1); }
      }
      y += headH + pad * 0.55;
      if (draw) { x.fillStyle = C.line; x.fillRect(M + pad, y, inner - 2 * pad, 3); }
      y += pad * 0.55;
    }
    for (const b of spec.blocks || []) {
      if (b.type === 'chips') {
        const size = Math.round(0.06 * PX), h = Math.round(size * 2.1), gap = Math.round(size * 0.5);
        x.font = `700 ${size}px ${FONT}`;
        if (b.label) {
          if (draw) { x.fillStyle = C.soft; x.textAlign = 'right'; x.textBaseline = 'top'; x.fillText(b.label, W - M - pad, y); }
          y += size * 1.7;
        }
        const widths = b.items.map(it => x.measureText(it.t).width + size * 2.6);
        const total = widths.reduce((a, c) => a + c, 0) + gap * (widths.length - 1);
        let cx = W / 2 + total / 2;
        if (draw) b.items.forEach((it, i) => {
          const wdt = widths[i], left = cx - wdt;
          x.fillStyle = (it.color || accent) + '1f'; x.beginPath(); x.roundRect(left, y, wdt, h, h / 2); x.fill();
          x.strokeStyle = (it.color || accent) + '66'; x.lineWidth = 3; x.stroke();
          drawEmoji(x, it.i, cx - size * 1.1, y + h / 2, size * 1.1);
          x.fillStyle = C.ink; x.textAlign = 'right'; x.textBaseline = 'middle'; x.fillText(it.t, cx - size * 2.0, y + h / 2 + 2);
          cx = left - gap;
        });
        y += h + pad * 0.45;
        continue;
      }
      if (b.type === 'stars') {
        const r = Math.round(0.055 * PX), gap = r * 0.55, total = b.total * (2 * r) + (b.total - 1) * gap;
        if (draw) for (let i = 0; i < b.total; i++) {
          const cx = W / 2 + total / 2 - r - i * (2 * r + gap), cy = y + r;
          x.beginPath();
          for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + j * Math.PI / 5, rr = j % 2 ? r * 0.45 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
          x.closePath(); x.fillStyle = i < b.n ? C.gold : '#e8e1d2'; x.fill();
        }
        y += 2 * r + pad * 0.4;
        continue;
      }
      // text / bullet / highlight
      const size = Math.round((b.size || 0.07) * PX), lh = size * 1.62;
      const indent = b.type === 'bullet' ? size * 1.1 : 0;
      const boxPad = b.type === 'highlight' ? size * 0.6 : 0;
      x.font = `${b.bold || b.type === 'highlight' ? 800 : 600} ${size}px ${FONT}`;
      const lines = wrap(x, b.t, inner - 2 * pad - indent - 2 * boxPad);
      const hgt = lines.length * lh + 2 * boxPad;
      if (draw) {
        if (b.type === 'highlight') {
          x.fillStyle = (b.color || accent) + '1c'; x.beginPath(); x.roundRect(M + pad, y, inner - 2 * pad, hgt, size * 0.6); x.fill();
        }
        if (b.type === 'bullet') {
          x.fillStyle = b.dot || accent; x.beginPath(); x.arc(W - M - pad - size * 0.35, y + lh * 0.5, size * 0.2, 0, Math.PI * 2); x.fill();
        }
        x.fillStyle = b.type === 'highlight' ? (b.color || accent) : (b.color || C.ink);
        x.textBaseline = 'middle';
        const align = b.align || 'right';
        x.textAlign = align;
        const ax = align === 'center' ? W / 2 : W - M - pad - indent - boxPad;
        let ly = y + boxPad;
        for (const l of lines) { x.fillText(l, ax, ly + lh / 2 + size * 0.05); ly += lh; }
      }
      y += hgt + size * 0.35;
    }
    return Math.round(y + pad * 0.6 + M);
  }
  function cardCanvas(spec) {
    const probe = document.createElement('canvas').getContext('2d');
    const H = renderCard(probe, spec, false);
    const c = document.createElement('canvas'); c.width = Math.round(spec.w * PX); c.height = H;
    const x = c.getContext('2d'), M = 18;
    x.shadowColor = 'rgba(31,58,77,.28)'; x.shadowBlur = 16; x.shadowOffsetY = 5;
    x.fillStyle = C.paper; x.beginPath(); x.roundRect(M, M, c.width - 2 * M, H - 2 * M, 0.07 * PX); x.fill();
    x.shadowColor = 'transparent';

  function planeMesh(canvas, wM, { overlay = false } = {}) {
    const hM = wM * canvas.height / canvas.width;
    const mat = new T.MeshBasicMaterial({ map: texFrom(canvas), transparent: true, depthWrite: !overlay, side: T.DoubleSide });
    if (overlay) mat.depthTest = false;

  }
  function buttonCanvas(label, { color = C.sun, text = C.ink, w = 1.0, h = 0.24 } = {}) {
    const c = document.createElement('canvas'); c.width = Math.round(w * PX); c.height = Math.round(h * PX);
    const x = c.getContext('2d'), W = c.width, H = c.height;
    x.fillStyle = 'rgba(31,58,77,.28)'; x.beginPath(); x.roundRect(6, 12, W - 12, H - 14, (H - 14) / 2); x.fill();
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, color); g.addColorStop(1, shadeHex(color, -0.1));
    x.fillStyle = g; x.beginPath(); x.roundRect(6, 2, W - 12, H - 16, (H - 16) / 2); x.fill();
    x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = text;
    let fs = H * 0.4; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(label).width > W * 0.84 && fs > 12) { fs -= 2; x.font = `800 ${fs}px ${FONT}`; }

  }
  function shadeHex(hex, k) {
    const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(v + v * k)));
    return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  // =====================================================================
  // Interaction plumbing
  // =====================================================================
  let downAt = null, dragged = false;
  window.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; dragged = false; });
  window.addEventListener('pointermove', e => { if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 12) dragged = true; });
  window.addEventListener('pointerup', () => { downAt = null; setTimeout(() => { dragged = false; }, 60); });

  function entityWith(obj, parent) {
    const el = document.createElement('a-entity');
    parent.appendChild(el);
    el.setObject3D('mesh', obj);
    return el;
  }
  function clickable(el, onClick, { hover = 1.07 } = {}) {
    el.classList.add('clickable');
    el._base = el._base || 1;
    el.addEventListener('mouseenter', () => { if (!el._pulse) el.object3D.scale.setScalar(el._base * hover); });
    el.addEventListener('mouseleave', () => { if (!el._pulse) el.object3D.scale.setScalar(el._base); });
    el.addEventListener('click', e => { if (dragged) return; unlockAudio(); onClick && onClick(e); });
    return el;
  }
  function button(label, parent, opts, onClick) {
    const c = buttonCanvas(label, opts);
    const el = entityWith(planeMesh(c, opts.w || 1.0), parent);
    return clickable(el, () => { sfx.pop(); onClick(); }, { hover: 1.06 });
  }

  // =====================================================================
  // Sound: effects, recorded voice (audio/*.mp3) or speech-synthesis fallback
  // =====================================================================
  let soundOn = true, actx = null, ttsVoice = null, voiceSeq = 0, currentAudio = null;
  const isDialect = k => !/^(f|a|z)_/.test(k);
  // audio/manifest.json: either ["key", ...] for local audio/<key>.mp3 files, or { "key": "https://…mp3" }.
  let recorded = new Map();
  fetch('audio/manifest.json').then(r => r.ok ? r.json() : []).then(m => {
    recorded = new Map(Array.isArray(m) ? m.map(k => [k, `audio/${k}.mp3`]) : Object.entries(m));

  }).catch(() => {});
  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;

    soundBtn.setAttribute('aria-pressed', String(soundOn));

  function unlockAudio() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { /* no audio */ }
  }
  function tones(freqs, { dur = 0.13, type = 'sine', vol = 0.16 } = {}) {
    if (!soundOn || !actx) return;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.6);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur * 1.8);
    });
  }
  const sfx = {
    pop: () => tones([660, 880], { dur: 0.07 }),
    good: () => tones([523, 659, 784, 1047], { dur: 0.11 }),
    bad: () => tones([330, 262], { dur: 0.16, type: 'triangle', vol: 0.1 }),
  };
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang));
    ttsVoice = vs.find(v => /OM/i.test(v.lang)) || vs.find(v => /(SA|AE|KW|QA|BH)/i.test(v.lang)) || vs[0] || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function stopVoice() {

    if ('speechSynthesis' in window) speechSynthesis.cancel();
    salem.speaking = false;
  }
  function playLine(key) {
    const text = L.lines[key] || '';
    const est = 600 + text.length * 70;
    return new Promise(res => {
      let done = false; const finish = () => { if (!done) { done = true; res(); } };
      if (!soundOn) return setTimeout(finish, Math.min(est, 2500));
      if (recorded.has(key)) {
        const a = new Audio(recorded.get(key)); currentAudio = a;
        a.onended = a.onerror = finish; a.play().catch(finish);

        return;
      }

      u.voice = ttsVoice; u.lang = ttsVoice.lang;

    });
  }
  async function say(keys, { bubble = true } = {}) {
    stopVoice();
    const my = voiceSeq;
    keys = [].concat(keys).filter(k => L.lines[k]);
    const dialect = keys.filter(isDialect);
    if (bubble && dialect.length) showBubble(dialect.map(k => L.lines[k]).join(' '));
    salem.speaking = true;
    for (const k of keys) { if (my !== voiceSeq) return; await playLine(k); }
    if (my === voiceSeq) { salem.speaking = false; setTimeout(() => { if (my === voiceSeq) hideBubble(); }, 1800); }
  }

  // =====================================================================
  // Frame loop: tweens, billboards, idle animation, Salem
  // =====================================================================
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const camPos = new T.Vector3();
  const tweens = [], idlers = [], billboards = [];
  let salem = null, flagMesh = null, waterRings = [];
  function tween(dur, step, done) { tweens.push({ t: 0, dur, step, done }); }

  AFRAME.registerSystem('lesson', {
    tick(time, dt) {
      const d = Math.min(dt, 250) / 1000, t = time / 1000; // real elapsed time, so animations finish on schedule
      if (this.el.camera) this.el.camera.getWorldPosition(camPos);
      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i]; tw.t += d;
        const k = Math.min(1, tw.t / tw.dur);
        tw.step(k, d);
        if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
      }
      const wp = new T.Vector3();
      for (const o of billboards) { o.getWorldPosition(wp); o.lookAt(camPos.x, wp.y, camPos.z); }
      if (!reduceMotion) for (const a of idlers) a.step(t, d);
      if (salem) animateSalem(t, d);
      if (flagMesh) waveFlag(t);
      for (const r of waterRings) { const k = ((t + r.userData.p) % 3) / 3; r.scale.setScalar(0.3 + k * 1.6); r.material.opacity = 0.5 * (1 - k); }
    }
  });

  function animateSalem(t, d) {
    const s = salem;
    s.root.scale.y = 1 + Math.sin(t * 2.2) * 0.012;
    if (t > s.blinkAt) { s.eyes.scale.y = 0.1; if (t > s.blinkAt + 0.12) { s.eyes.scale.y = 1; s.blinkAt = t + 2 + Math.random() * 3; } }
    const talkOpen = s.speaking && Math.sin(t * 22) > 0;
    s.mouthOpen.visible = talkOpen; s.mouthClosed.visible = !talkOpen;
    s.head.rotation.x = s.speaking ? Math.sin(t * 5) * 0.04 : 0;
    s.moodT += d;
    const R = s.arms[1], Lf = s.arms[-1];
    if (s.mood === 'wave') {
      R.rotation.z = -2.5 + Math.sin(t * 9) * 0.35; Lf.rotation.z = -0.12;
      if (s.moodT > 2.2) s.mood = 'idle';
    } else if (s.mood === 'cheer') {
      R.rotation.z = -2.7; Lf.rotation.z = 2.7;
      s.root.position.y = s.baseY + Math.abs(Math.sin(s.moodT * 7)) * 0.18;
      if (s.moodT > 1.6) { s.mood = 'idle'; s.root.position.y = s.baseY; }
    } else if (s.mood === 'think') {
      R.rotation.z = -1.9; R.rotation.x = -0.6; s.head.rotation.z = Math.sin(t * 3) * 0.12;
      if (s.moodT > 1.8) { s.mood = 'idle'; R.rotation.x = 0; s.head.rotation.z = 0; }
    } else if (s.mood === 'point') {
      R.rotation.z = -1.35; R.rotation.x = -0.25;
      if (s.moodT > 2.5) { s.mood = 'idle'; R.rotation.x = 0; }
    } else {
      R.rotation.z += (-0.12 + Math.sin(t * 1.3) * 0.04 - R.rotation.z) * 0.1;
      Lf.rotation.z += (0.12 - Math.sin(t * 1.3) * 0.04 - Lf.rotation.z) * 0.1;
    }
  }
  function setMood(m) { if (!salem) return; salem.mood = m; salem.moodT = 0; salem.arms[1].rotation.x = 0; }

  // Salem stands on the ground to the right of whatever he is presenting, facing the child.
  let bubbleMesh = null;
  function salemBeside(pos, rotY, halfW) {
    if (!salem) return;
    const right = new T.Vector3(Math.cos(rotY), 0, -Math.sin(rotY));
    const target = pos.clone().addScaledVector(right, halfW + 0.42);
    const away = new T.Vector3(target.x - camPos.x, 0, target.z - camPos.z).normalize().multiplyScalar(0.35);
    target.add(away); target.y = 0;
    const from = salem.root.position.clone(), far = from.distanceTo(target) > 0.05;
    salem.root.rotation.y = Math.atan2(camPos.x - target.x, camPos.z - target.z);
    salem.baseY = 0;
    if (!salem.placed) { salem.placed = true; salem.root.position.copy(target); return; }
    if (!far) return;
    tween(0.45, k => {
      salem.root.position.lerpVectors(from, target, k);
      salem.root.position.y = Math.sin(k * Math.PI) * 0.35;
    }, () => { salem.root.position.y = 0; });
    if (bubbleMesh) bubbleMesh.visible = false;
  }
  function showBubble(text) {
    if (!salem) return;
    hideBubble();
    const c = cardCanvas({ w: 1.0, accent: C.coral, blocks: [{ t: `💬 ${L.character.name}`, size: 0.05, bold: true, color: C.coral }, { t: text, size: 0.066, bold: true }] });
    bubbleMesh = planeMesh(c, 0.95);
    bubbleMesh.position.set(0, 1.5 + bubbleMesh.userData.h / 2, 0);
    salem.root.add(bubbleMesh); billboards.push(bubbleMesh);
  }
  function hideBubble() {
    if (!bubbleMesh) return;

    billboards.splice(billboards.indexOf(bubbleMesh), 1); bubbleMesh.material.map.dispose(); bubbleMesh = null;
  }

  function burst(pos) {
    const icons = ['⭐', '✨', '🌟', '🎉'];
    for (let i = 0; i < 16; i++) {
      const c = document.createElement('canvas'); c.width = c.height = 96;
      drawEmoji(c.getContext('2d'), icons[i % 4], 48, 48, 72);
      const p = planeMesh(c, 0.3);
      p.position.copy(pos); scene.object3D.add(p); billboards.push(p);

  }

  // =====================================================================
  // World building
  // =====================================================================
  const polar = (deg, r) => [r * Math.sin(rad(deg)), -r * Math.cos(rad(deg))];

  function noiseTexture(base, dots, { size = 256, n = 1400, rep = 1, soft = false } = {}) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    if (soft) {
      const g = x.createRadialGradient(size / 2, size / 2, size * 0.36, size / 2, size / 2, size / 2);
      g.addColorStop(0, base); g.addColorStop(1, base + '00');

    g.addColorStop(0, '#4fa6e0'); g.addColorStop(0.45, '#9fd3f3'); g.addColorStop(0.5, '#dff2fb'); g.addColorStop(1, '#f1e6cf');

    sun.position.set(-70, 95, 120); scene.object3D.add(sun);

    for (const [cx, cy, cz, s] of [[-30, 26, -60, 3], [40, 30, -50, 2.6], [60, 24, 20, 3.2], [-55, 28, 30, 2.8], [10, 32, 70, 3], [-20, 34, -90, 3.5]])
      for (const [a, b, c2, r] of [[0, 0, 0, 1.4], [1.3, -0.2, 0.2, 1], [-1.3, -0.25, 0, 1], [0.5, 0.5, -0.2, 0.9], [-0.6, 0.4, 0.3, 0.8]])

  }

  function buildLandscape() {
    const w = worldEl.object3D;
    // Ground: finely tessellated near the child, a coarse ring further out. Large triangles that pass
    // under the camera cause depth artefacts on some GPUs.
    const groundMat = new T.MeshStandardMaterial({ map: noiseTexture('#a8cf6f', ['#8fbd5a', '#bcdc85', '#7fae4d', '#c9d98f'], { n: 2600, rep: 12 }), roughness: 1 });
    const near = new T.Mesh(new T.CircleGeometry(30, 96, 0, Math.PI * 2), groundMat);
    const nearGeo = new T.PlaneGeometry(60, 60, 60, 60); near.geometry.dispose(); near.geometry = nearGeo;
    near.rotation.x = -Math.PI / 2; w.add(near);
    const farTex = groundMat.map.clone(); farTex.repeat.set(60, 60); farTex.needsUpdate = true;
    const far = new T.Mesh(new T.RingGeometry(29.9, 200, 64, 6), new T.MeshStandardMaterial({ map: farTex, roughness: 1 }));
    far.rotation.x = -Math.PI / 2; far.position.y = -0.01; w.add(far);

    for (let i = 0; i < 22; i++) {

    }

  function buildFort(w) {
    const k = new Kit(), wall = '#d9b98b', dark = '#b8956a', door = '#6b4226';
    const g = new T.Group(); const [x, z] = polar(180, 30); g.position.set(x, 0, z); g.rotation.y = rad(-180);

      for (let i = 0; i < 8; i++) k.add(GEO.box(0.7, 0.7, 1.4), wall, [s * (4.4 + i * 1.15), 5.85, 1.2], [0, 0, 0], [1, 1, 1], true);
      k.add(GEO.box(3.4, 7.5, 3.4), wall, [s * 13.5, 3.75, 1.2], [0, 0, 0], [1, 1, 1], true);
      for (let i = 0; i < 4; i++) for (const zz of [-1.4, 1.4]) k.add(GEO.box(0.6, 0.7, 0.6), wall, [s * 13.5 - 1.4 + i * 0.93, 7.85, 1.2 + zz], [0, 0, 0], [1, 1, 1], true);
      for (let i = 0; i < 3; i++) k.add(GEO.box(0.35, 0.9, 0.2), door, [s * (6 + i * 2.2), 3.4, 1.95], [0, 0, 0], [1, 1, 1], true);
    }

    for (const yy of [5, 7]) for (let i = 0; i < 5; i++) {

      k.add(GEO.box(0.3, 0.8, 0.2), door, [Math.sin(a) * 4.85, yy, Math.cos(a) * 4.85], [0, a, 0], [1, 1, 1], true);
    }
    g.add(k.build());
    const pole = new T.Mesh(new T.CylinderGeometry(0.08, 0.08, 5, 8), new T.MeshStandardMaterial({ color: '#dddddd' }));
    pole.position.set(0, 12.5, 0); g.add(pole);
    const fc = document.createElement('canvas'); fc.width = 280; fc.height = 160; drawOmanFlag(fc.getContext('2d'), 0, 0, 280, 160);
    const f = new T.Mesh(new T.PlaneGeometry(2.8, 1.6), new T.MeshStandardMaterial({ map: texFrom(fc), side: T.DoubleSide }));
    f.position.set(1.45, 14.1, 0); g.add(f);
    w.add(g);
  }

  function buildCenter(w) {
    // platform with an eight-pointed star mosaic
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d');
    x.fillStyle = '#efe0c0'; x.beginPath(); x.arc(256, 256, 256, 0, Math.PI * 2); x.fill();
    x.strokeStyle = '#1b8a8a'; x.lineWidth = 14; x.beginPath(); x.arc(256, 256, 240, 0, Math.PI * 2); x.stroke();
    const star = (r, col) => {

      for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = i % 2 ? r * 0.72 : r; x.lineTo(256 + Math.cos(a) * rr, 256 + Math.sin(a) * rr); }

    for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8; x.fillStyle = i % 2 ? '#c8553d' : '#1b8a8a'; x.beginPath(); x.arc(256 + Math.cos(a) * 222, 256 + Math.sin(a) * 222, 8, 0, Math.PI * 2); x.fill(); }
    const top = new T.Mesh(new T.CircleGeometry(1.5, 48), new T.MeshStandardMaterial({ map: texFrom(c), roughness: 0.7 }));
    top.rotation.x = -Math.PI / 2; top.position.y = 0.121; w.add(top);
    const base = new T.Mesh(new T.CylinderGeometry(1.52, 1.62, 0.12, 48), new T.MeshStandardMaterial({ color: '#d9c29a', roughness: 0.9 }));
    base.position.y = 0.06; w.add(base);
    // flag pole with a waving Omani flag
    const [px, pz] = polar(36, 4.2);
    const pole = new T.Mesh(new T.CylinderGeometry(0.05, 0.06, 5.2, 10), new T.MeshStandardMaterial({ color: '#e8e8e8', metalness: 0.4, roughness: 0.4 }));
    pole.position.set(px, 2.6, pz); w.add(pole);

  const creatureEls = new Map(), signEls = new Map(), zoneGroups = new Map(), discovered = new Set();

  function buildZones() {
    for (const z of ZONES) {
      const [x, zz] = polar(z.angle, ZONE_R);
      const zoneEl = document.createElement('a-entity'); worldEl.appendChild(zoneEl);
      zoneEl.object3D.position.set(x, 0, zz); zoneEl.object3D.rotation.y = rad(-z.angle);
      const g = zoneEl.object3D, k = new Kit();
      DECOR[z.id](g, k);
      g.add(k.build());
      zoneGroups.set(z.id, zoneEl);
      for (const c of CREATURES.filter(c => c.zone === z.id)) {
        const model = MODELS[c.id]();
        const s = SIZE[c.id] || 1; model.scale.setScalar(s);
        const holder = new T.Group(); holder.add(model);
        const h = heightOf(model);
        // generous invisible hit area so small hands and shaky lasers still select it
        const hit = new T.Mesh(new T.CylinderGeometry(Math.max(0.45, h * 0.32), Math.max(0.45, h * 0.32), h + 0.3, 10),
          new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
        hit.position.y = h / 2; holder.add(hit);
        const el = entityWith(holder, zoneEl);
        const baseY = c.id === 'duck' || c.id === 'fish' ? 0.04 : c.pos[1];
        el.object3D.position.set(c.pos[0], baseY, c.pos[2]);
        el.object3D.rotation.y = (rnd() - 0.5) * 0.6;
        if (c.id !== 'fish') blobShadow(g, Math.max(0.35, h * 0.3), c.pos[0], c.pos[2]);
        if (c.id === 'turtle') { const rk = new Kit(); rk.add(GEO.ico(0.55, 0), '#8d99a6', [0, 0.08, 0], [0.3, 0.5, 0], [1.3, 0.4, 1.1], true); const rock = rk.build(); rock.position.set(c.pos[0], 0, c.pos[2]); g.add(rock); el.object3D.position.y = 0.2; }
        if (c.id === 'frog') { const lp = new T.Mesh(new T.CylinderGeometry(0.5, 0.5, 0.02, 20), new T.MeshStandardMaterial({ color: '#4caf50' })); lp.position.set(c.pos[0], 0.05, c.pos[2]); g.add(lp); el.object3D.position.y = 0.06; }
        el._c = c; el._h = h * 1; el._model = model;
        clickable(el, () => onCreature(c), { hover: 1.06 });
        creatureEls.set(c.id, el);
        addIdle(el, c, model);
      }
      buildSign(z, zoneEl);
    }
  }

  function addIdle(el, c, model) {
    const ph = rnd() * 6, o = model;
    if (c.id === 'fish') {
      idlers.push({ step(t) {
        const cyc = (t + ph) % 4.5, k = cyc / 1.1;
        if (k < 1) { o.position.y = Math.sin(k * Math.PI) * 0.9; o.position.z = (k - 0.5) * 1.2; o.rotation.x = (k - 0.5) * 2.2; }
        else { o.position.y = -0.05 + Math.sin(t * 2) * 0.03; o.position.z = 0; o.rotation.x = 0; }
      } });
      return;
    }
    if (c.plant) { idlers.push({ step(t) { o.rotation.z = Math.sin(t * 0.9 + ph) * 0.025; } }); return; }
    if (c.id === 'duck') { idlers.push({ step(t) { o.position.y = Math.sin(t * 1.6 + ph) * 0.03; o.rotation.y = Math.sin(t * 0.3 + ph) * 0.6; } }); return; }
    idlers.push({ step(t) {
      o.scale.y = (SIZE[c.id] || 1) * (1 + Math.sin(t * 2 + ph) * 0.015);
      o.rotation.y = Math.sin(t * 0.35 + ph) * 0.25;
    } });
  }

  // Habitat sign: large board at the BACK of each habitat, above the animals.
  function signCanvas(z, rim) {
    const c = document.createElement('canvas'); c.width = 1100; c.height = 440;
    const x = c.getContext('2d'), W = c.width, H = c.height, top = 70;
    x.fillStyle = '#9a6a3c';
    // crenellated top, like an Omani fort parapet
    for (let i = 0; i < 11; i++) { const cx = 50 + i * 100; x.beginPath(); x.moveTo(cx - 34, top + 4); x.lineTo(cx, 8); x.lineTo(cx + 34, top + 4); x.closePath(); x.fill(); }
    x.beginPath(); x.roundRect(10, top, W - 20, H - top - 10, 34); x.fill();
    x.lineWidth = 16; x.strokeStyle = rim; x.stroke();
    x.fillStyle = '#fdf4e0'; x.beginPath(); x.roundRect(40, top + 30, W - 80, H - top - 70, 24); x.fill();
    x.fillStyle = z.accent + '2a'; x.beginPath(); x.arc(W - 200, (top + H) / 2 - 5, 120, 0, Math.PI * 2); x.fill();
    drawEmoji(x, z.icon, W - 200, (top + H) / 2 - 5, 150);
    x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = C.ink;
    let fs = 150; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(z.name).width > W - 460 && fs > 40) { fs -= 6; x.font = `800 ${fs}px ${FONT}`; }
    x.fillText(z.name, (80 + W - 330) / 2, (top + H) / 2);
    return c;
  }
  function buildSign(z, zoneEl) {

    for (const s of [-1, 1]) k.add(GEO.cyl(0.09, 0.11, 4.2, 8), '#7a5234', [s * 1.7, 2.1, -0.06], [0, 0, 0], [1, 1, 1], true);

  function tintSign(z, rim) {
    const el = signEls.get(z.id); const old = el._board.material.map;
    el._board.material.map = texFrom(signCanvas(z, rim)); el._board.material.needsUpdate = true; old.dispose();
  }

  function nameTag(c) {
    const el = creatureEls.get(c.id);
    if (el._tag) return;
    const cv = document.createElement('canvas'); cv.width = 640; cv.height = 150;
    const x = cv.getContext('2d');
    x.fillStyle = 'rgba(31,58,77,.25)'; x.beginPath(); x.roundRect(6, 14, 628, 128, 64); x.fill();
    x.fillStyle = '#fffdf7'; x.beginPath(); x.roundRect(6, 6, 628, 128, 64); x.fill();
    x.lineWidth = 6; x.strokeStyle = C.leaf; x.stroke();
    x.fillStyle = C.leaf; x.beginPath(); x.arc(560, 70, 42, 0, Math.PI * 2); x.fill();
    x.strokeStyle = '#fff'; x.lineWidth = 10; x.lineCap = 'round'; x.beginPath(); x.moveTo(540, 70); x.lineTo(555, 86); x.lineTo(582, 54); x.stroke();
    x.direction = 'rtl'; x.fillStyle = C.ink; x.textAlign = 'center'; x.textBaseline = 'middle';
    let fs = 64; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(c.name).width > 440 && fs > 24) { fs -= 4; x.font = `800 ${fs}px ${FONT}`; }
    x.fillText(c.name, 270, 74);
    const m = planeMesh(cv, 0.95);
    const s = el._model.scale.x;
    m.position.y = el._h + 0.3; m.scale.setScalar(1 / (el.object3D.scale.x || 1));
    el.object3D.add(m); billboards.push(m); el._tag = m;

  }

  // =====================================================================
  // Panels near the child
  // =====================================================================
  let panel = null, infoCard = null, hudMesh = null;
  const inXR = () => scene.is('vr-mode') || scene.is('ar-mode');
  function eyeY() { return Math.min(1.75, Math.max(1.0, camPos.y - 0.08)); }
  function frontOf(dist, dirOverride) {
    const dir = dirOverride ? dirOverride.clone() : new T.Vector3();
    if (!dirOverride) scene.camera.getWorldDirection(dir);
    dir.y = 0; if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1); dir.normalize();
    const d = dist * (!inXR() && innerWidth < innerHeight ? 1.7 : 1);
    return { pos: new T.Vector3(camPos.x + dir.x * d, 0, camPos.z + dir.z * d), rotY: Math.atan2(-dir.x, -dir.z) };
  }
  function place(el, dist, dir, halfW) {
    const { pos, rotY } = frontOf(dist, dir);
    pos.y = eyeY();
    el.object3D.position.copy(pos); el.object3D.rotation.set(0, rotY, 0);
    el.object3D.scale.setScalar(0.6);
    tween(0.25, k => el.object3D.scale.setScalar(0.6 + 0.4 * (1 - Math.pow(1 - k, 3))));
    salemBeside(pos, rotY, halfW);
  }
  function closePanel() { if (panel) { panel.remove(); panel = null; } }
  function closeInfo() { if (infoCard) { infoCard.remove(); infoCard = null; } }

  function showPanel(spec, buttons = [], dist = 2.2) {
    closePanel(); closeInfo();
    const el = document.createElement('a-entity'); uiEl.appendChild(el);
    const card = planeMesh(cardCanvas(spec), spec.w);
    el.object3D.add(card);
    const h = card.userData.h;
    const bw = Math.min(0.95, (spec.w - 0.2) / Math.max(1, buttons.length) - 0.08);
    buttons.forEach((b, i) => {
      const btn = button(b.label, el, { w: bw, h: 0.22, color: b.color || C.sun, text: b.text || C.ink }, b.onClick);
      const n = buttons.length, x = (n - 1 - i - (n - 1) / 2) * (bw + 0.1);
      btn.object3D.position.set(x, -h / 2 - 0.09, 0.02);
    });
    // raise the card so its buttons sit near eye level
    card.position.y = buttons.length ? 0.12 : 0;
    el.object3D.children.forEach(o => { if (o !== card) o.position.y += 0.12; });
    panel = el;
    place(el, dist, null, spec.w / 2);

  function setHud(text, sub) {
    const W = 900, H = 170, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = 'rgba(31,58,77,.88)'; x.beginPath(); x.roundRect(4, 4, W - 8, H - 8, (H - 8) / 2); x.fill();
    x.fillStyle = C.red; x.fillRect(H / 2, 4, 90, 8); x.fillStyle = '#fff'; x.fillRect(H / 2 + 90, 4, 90, 8); x.fillStyle = C.green; x.fillRect(H / 2 + 180, 4, 90, 8);
    x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
    let fs = sub ? 54 : 62; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(text).width > W - 90 && fs > 26) { fs -= 3; x.font = `800 ${fs}px ${FONT}`; }
    x.fillText(text, W / 2, sub ? H * 0.37 : H / 2);
    if (sub) {
      let s2 = 38; x.font = `700 ${s2}px ${FONT}`;
      while (x.measureText(sub).width > W - 90 && s2 > 20) { s2 -= 2; x.font = `700 ${s2}px ${FONT}`; }
      x.fillStyle = '#ffe28a'; x.fillText(sub, W / 2, H * 0.73);
    }
    if (hudMesh) { hudMesh.parent.remove(hudMesh); hudMesh.material.map.dispose(); }
    hudMesh = planeMesh(c, 0.72, { overlay: true });
    hudMesh.position.set(0, -0.42, -1); camEl.object3D.add(hudMesh);
  }

    if (mode === 'game') return answer(zoneById(c.zone));

  function pickRounds() {
    const byZone = ZONES.map(z => shuffle(CREATURES.filter(c => c.zone === z.id))[0]);
    const rest = shuffle(CREATURES.filter(c => !byZone.includes(c)));
    return shuffle(byZone.concat(rest.slice(0, GAME_ROUNDS - byZone.length)));
  }
  function startGame() {
    closePanel(); closeInfo();
    mode = 'game';
    game = { rounds: pickRounds(), i: 0, stars: 0, misses: 0, lost: null, busy: false };
    nextRound();
  }

  function nextRound() {
    if (game.lost) { game.lost.parent && game.lost.parent.remove(game.lost); game.lost = null; }
    signEls.forEach(b => pulse(b, false));
    if (game.i >= game.rounds.length) return summary();
    const c = game.rounds[game.i];
    game.misses = 0; game.busy = false;
    const g = new T.Group();
    const k = new Kit();
    k.add(GEO.cyl(0.3, 0.36, 0.7, 24), '#fffdf7', [0, 0.35, 0]);
    k.add(GEO.cyl(0.38, 0.38, 0.06, 24), C.sun, [0, 0.72, 0]);
    k.add(GEO.tor(0.34, 0.02), C.coral, [0, 0.5, 0], [Math.PI / 2, 0, 0]);
    g.add(k.build());
    const model = MODELS[c.id]();
    const size = new T.Box3().setFromObject(model).getSize(new T.Vector3());
    const h = size.y, s = 0.85 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(s); model.position.y = 0.75; g.add(model);
    const qc = document.createElement('canvas'); qc.width = qc.height = 128;
    const qx = qc.getContext('2d'); qx.fillStyle = C.coral; qx.beginPath(); qx.arc(64, 64, 58, 0, Math.PI * 2); qx.fill();
    qx.fillStyle = '#fff'; qx.font = `800 96px ${FONT}`; qx.textAlign = 'center'; qx.textBaseline = 'middle'; qx.fillText('؟', 64, 70);
    const q = planeMesh(qc, 0.28); q.position.set(0.42, 0.75 + h * s + 0.1, 0); g.add(q); billboards.push(q);
    const { pos, rotY } = frontOf(2.4);
    g.position.copy(pos); g.rotation.y = rotY;
    scene.object3D.add(g);
    idlers.push(g.userData.idle = { step(t) { model.rotation.y = Math.sin(t * 1.2) * 0.5; } });
    game.lost = g; game.model = model;
    salemBeside(pos.clone().setY(0), rotY, 0.35);
    setHud(`أَيْنَ ${L.verb(c)} ${c.name}؟`, `الْمِسْ لَوْحَةَ الْبِيئَةِ الصَّحِيحَةِ • ${toAr(game.i + 1)} / ${toAr(game.rounds.length)}`);
    setMood('think'); say('q_' + c.id);
  }

  function answer(z) {
    if (!game || game.busy) return;
    const c = game.rounds[game.i];
    const board = signEls.get(z.id);
    if (z.id === c.zone) {
      game.busy = true;
      if (game.misses === 0) game.stars++;
      sfx.good(); setMood('cheer');
      tintSign(z, C.leaf);
      setHud(`أَحْسَنْتَ! ${L.lines['a_' + c.id]}`, `⭐ ${toAr(game.stars)}`);
      say([pick(['right1', 'right2', 'right3']), 'a_' + c.id]);
      const g = game.lost, from = new T.Vector3(); game.model.getWorldPosition(from);
      const [tx, tz] = polar(z.angle, ZONE_R - 1.5), to = new T.Vector3(tx, 1.2, tz);
      const model = game.model; g.remove(model); scene.object3D.add(model); model.position.copy(from);
      idlers.splice(idlers.indexOf(g.userData.idle), 1);
      g.parent.remove(g); game.lost = null;
      tween(1.3, k => {
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        model.position.lerpVectors(from, to, e); model.position.y += Math.sin(k * Math.PI) * 2.2;
        model.rotation.y += 0.15;
      }, () => {
        burst(to); scene.object3D.remove(model); hop(creatureEls.get(c.id));
        setTimeout(() => { tintSign(z, z.accent); game.i++; nextRound(); }, 2200);
      });
    } else {
      game.misses++;
      sfx.bad(); shake(board); setMood('think');
      tintSign(z, C.red);
      setTimeout(() => tintSign(z, z.accent), 800);
      const right = zoneById(c.zone);
      setHud('حَاوِلْ مَرَّةً أُخْرَى 🙂', game.misses >= 2 ? `تَلْمِيحٌ: ابْحَثْ عَنْ ${right.name}` : c.fact);
      if (game.misses >= 2) { pulse(signEls.get(c.zone), true); say(['wrong2', 'hint']); }
      else say('wrong1');
    }
  }

    showPanel({

        { type: 'highlight', t: 'قَارِنْ: الْجَمَلُ يَعِيشُ فِي الصَّحْرَاءِ، وَالسَّمَكَةُ تَعِيشُ فِي الْمَاءِ.', size: 0.064, color: C.leaf },

  // =====================================================================
  // Salem's Hub, shared with the other lessons (window.SalemHub, lib/hub.js): the companion the
  // child is growing, and a portal back to it. Discoveries here don't feed the journal yet — that
  // starts from lesson 2; this lesson just shows the shared companion and the way back.
  // =====================================================================
  const HUB_OK = typeof window.SalemHub !== 'undefined';
  const hub = HUB_OK ? window.SalemHub : { stage: () => 0, xpToNext: () => null, xp: () => 0, recordVisit: () => {} };
  function companionModel(stage) {
    const k = new Kit(), tan = '#c88a4a', dark = '#8a5a2a', cream = '#f4e6c8', speck = '#a87840', eyeC = '#2a1810';
    if (stage === 0) {
      k.ell(cream, [0, 0.09, 0], [0.09, 0.11, 0.095]);
      for (const [x, y, z] of [[0.03, 0.14, 0.04], [-0.04, 0.06, -0.03], [0.02, 0.03, 0.06]]) k.ell(speck, [x, y, z], [0.012, 0.01, 0.012]);
      return k.build();
    }
    const s = stage === 1 ? 0.6 : stage === 2 ? 0.85 : 1.1;
    k.ell(tan, [0, 0.11 * s, 0], [0.11 * s, 0.11 * s, 0.14 * s]);
    k.ell(cream, [0, 0.07 * s, 0.06 * s], [0.08 * s, 0.075 * s, 0.09 * s]);
    k.ell(tan, [0, 0.19 * s, 0.08 * s], [0.075 * s, 0.075 * s, 0.075 * s]);
    for (const sx of [-1, 1]) { k.ell('#ffffff', [sx * 0.035 * s, 0.2 * s, 0.13 * s], [0.024 * s, 0.024 * s, 0.02 * s]); k.ell(eyeC, [sx * 0.035 * s, 0.2 * s, 0.145 * s], [0.013 * s, 0.013 * s, 0.008 * s]); }
    k.add(GEO.cone(0.02 * s, 0.045 * s, 8), dark, [0, 0.185 * s, 0.155 * s], [Math.PI / 2, 0, 0]);
    const wingA = stage === 1 ? 0.15 : stage === 2 ? 0.5 : 1.0;
    for (const sx of [-1, 1]) k.ell(dark, [sx * 0.1 * s, 0.1 * s, -0.02 * s], [0.05 * s, 0.09 * s * (0.6 + wingA * 0.5), 0.13 * s], [0, 0, sx * (0.25 + wingA * 0.9)]);
    if (stage >= 2) for (const sx of [-1, 1]) for (let i = 0; i < 3; i++) k.ell(speck, [sx * (0.12 + i * 0.03) * s, 0.03 * s, -0.2 * s], [0.018 * s, 0.012 * s, 0.05 * s], [0, 0, sx * 0.3]);
    if (stage >= 3) k.ell(dark, [0, 0.24 * s, 0.02 * s], [0.02 * s, 0.03 * s, 0.02 * s]);
    for (const sx of [-1, 1]) k.add(GEO.cyl(0.006 * s, 0.005 * s, 0.05 * s, 6), dark, [sx * 0.02 * s, 0.005 * s, 0.02 * s]);
    return k.build();
  }
  const COMPANION_TITLE = ['بَيْضَةٌ سِحْرِيَّةٌ', 'رَفِيقُكَ الصَّغِيرُ', 'رَفِيقُكَ يَكْبَرُ', 'رَفِيقُكَ الطَّائِرُ الْكَامِلُ'];
  function buildCompanionEntity() {
    const root = new T.Group();
    const [x, z] = polar(300, 6.5);
    root.position.set(x, 0.55, z);
    const perch = new T.Mesh(new T.CylinderGeometry(0.02, 0.025, 0.55, 8), new T.MeshStandardMaterial({ color: '#7a5234' }));
    perch.position.y = -0.28; root.add(perch);
    const stage = hub.stage();
    root.add(companionModel(stage));
    const el = entityWith(root, worldEl);
    clickable(el, () => showCompanion(stage), { hover: 1.08 });
    idlers.push({ ph: rnd() * 6, step(t) { root.children[1] && (root.children[1].rotation.y = Math.sin(t * 0.6 + this.ph) * 0.3); } });
  }
  function companionBarCanvas(stage) {
    const c = document.createElement('canvas'); c.width = 900; c.height = 140; const x = c.getContext('2d');
    x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'middle';
    const left = hub.xpToNext();
    x.fillStyle = '#e8e1d2'; x.beginPath(); x.roundRect(20, 60, 860, 36, 18); x.fill();
    const span = hub.STAGES && hub.STAGES[stage + 1] ? hub.STAGES[stage + 1] - hub.STAGES[stage] : 1;
    const pct = left === null ? 1 : Math.min(1, 1 - left / span);
    x.fillStyle = C.leaf; x.beginPath(); x.roundRect(20, 60, 860 * Math.max(0.06, pct), 36, 18); x.fill();
    x.fillStyle = C.ink; x.font = `700 30px ${FONT}`;
    x.fillText(left === null ? 'وَصَلَ لِأَقْصَى حَجْمٍ! 🏆' : `يَحْتَاجُ ${toAr(left)} اكْتِشَافٍ لِيَكْبَرَ`, 880, 30);
    return c;
  }
  function showCompanion(stage) {
    closePanel();
    const bar = planeMesh(companionBarCanvas(stage), 1.5);
    showPanel({
      w: 1.7, accent: '#c88a4a', icon: '🦅', title: COMPANION_TITLE[stage],
      blocks: [{ t: 'رَفِيقُكَ يَكْبَرُ فِي كُلِّ رِحْلَاتِكَ مَعَ سَالِمٍ، لَيْسَ هُنَا فَقَطْ!', size: 0.058 }],
    }, [{ label: 'رُجُوعٌ', color: '#dff1ff', onClick: closePanel }]);
    if (panel) { bar.position.set(0, -0.55, 0.02); panel.object3D.add(bar); }
  }

  // portal to lesson 2
  function portalTexture(t) {
    const c = document.createElement('canvas'); c.width = c.height = 300; const x = c.getContext('2d');
    const g = x.createRadialGradient(150, 150, 10, 150, 150, 150);
    g.addColorStop(0, '#fff3c4'); g.addColorStop(0.5, '#e76f51'); g.addColorStop(1, '#1f3a4d');
    x.fillStyle = g; x.beginPath(); x.arc(150, 150, 148, 0, Math.PI * 2); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 3;
    for (let r = 20; r < 145; r += 22) { x.beginPath(); x.arc(150, 150, r + Math.sin(t * 2 + r) * 6, 0, Math.PI * 2); x.stroke(); }
    return c;
  }
  function buildPortal() {
    const g = new T.Group();
    const k = new Kit(), wood = '#8a5a34';
    for (const s of [-1, 1]) k.add(GEO.cyl(0.14, 0.16, 2.6, 12), wood, [s * 0.85, 1.3, 0], [0, 0, 0], [1, 1, 1], true);
    k.add(GEO.cyl(0.15, 0.15, 2.0, 12), wood, [0, 2.55, 0], [0, 0, Math.PI / 2], [1, 1, 1], true);
    g.add(k.build());
    const disc = new T.Mesh(new T.CircleGeometry(0.78, 32), new T.MeshBasicMaterial({ map: new T.CanvasTexture(portalTexture(0)) }));
    disc.position.set(0, 1.3, 0); g.add(disc); disc.userData.t = rnd() * 6;
    idlers.push({ step() { disc.userData.t += 0.02; disc.material.map.dispose(); disc.material.map = new T.CanvasTexture(portalTexture(disc.userData.t)); disc.material.map.colorSpace = T.SRGBColorSpace; disc.material.needsUpdate = true; } });
    const sign = planeMesh(buttonCanvas('٢ — صَغِيرُ الْإِنْسَانِ وَالْحَيَوَانِ 🐪', { color: '#fffdf7', text: C.ink, w: 1.5, h: 0.3 }), 1.4);
    sign.position.set(0, 2.4, 0); g.add(sign); billboards.push(sign);
    const hit = new T.Mesh(new T.CylinderGeometry(0.85, 0.85, 2.2, 12), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    hit.position.y = 1.3; g.add(hit);
    const [x, z] = polar(0, 24);
    const el = entityWith(g, worldEl);
    el.object3D.position.set(x, 0, z); el.object3D.rotation.y = rad(-180);
    clickable(el, onPortal, { hover: 1.02 });
  }
  function onPortal() {
    if (mode === 'game') return;
    showPanel({
      w: 1.8, accent: C.teal, icon: '🚪', title: 'بَوَّابَةٌ سِحْرِيَّةٌ',
      blocks: [{ t: 'تَبِي تَزُورُ صَغِيرَ الْإِنْسَانِ وَصَغِيرَ الْحَيَوَانِ؟', size: 0.066 }],
    }, [
      { label: 'ادْخُلِ الْبَوَّابَةَ', color: C.teal, text: '#fff', onClick: () => (GALLERY ? null : (location.href = '../lesson-02-young-animals/')) },
      { label: 'رُجُوعٌ', color: '#dff1ff', onClick: closePanel },
    ]);
    setMood('point');
  }


  // ---------- Boot ----------
  async function boot() {
    const timeout = ms => new Promise(r => setTimeout(r, ms));
    await Promise.race([
      Promise.all([document.fonts.load(`800 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`600 40px "Baloo Bhaijaan 2"`, 'عربي'),
        document.fonts.load(`700 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`40px "Noto Color Emoji"`, '🐪')]),
      timeout(3500),
    ]).catch(() => {});
    try { maxAniso = scene.renderer.capabilities.getMaxAnisotropy(); } catch (e) { /* keep default */ }
    buildSky();
    if (GALLERY) { buildLandscape(); gallery(); document.getElementById('loader').hidden = true; return; }
    buildLandscape();
    buildZones();
    if (!GALLERY) { hub.recordVisit('lesson-01-local-habitats'); buildCompanionEntity(); buildPortal(); }
    salem = buildSalem(); salem.baseY = 0;
    scene.object3D.add(salem.root);
    setTimeout(() => {
      if (scene.camera) scene.camera.getWorldPosition(camPos);
      welcome();
      document.getElementById('loader').hidden = true;
    }, 200);
  }
  if (scene.hasLoaded) boot(); else scene.addEventListener('loaded', boot);
})();
</script>
</body>
