<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صغير الإنسان وصغير الحيوان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<script src="../lib/aframe-1.7.1.min.js"></script>
<script src="content.js"></script>
<style>
  :root {
    --ink: #1f3a4d;
    --sand: #f6e7c8;
    --sun: #f4b942;
    --om-red: #d6172b;
    --om-green: #00843d;
    --paper: #fffdf7;
    --font: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #cdeefc; font-family: var(--font); color: var(--ink); }
  #loader {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(#bfe6fb, #f6e7c8); text-align: center; padding-inline: 16px;
  }
  #loader .flag { display: flex; width: 84px; height: 48px; margin: 0 auto 14px; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px rgba(31,58,77,.2); }
  #loader .flag i { display: block; }
  #loader b { display: block; font-size: clamp(26px, 6vw, 42px); font-weight: 800; }
  #loader span { font-size: 18px; opacity: .8; }
  #topbar {
    position: fixed; top: env(safe-area-inset-top, 0px); inset-inline: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 16px; pointer-events: none;
  }
  #topbar .hint {
    background: rgba(255, 253, 247, .94); border-radius: 999px; padding: 6px 14px;
    font-size: 15px; font-weight: 700; box-shadow: 0 2px 8px rgba(31, 58, 77, .15);
  }
  #sound {
    pointer-events: auto; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 15px;
    background: var(--sun); color: var(--ink); border-radius: 999px; padding: 8px 14px;
    box-shadow: 0 2px 8px rgba(31, 58, 77, .2);
  }
  #sound:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .a-enter-vr { z-index: 11; }
  [hidden] { display: none !important; }
</style>
<script>
  // Components must be registered before the scene is parsed.
  AFRAME.registerComponent('snap-turn', {
    // Right (and left) thumbstick: flick sideways to turn 30°. Arrow keys do the same on desktop.
    schema: { angle: { default: 30 } },
    init() {
      this.latched = false;
      this.cam = document.getElementById('cam');
      const onMove = e => {
        const x = e.detail.x;
        if (!this.latched && Math.abs(x) > 0.65) { this.latched = true; this.turn(x > 0 ? -1 : 1); }
        else if (Math.abs(x) < 0.3) this.latched = false;
      };
      this.el.querySelectorAll('[laser-controls]').forEach(h => h.addEventListener('thumbstickmoved', onMove));
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') this.turn(1);
        if (e.key === 'ArrowRight') this.turn(-1);
      });
    },
    turn(dir) {
      const o = this.el.object3D, before = new THREE.Vector3(), after = new THREE.Vector3();
      this.cam.object3D.getWorldPosition(before);
      o.rotation.y += dir * this.data.angle * Math.PI / 180;
      o.updateMatrixWorld(true);
      this.cam.object3D.getWorldPosition(after);
      o.position.x += before.x - after.x; o.position.z += before.z - after.z;
      this.el.emit('snapturn');
    }
  });
</script>
</head>
<body>
<div id="loader"><div>
  <div class="flag" aria-hidden="true"><i style="width:33%;background:var(--om-red)"></i><i style="flex:1;background:linear-gradient(#fff 0 33.3%,var(--om-red) 33.3% 66.6%,var(--om-green) 66.6%)"></i></div>
  <b>صَغِيرُ الْإِنْسَانِ وَصَغِيرُ الْحَيَوَانِ</b>
  <span>جَارٍ تَجْهِيزُ الرِّحْلَةِ…</span>
</div></div>
<div id="topbar">
  <span class="hint">اسحب لتنظر حولك • المس الصغار • ← → للالتفاف • زر VR للنظارة</span>
  <button id="sound" type="button" aria-pressed="true">🔊 الصوت</button>
</div>

<a-scene id="scene" loading-screen="enabled: false" renderer="antialias: true; foveationLevel: 1; highRefreshRate: true"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 80" background="color: #cdeefc">
  <a-entity light="type: hemisphere; color: #e6f5ff; groundColor: #a08a62; intensity: 1.25"></a-entity>
  <a-entity light="type: directional; color: #fff0d2; intensity: 1.55" position="-6 12 8"></a-entity>
  <a-entity light="type: directional; color: #cfe6ff; intensity: 0.35" position="8 5 -6"></a-entity>

  <a-entity id="rig" snap-turn>
    <a-entity id="cam" camera="near: 0.05; far: 900" look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
    <a-entity id="handR" laser-controls="hand: right" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
    <a-entity id="handL" laser-controls="hand: left" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
  </a-entity>

  <a-entity id="world"></a-entity>
  <a-entity id="ui"></a-entity>
</a-scene>

<script>
(() => {
  'use strict';
  const L = window.LESSON, T = THREE;
  const FAMILIES = L.families;
  // Sign above each enclosure: parent and young together.
  const SIGN = { lion: 'الْأَسَدُ وَالشِّبْلُ', elephant: 'الْفِيلُ وَصَغِيرُهُ', camel: 'النَّاقَةُ وَالْحُوَارُ', goat: 'الْمَاعِزُ وَالْجَدْيُ',
    duck: 'الْبَطَّةُ وَصِغَارُهَا', rabbit: 'الْأَرْنَبُ وَصِغَارُهَا', human: 'الْأُمُّ وَالطِّفْلُ' };
  FAMILIES.forEach(f => { f.name = SIGN[f.id]; });
  const GAME_ROUNDS = 5;
  const ZONE_R = 9, SIGN_Z = -5.0;
  const GALLERY = /[?&]gallery\b/.test(location.search);
  const TEST = /[?&]test\b/.test(location.search);

  const rad = d => d * Math.PI / 180;
  const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const fam = id => FAMILIES.find(f => f.id === id);
  const inZone = n => n.replace(/ُ$/, 'ِ'); // الشِّبْلُ → (أُمُّ) الشِّبْلِ
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const scene = document.getElementById('scene');
  const worldEl = document.getElementById('world');
  const uiEl = document.getElementById('ui');
  const camEl = document.getElementById('cam');

  // =====================================================================
  // Geometry kit: builds each model from simple shapes, then merges them into
  // one vertex-coloured mesh (one draw call per model — important on Quest).
  // =====================================================================
  const MAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0 });
  const MAT_FLAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true });
  const GEO = {
    sph: new T.SphereGeometry(1, 18, 14),
    sphLo: new T.SphereGeometry(1, 10, 8),
    cyl: (rt, rb, h, s = 16) => new T.CylinderGeometry(rt, rb, h, s),
    cone: (r, h, s = 16) => new T.ConeGeometry(r, h, s),
    box: (w, h, d) => new T.BoxGeometry(w, h, d),
    tor: (R, r, arc = Math.PI * 2) => new T.TorusGeometry(R, r, 8, 20, arc),
    ico: (r, d = 0) => new T.IcosahedronGeometry(r, d),
  };
  const _m = new T.Matrix4(), _q = new T.Quaternion(), _e = new T.Euler(), _p = new T.Vector3(), _s = new T.Vector3();

  class Kit {
    constructor() { this.smooth = []; this.flat = []; }
    add(geo, color, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1], flat = false) {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      _e.set(r[0], r[1], r[2], r[3] || 'XYZ'); _q.setFromEuler(_e);
      _m.compose(_p.set(p[0], p[1], p[2]), _q, _s.set(s[0], s[1], s[2]));
      g.applyMatrix4(_m);
      const c = new T.Color(color), n = g.attributes.position.count, col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      g.setAttribute('color', new T.BufferAttribute(col, 3));
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(k)) g.deleteAttribute(k);
      (flat ? this.flat : this.smooth).push(g);
      return this;
    }
    // ellipsoid
    ell(color, p, s, r = [0, 0, 0], flat = false) {
      const big = Math.max(s[0], s[1], s[2]) > 0.09;
      return this.add(big ? GEO.sph : GEO.sphLo, color, p, r, s, flat);
    }
    build() {
      const g = new T.Group();
      if (this.smooth.length) g.add(new T.Mesh(merge(this.smooth), MAT));
      if (this.flat.length) g.add(new T.Mesh(merge(this.flat), MAT_FLAT));
      return g;
    }
  }
  function merge(list) {
    let n = 0; for (const g of list) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    for (const g of list) {
      pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); col.set(g.attributes.color.array, o * 3);
      o += g.attributes.position.count; g.dispose();
    }
    const out = new T.BufferGeometry();
    out.setAttribute('position', new T.BufferAttribute(pos, 3));
    out.setAttribute('normal', new T.BufferAttribute(nor, 3));
    out.setAttribute('color', new T.BufferAttribute(col, 3));
    out.computeBoundingSphere(); out.computeBoundingBox();
    return out;
  }
  function eyes(k, x, y, z, r, iris = '#2a1b12') {
    for (const s of [-1, 1]) {
      k.ell('#ffffff', [s * x, y, z], [r, r * 1.05, r * 0.8]);
      k.ell(iris, [s * x, y, z + r * 0.5], [r * 0.64, r * 0.68, r * 0.45]);
      k.ell('#ffffff', [s * x + r * 0.22, y + r * 0.28, z + r * 0.85], [r * 0.2, r * 0.2, r * 0.12]);
    }
  }
  const legs4 = (k, color, xs, zs, len, r, y0 = 0, hoof) => {
    for (const x of xs) for (const z of zs) {
      k.add(GEO.cyl(r, r * 0.85, len, 12), color, [x, y0 + len / 2, z]);
      if (hoof) k.add(GEO.cyl(r * 1.05, r * 1.1, 0.08, 12), hoof, [x, 0.04, z]);
    }
  };
  const jitter = (geo, amt) => {
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) if (p.getY(i) > -geo.parameters.height / 2 + 0.01) {
      p.setXYZ(i, p.getX(i) + (rnd() - 0.5) * amt, p.getY(i) + (rnd() - 0.5) * amt * 0.6, p.getZ(i) + (rnd() - 0.5) * amt);
    }
    geo.computeVertexNormals(); return geo;
  };

  // =====================================================================
  // Creature and plant models. Each faces +Z, stands on y = 0.
  // =====================================================================
  const MODELS = {
    camel() {
      const k = new Kit(), fur = '#d6a468', dark = '#b58045', light = '#edc795';
      k.ell(fur, [0, 1.32, 0], [0.5, 0.42, 0.95]);
      k.ell(fur, [0, 1.74, -0.15], [0.36, 0.38, 0.44]);
      // Omani saddle cloth: red, white and green
      k.ell('#d6172b', [0, 1.52, 0.38], [0.53, 0.2, 0.3]);
      k.ell('#ffffff', [0, 1.6, 0.38], [0.47, 0.16, 0.27]);
      k.ell('#00843d', [0, 1.66, 0.38], [0.41, 0.12, 0.24]);
      for (const x of [-0.53, 0.53]) for (const z of [0.2, 0.38, 0.56]) k.ell('#f4b942', [x, 1.36, z], [0.035, 0.05, 0.035]);
      for (const x of [-0.27, 0.27]) for (const z of [-0.58, 0.58]) {
        k.add(GEO.cyl(0.13, 0.09, 0.5, 12), fur, [x, 1.02, z]);
        k.add(GEO.cyl(0.075, 0.07, 0.8, 12), dark, [x, 0.42, z]);
        k.ell(dark, [x, 0.72, z], [0.1, 0.1, 0.1]);
        k.ell('#8a6038', [x, 0.04, z + 0.04], [0.13, 0.05, 0.16]);
      }
      k.add(GEO.cyl(0.13, 0.2, 0.98, 14), fur, [0, 1.74, 0.94], [0.55, 0, 0]);
      k.ell(fur, [0, 2.2, 1.3], [0.17, 0.16, 0.3]);
      k.ell(light, [0, 2.13, 1.55], [0.14, 0.12, 0.14]);
      for (const s of [-1, 1]) {
        k.ell('#5a3b22', [s * 0.05, 2.15, 1.68], [0.022, 0.016, 0.01]);
        k.ell(fur, [s * 0.14, 2.33, 1.16], [0.04, 0.075, 0.03], [0, 0, s * -0.3]);
      }
      eyes(k, 0.13, 2.26, 1.36, 0.045);
      k.add(GEO.cyl(0.025, 0.04, 0.55, 8), dark, [0, 1.12, -1.0], [-0.25, 0, 0]);
      k.ell('#6b4a2b', [0, 0.85, -1.07], [0.05, 0.09, 0.05]);
      return k.build();
    },
    oryx() {
      const k = new Kit(), white = '#f4f0e6', dark = '#3a2c24', tan = '#cdbba0';
      k.ell(white, [0, 1.05, 0], [0.32, 0.36, 0.72]);
      k.ell('#6b5444', [0, 0.86, 0], [0.325, 0.07, 0.6]);
      for (const x of [-0.18, 0.18]) for (const z of [-0.48, 0.48]) {
        k.add(GEO.cyl(0.08, 0.06, 0.42, 12), white, [x, 0.8, z]);
        k.add(GEO.cyl(0.045, 0.04, 0.6, 10), dark, [x, 0.32, z]);
        k.ell(dark, [x, 0.03, z + 0.02], [0.05, 0.035, 0.07]);
      }
      k.add(GEO.cyl(0.1, 0.14, 0.58, 12), white, [0, 1.43, 0.62], [0.45, 0, 0]);
      k.ell(white, [0, 1.72, 0.84], [0.12, 0.13, 0.25]);
      k.ell(dark, [0, 1.73, 0.97], [0.05, 0.1, 0.12]);
      k.ell(dark, [0, 1.6, 1.04], [0.07, 0.06, 0.06]);
      for (const s of [-1, 1]) {
        k.ell(dark, [s * 0.1, 1.74, 0.88], [0.04, 0.07, 0.07]);
        k.add(GEO.cone(0.028, 0.9, 10), dark, [s * 0.06, 2.18, 0.64], [-0.45, 0, 0]);
        k.ell(white, [s * 0.13, 1.86, 0.74], [0.03, 0.08, 0.03], [0, 0, s * -0.7]);
      }
      eyes(k, 0.11, 1.78, 0.9, 0.035);
      k.add(GEO.cyl(0.025, 0.03, 0.4, 8), dark, [0, 0.92, -0.74], [-0.3, 0, 0]);
      k.ell(tan, [0, 1.2, 0.2], [0.26, 0.16, 0.4]);
      return k.build();
    },
    lizard() {
      const k = new Kit(), c = '#b8975f', spot = '#8a6a3f', belly = '#dcc79c';
      k.ell(c, [0, 0.14, 0], [0.2, 0.11, 0.42]);
      k.ell(belly, [0, 0.09, 0.02], [0.17, 0.06, 0.36]);
      for (const [x, z] of [[0.08, 0.15], [-0.07, -0.05], [0.05, -0.22], [-0.1, 0.25], [0.11, -0.1]]) k.ell(spot, [x, 0.24, z], [0.04, 0.015, 0.05]);
      k.ell(c, [0, 0.17, 0.5], [0.13, 0.09, 0.17]);
      eyes(k, 0.08, 0.23, 0.56, 0.03);
      k.add(GEO.cone(0.13, 0.95, 12), c, [0, 0.12, -0.85], [-Math.PI / 2, 0, 0]);
      for (const s of [-1, 1]) for (const z of [0.25, -0.2]) k.ell(c, [s * 0.23, 0.07, z], [0.13, 0.04, 0.05], [0, s * 0.5, 0]);
      return k.build();
    },
    palm(h = 4) {
      const k = new Kit();
      const segs = Math.round(h / 0.4);
      let top = 0;
      for (let i = 0; i < segs; i++) {
        const r = 0.2 - i * 0.006, x = 0.012 * i * i * 0.1;
        k.add(GEO.cyl(r - 0.02, r, 0.42, 10), i % 2 ? '#8b6a45' : '#76593a', [x, 0.2 + i * 0.4, 0], [0, 0, -0.01 * i], [1, 1, 1], true);
        top = 0.2 + i * 0.4 + 0.2;
      }
      const tx = 0.012 * segs * segs * 0.1;
      k.ell('#6f8f3a', [tx, top, 0], [0.22, 0.18, 0.22]);
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI * 2 / 12, droop = i % 2 ? 0.55 : 0.3, len = i % 2 ? 1.05 : 1.2;
        k.ell(i % 3 ? '#3f8f3f' : '#4fa24b', [tx + Math.sin(a) * len * 0.85, top - 0.1 - droop * 0.5, Math.cos(a) * len * 0.85], [0.2, 0.025, len], [droop, a, 0, 'YXZ'], true);
      }
      for (let i = 0; i < 3; i++) {
        const a = i * 2.1 + 0.4;
        for (let j = 0; j < 7; j++) k.ell(j % 2 ? '#d9822b' : '#c56a1f', [tx + Math.sin(a) * 0.28 + (rnd() - 0.5) * 0.12, top - 0.35 - rnd() * 0.25, Math.cos(a) * 0.28 + (rnd() - 0.5) * 0.12], [0.055, 0.07, 0.055]);
      }
      return k.build();
    },
    cow() {
      const k = new Kit(), w = '#f6f3ec', b = '#2b2b2b', pink = '#f1aaa2';
      k.ell(w, [0, 1.0, 0], [0.45, 0.42, 0.8]);
      k.ell(b, [0.3, 1.1, 0.2], [0.18, 0.22, 0.3]);
      k.ell(b, [-0.3, 0.95, -0.3], [0.17, 0.2, 0.26]);
      k.ell(b, [0.05, 1.33, -0.35], [0.26, 0.11, 0.26]);
      legs4(k, w, [-0.25, 0.25], [-0.5, 0.5], 0.66, 0.085, 0.02, b);
      k.ell(w, [0, 1.32, 0.95], [0.22, 0.24, 0.28]);
      k.ell(b, [0.12, 1.4, 1.02], [0.1, 0.12, 0.1]);
      k.ell(pink, [0, 1.18, 1.18], [0.19, 0.13, 0.12]);
      for (const s of [-1, 1]) {
        k.ell('#6b3b36', [s * 0.07, 1.19, 1.29], [0.03, 0.025, 0.01]);
        k.add(GEO.cone(0.04, 0.2, 10), '#e8dcc0', [s * 0.15, 1.57, 0.9], [0, 0, -s * 0.6]);
        k.ell(w, [s * 0.28, 1.4, 0.88], [0.12, 0.05, 0.07], [0, 0, s * 0.3]);
      }
      eyes(k, 0.13, 1.42, 1.12, 0.045);
      k.ell(pink, [0, 0.62, -0.2], [0.14, 0.1, 0.14]);
      k.add(GEO.cyl(0.02, 0.02, 0.62, 6), w, [0, 0.8, -0.8]);
      k.ell(b, [0, 0.48, -0.8], [0.05, 0.09, 0.05]);
      return k.build();
    },
    sheep() {
      const k = new Kit(), wool = '#f5f2ea', face = '#3b302a';
      k.ell(wool, [0, 0.78, 0], [0.36, 0.33, 0.5]);
      for (const [x, y, z, r] of [[0.24, 0.9, 0.24, 0.2], [-0.24, 0.9, 0.24, 0.2], [0.24, 0.9, -0.24, 0.2], [-0.24, 0.9, -0.24, 0.2],
        [0, 1.04, 0.05, 0.22], [0, 1.0, -0.3, 0.2], [0.3, 0.72, 0, 0.19], [-0.3, 0.72, 0, 0.19], [0, 0.75, 0.42, 0.2], [0, 0.78, -0.46, 0.19], [0.14, 1.02, 0.3, 0.16], [-0.14, 1.02, 0.3, 0.16]])
        k.ell(wool, [x, y, z], [r, r, r]);
      legs4(k, face, [-0.18, 0.18], [-0.28, 0.28], 0.48, 0.05, 0);
      k.ell(face, [0, 0.95, 0.58], [0.15, 0.17, 0.2]);
      k.ell(wool, [0, 1.11, 0.52], [0.14, 0.1, 0.13]);
      for (const s of [-1, 1]) k.ell(face, [s * 0.18, 0.99, 0.52], [0.11, 0.04, 0.05], [0, 0, s * 0.35]);
      eyes(k, 0.08, 1.0, 0.72, 0.035);
      k.ell(wool, [0, 0.8, -0.52], [0.1, 0.1, 0.1]);
      return k.build();
    },
    goat() {
      const k = new Kit(), br = '#6e4a32', w = '#efe6d8', d = '#2e2320';

  // Lesson 2 models: parents, their young, people and nest items. Face +Z, stand on y = 0.

  const _up = new T.Vector3(0, 1, 0);
  // cylinder from point a to point b (radius r1 at a, r2 at b)
  function seg(k, color, a, b, r1, r2, flat = false) {
    const A = new T.Vector3(...a), B = new T.Vector3(...b), d = B.clone().sub(A);
    const q = new T.Quaternion().setFromUnitVectors(_up, d.clone().normalize());
    const e = new T.Euler().setFromQuaternion(q);
    const mid = A.clone().add(B).multiplyScalar(0.5);
    k.add(GEO.cyl(r2, r1, d.length(), 12), color, mid.toArray(), [e.x, e.y, e.z], [1, 1, 1], flat);
  }

  // =====================================================================
  // Salem — the Omani guide character (dishdasha with tassel, embroidered kumma)
  // =====================================================================
  function kummaTexture() {
    const c = document.createElement('canvas'); c.width = 512; c.height = 128;
    const x = c.getContext('2d');
    x.fillStyle = '#fbfaf4'; x.fillRect(0, 0, 512, 128);
    const cols = ['#1b8a8a', '#8c1c3a', '#d9a31f', '#24407a'];
    for (let row = 0; row < 3; row++) for (let i = 0; i < 32; i++) {
      x.fillStyle = cols[(i + row) % 4];
      const cx = i * 16 + 8 + (row % 2) * 8, cy = 24 + row * 34;
      x.beginPath(); x.moveTo(cx, cy - 7); x.lineTo(cx + 6, cy); x.lineTo(cx, cy + 7); x.lineTo(cx - 6, cy); x.closePath(); x.fill();
    }
    x.fillStyle = '#1b8a8a'; x.fillRect(0, 118, 512, 6);
    const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.wrapS = T.RepeatWrapping; t.repeat.set(2, 1);
    return t;
  }

  function buildSalem() {
    const root = new T.Group();
    const skin = '#b97a55', white = '#f7f6f1', shade = '#e4e0d4';
    const k = new Kit();
    k.add(GEO.cyl(0.15, 0.25, 0.8, 24), white, [0, 0.46, 0]);
    k.add(GEO.cyl(0.252, 0.252, 0.03, 24), shade, [0, 0.075, 0]);
    k.ell(white, [0, 0.86, 0], [0.2, 0.08, 0.13]);
    k.add(GEO.tor(0.075, 0.012), shade, [0, 0.9, 0.01], [Math.PI / 2, 0, 0]);
    // the dishdasha tassel (فراخة)
    k.add(GEO.cyl(0.01, 0.01, 0.17, 6), '#cdb88d', [0.03, 0.78, 0.132]);
    k.add(GEO.cone(0.028, 0.07, 10), '#c2a877', [0.03, 0.67, 0.135], [Math.PI, 0, 0]);
    for (const s of [-1, 1]) {
      k.ell('#6b4a2e', [s * 0.08, 0.025, 0.08], [0.065, 0.025, 0.11]);
      k.ell(skin, [s * 0.08, 0.05, 0.12], [0.05, 0.022, 0.055]);
    }
    k.add(GEO.cyl(0.06, 0.065, 0.1, 12), skin, [0, 0.94, 0]);
    root.add(k.build());

    const arms = {};
    for (const s of [-1, 1]) {
      const g = new T.Group(); g.position.set(s * 0.2, 0.87, 0);
      const ka = new Kit();
      ka.add(GEO.cyl(0.055, 0.075, 0.38, 12), white, [0, -0.19, 0]);
      ka.ell(skin, [0, -0.41, 0.01], [0.05, 0.055, 0.05]);
      g.add(ka.build()); g.rotation.z = s * 0.12; root.add(g); arms[s] = g;
    }

    const head = new T.Group(); head.position.set(0, 0.97, 0); root.add(head);
    const kh = new Kit();
    kh.ell(skin, [0, 0.19, 0], [0.19, 0.185, 0.18]);
    for (const s of [-1, 1]) {
      kh.ell(skin, [s * 0.185, 0.18, 0], [0.035, 0.055, 0.03]);
      kh.ell('#2a1d17', [s * 0.075, 0.285, 0.155], [0.045, 0.012, 0.014], [0, 0, s * -0.1]);
      kh.ell('#e39a8a', [s * 0.11, 0.13, 0.14], [0.035, 0.02, 0.012]);
    }
    kh.ell('#a86b48', [0, 0.165, 0.18], [0.03, 0.026, 0.026]);
    kh.ell('#2a1d17', [0, 0.28, -0.03], [0.188, 0.07, 0.17]);
    head.add(kh.build());
    const eyeG = new T.Group(); eyeG.position.set(0, 0.215, 0.155); head.add(eyeG);
    const ke = new Kit();
    for (const s of [-1, 1]) {
      ke.ell('#ffffff', [s * 0.07, 0, 0], [0.045, 0.055, 0.025]);
      ke.ell('#3b2416', [s * 0.07, -0.004, 0.02], [0.029, 0.035, 0.012]);
      ke.ell('#ffffff', [s * 0.07 + 0.012, 0.012, 0.03], [0.009, 0.009, 0.004]);
    }
    eyeG.add(ke.build());
    const km = new Kit(); km.add(GEO.tor(0.05, 0.009, Math.PI), '#7a2e2e', [0, 0.105, 0.172], [0, 0, Math.PI]);
    const mouthClosed = km.build(); head.add(mouthClosed);
    const ko = new Kit(); ko.ell('#6b1f1f', [0, 0.095, 0.172], [0.045, 0.032, 0.014]);
    const mouthOpen = ko.build(); mouthOpen.visible = false; head.add(mouthOpen);
    const kummaMat = new T.MeshStandardMaterial({ map: kummaTexture(), roughness: 0.9 });
    const kumma = new T.Mesh(new T.CylinderGeometry(0.183, 0.19, 0.13, 32, 1, true), kummaMat);
    kumma.position.set(0, 0.325, -0.01); head.add(kumma);
    const top = new T.Mesh(new T.CircleGeometry(0.183, 32), kummaMat);
    top.rotation.x = -Math.PI / 2; top.position.set(0, 0.39, -0.01); head.add(top);

    return { root, head, eyes: eyeG, mouthOpen, mouthClosed, arms, speaking: false, mood: 'idle', moodT: 0, blinkAt: 2 };
  }

  // =====================================================================
  // Canvas helpers: textures, Omani flag, cards, buttons, signs
  // =====================================================================
  const FONT = '"Baloo Bhaijaan 2","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif';
  const EMOJI = '"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
  const C = { ink: '#1f3a4d', soft: '#5d7486', paper: '#fffdf7', line: '#eadfc8', sun: '#f4b942', teal: '#2a9d8f', coral: '#e76f51',
    leaf: '#4f9d5d', sky: '#2f8fc4', red: '#d6172b', green: '#00843d', gold: '#e9a820' };
  let maxAniso = 4;

  function texFrom(canvas) {
    const t = new T.CanvasTexture(canvas);
    t.colorSpace = T.SRGBColorSpace; t.anisotropy = maxAniso;
    t.minFilter = T.LinearMipmapLinearFilter; t.generateMipmaps = true;
    return t;
  }
  function wrap(ctx, text, maxW) {
    const out = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const w of para.split(' ')) {
        const t = line ? line + ' ' + w : w;

    tween(0.5, k => { el.object3D.rotation.z = r0 + Math.sin(k * Math.PI * 6) * 0.06 * (1 - k); }, () => { el.object3D.rotation.z = r0; });

  // =====================================================================

  const polar = (deg, r) => [r * Math.sin(rad(deg)), -r * Math.cos(rad(deg))];

  function noiseTexture(base, dots, { size = 256, n = 1400, rep = 1, soft = false } = {}) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    if (soft) {
      const g = x.createRadialGradient(size / 2, size / 2, size * 0.36, size / 2, size / 2, size / 2);
      g.addColorStop(0, base); g.addColorStop(1, base + '00');
      x.fillStyle = g;
    } else x.fillStyle = base;
    x.fillRect(0, 0, size, size);
    for (let i = 0; i < n; i++) {
      const px = rnd() * size, py = rnd() * size;
      if (soft && Math.hypot(px - size / 2, py - size / 2) > size * 0.44) continue;
      x.fillStyle = dots[i % dots.length]; x.globalAlpha = 0.35 + rnd() * 0.4;
      x.beginPath(); x.ellipse(px, py, 1 + rnd() * 3, 1 + rnd() * 2, rnd() * 3, 0, Math.PI * 2); x.fill();
    }
    x.globalAlpha = 1;
    const t = texFrom(c);
    if (rep > 1) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rep, rep); }
    return t;
  }
  function blobShadow(parent, r, x = 0, z = 0) {

      const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 4, 32, 32, 32);
      gr.addColorStop(0, 'rgba(40,30,20,0.38)'); gr.addColorStop(1, 'rgba(40,30,20,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      blobShadow.mat = new T.MeshBasicMaterial({ map: texFrom(c), transparent: true, depthWrite: false });
    }
    const m = new T.Mesh(new T.PlaneGeometry(1, 1), blobShadow.mat);
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.02, z); m.scale.set(r * 2, r * 2, 1); m.renderOrder = 1;
    parent.add(m); return m;
  }

  }

    scene.object3D.add(sky);
    const sun = new T.Mesh(new T.SphereGeometry(6, 16, 12), new T.MeshBasicMaterial({ color: '#fff3b0' }));
    sun.position.set(-70, 95, 120); scene.object3D.add(sun);

    for (const [cx, cy, cz, s] of [[-30, 26, -60, 3], [40, 30, -50, 2.6], [60, 24, 20, 3.2], [-55, 28, 30, 2.8], [10, 32, 70, 3], [-20, 34, -90, 3.5]])

        k.add(GEO.ico(1, 1), '#ffffff', [cx + a * s, cy + b * s, cz + c2 * s], [0, 0, 0], [r * s, r * s * 0.7, r * s], true);

  function buildLandscape() {
    const w = worldEl.object3D;
    // Ground: finely tessellated near the child, a coarse ring further out. Large triangles that pass
    // under the camera cause depth artefacts on some GPUs.
    const groundMat = new T.MeshStandardMaterial({ map: noiseTexture('#a8cf6f', ['#8fbd5a', '#bcdc85', '#7fae4d', '#c9d98f'], { n: 2600, rep: 12 }), roughness: 1 });
    const near = new T.Mesh(new T.CircleGeometry(30, 96, 0, Math.PI * 2), groundMat);
    const nearGeo = new T.PlaneGeometry(60, 60, 60, 60); near.geometry.dispose(); near.geometry = nearGeo;
    near.rotation.x = -Math.PI / 2; w.add(near);
    const farTex = groundMat.map.clone(); farTex.repeat.set(60, 60); farTex.needsUpdate = true;
    const far = new T.Mesh(new T.RingGeometry(29.9, 200, 64, 6), new T.MeshStandardMaterial({ map: farTex, roughness: 1 }));
    far.rotation.x = -Math.PI / 2; far.position.y = -0.01; w.add(far);
    // Hajar mountains around the horizon
    const k = new Kit();
    for (let i = 0; i < 22; i++) {
      const a = i * (360 / 22) + rnd() * 8, r = 95 + rnd() * 20, h = 12 + rnd() * 12, br = 16 + rnd() * 8;
      const [x, z] = polar(a, r);
      k.add(jitter(new T.ConeGeometry(br, h, 7, 3), 3), ['#a4775a', '#98694d', '#b28666', '#8d6048'][i % 4], [x, h / 2 - 1, z], [0, rnd() * 3, 0], [1, 1, 1], true);
    }
    for (let i = 0; i < 14; i++) {
      const a = i * (360 / 14) + 12, [x, z] = polar(a, 36 + rnd() * 6);
      k.add(GEO.sph, i % 2 ? '#c9b27c' : '#b9a06a', [x, -3, z], [0, 0, 0], [9, 5, 7], true);
    }
    w.add(k.build());
    buildFort(w);
    buildCenter(w);
    // palms between habitats
    for (const a of [36, 108, 180, 252, 324]) for (const off of [-4, 4]) {
      const [x, z] = polar(a + off, 15 + rnd() * 3);
      const p = MODELS.palm(3.4 + rnd() * 1.4); p.position.set(x, 0, z); p.rotation.y = rnd() * 6; w.add(p);
    }
  }

  function buildFort(w) {

    const g = new T.Group(); const [x, z] = polar(180, 30); g.position.set(x, 0, z); g.rotation.y = rad(-180);
    const merlons = (cx, cz, r, y, n) => { for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; k.add(GEO.box(0.7, 0.8, 0.5), wall, [cx + Math.sin(a) * r, y, cz + Math.cos(a) * r], [0, a, 0], [1, 1, 1], true); } };
    // Nizwa-style round tower
    k.add(GEO.cyl(4.4, 5.2, 9, 28), wall, [0, 4.5, 0], [0, 0, 0], [1, 1, 1], true);
    k.add(GEO.cyl(4.6, 4.6, 0.4, 28), dark, [0, 9.1, 0], [0, 0, 0], [1, 1, 1], true);
    merlons(0, 0, 4.4, 9.6, 26);
    for (const s of [-1, 1]) {
      k.add(GEO.box(9, 5.5, 1.4), wall, [s * 8, 2.75, 1.2], [0, 0, 0], [1, 1, 1], true);
      for (let i = 0; i < 8; i++) k.add(GEO.box(0.7, 0.7, 1.4), wall, [s * (4.4 + i * 1.15), 5.85, 1.2], [0, 0, 0], [1, 1, 1], true);
      k.add(GEO.box(3.4, 7.5, 3.4), wall, [s * 13.5, 3.75, 1.2], [0, 0, 0], [1, 1, 1], true);
      for (let i = 0; i < 4; i++) for (const zz of [-1.4, 1.4]) k.add(GEO.box(0.6, 0.7, 0.6), wall, [s * 13.5 - 1.4 + i * 0.93, 7.85, 1.2 + zz], [0, 0, 0], [1, 1, 1], true);
      for (let i = 0; i < 3; i++) k.add(GEO.box(0.35, 0.9, 0.2), door, [s * (6 + i * 2.2), 3.4, 1.95], [0, 0, 0], [1, 1, 1], true);
    }
    k.add(GEO.box(2.2, 3.2, 0.3), door, [0, 1.6, 4.9], [0, 0, 0], [1, 1, 1], true);
    k.add(GEO.cyl(1.1, 1.1, 0.3, 16, 1, false), door, [0, 3.2, 4.9], [Math.PI / 2, 0, 0], [1, 1, 1], true);
    for (const yy of [5, 7]) for (let i = 0; i < 5; i++) {
      const a = (i - 2) * 0.35;
      k.add(GEO.box(0.3, 0.8, 0.2), door, [Math.sin(a) * 4.85, yy, Math.cos(a) * 4.85], [0, a, 0], [1, 1, 1], true);
    }
    g.add(k.build());
    const pole = new T.Mesh(new T.CylinderGeometry(0.08, 0.08, 5, 8), new T.MeshStandardMaterial({ color: '#dddddd' }));
    pole.position.set(0, 12.5, 0); g.add(pole);
    const fc = document.createElement('canvas'); fc.width = 280; fc.height = 160; drawOmanFlag(fc.getContext('2d'), 0, 0, 280, 160);
    const f = new T.Mesh(new T.PlaneGeometry(2.8, 1.6), new T.MeshStandardMaterial({ map: texFrom(fc), side: T.DoubleSide }));
    f.position.set(1.45, 14.1, 0); g.add(f);
    w.add(g);
  }

  function buildCenter(w) {
    // platform with an eight-pointed star mosaic
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d');
    x.fillStyle = '#efe0c0'; x.beginPath(); x.arc(256, 256, 256, 0, Math.PI * 2); x.fill();
    x.strokeStyle = '#1b8a8a'; x.lineWidth = 14; x.beginPath(); x.arc(256, 256, 240, 0, Math.PI * 2); x.stroke();
    const star = (r, col) => {
      x.fillStyle = col; x.beginPath();
      for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = i % 2 ? r * 0.72 : r; x.lineTo(256 + Math.cos(a) * rr, 256 + Math.sin(a) * rr); }
      x.closePath(); x.fill();
    };
    star(200, '#1b8a8a'); star(160, '#f6ead0'); star(110, '#c8553d'); star(70, '#f4b942');
    for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8; x.fillStyle = i % 2 ? '#c8553d' : '#1b8a8a'; x.beginPath(); x.arc(256 + Math.cos(a) * 222, 256 + Math.sin(a) * 222, 8, 0, Math.PI * 2); x.fill(); }
    const top = new T.Mesh(new T.CircleGeometry(1.5, 48), new T.MeshStandardMaterial({ map: texFrom(c), roughness: 0.7 }));
    top.rotation.x = -Math.PI / 2; top.position.y = 0.121; w.add(top);
    const base = new T.Mesh(new T.CylinderGeometry(1.52, 1.62, 0.12, 48), new T.MeshStandardMaterial({ color: '#d9c29a', roughness: 0.9 }));
    base.position.y = 0.06; w.add(base);
    // flag pole with a waving Omani flag
    const [px, pz] = polar(36, 4.2);
    const pole = new T.Mesh(new T.CylinderGeometry(0.05, 0.06, 5.2, 10), new T.MeshStandardMaterial({ color: '#e8e8e8', metalness: 0.4, roughness: 0.4 }));
    pole.position.set(px, 2.6, pz); w.add(pole);
    const knob = new T.Mesh(new T.SphereGeometry(0.1, 12, 8), new T.MeshStandardMaterial({ color: '#e9a820', metalness: 0.5, roughness: 0.3 }));
    knob.position.set(px, 5.25, pz); w.add(knob);
    const fc = document.createElement('canvas'); fc.width = 700; fc.height = 400; drawOmanFlag(fc.getContext('2d'), 0, 0, 700, 400);
    const geo = new T.PlaneGeometry(1.75, 1.0, 24, 8); geo.translate(0.875, 0, 0);
    flagMesh = new T.Mesh(geo, new T.MeshStandardMaterial({ map: texFrom(fc), side: T.DoubleSide, roughness: 0.8 }));
    flagMesh.position.set(px + 0.05, 4.6, pz); flagMesh.rotation.y = rad(-36) + Math.PI / 2;
    flagMesh.userData.base = geo.attributes.position.array.slice();
    w.add(flagMesh);
  }
  function waveFlag(t) {
    const p = flagMesh.geometry.attributes.position, b = flagMesh.userData.base;
    for (let i = 0; i < p.count; i++) {
      const x = b[i * 3];
      p.setZ(i, Math.sin(x * 4 - t * 4) * 0.1 * x);
      p.setY(i, b[i * 3 + 1] + Math.sin(x * 3 - t * 3) * 0.03 * x);
    }
    p.needsUpdate = true; flagMesh.geometry.computeVertexNormals();
  }

  const DECOR = {

      for (let i = 0; i < 6; i++) { const x = -3 + i * 0.35, z = 1.8; k.add(GEO.cone(0.05, 0.25, 8), '#f07f24', [x, 0.08, z], [Math.PI, 0, 0]); k.add(GEO.cone(0.05, 0.14, 5), '#4c9a45', [x, 0.25, z]); }

  const PARENT = { lion: 'lion', elephant: 'elephant', camel: 'camel', goat: 'goat', duck: 'duck', rabbit: 'rabbit', human: 'mother' };

  const creatureEls = new Map(), parentEls = new Map(), signEls = new Map(), zoneGroups = new Map(), discovered = new Set();

  // the young of a family, as shown in its enclosure (several for ducks and rabbits)
  function youngGroup(f) {
    const g = new T.Group();
    if (f.id === 'duck') {
      for (let i = 0; i < 8; i++) { const d = MODELS.duckling(i); d.scale.setScalar(YSIZE.duckling); d.position.set((i % 4 - 1.5) * 0.42, 0, Math.floor(i / 4) * 0.45 - 0.2); d.rotation.y = (rnd() - 0.5) * 0.8; g.add(d); }
    } else if (f.id === 'rabbit') {
      for (let i = 0; i < 9; i++) { const b = MODELS.bunny(i); b.scale.setScalar(YSIZE.bunny); b.position.set((i % 3 - 1) * 0.45 + (rnd() - 0.5) * 0.1, 0, Math.floor(i / 3) * 0.42 - 0.4); b.rotation.y = (rnd() - 0.5) * 1.2; g.add(b); }
    } else if (f.id === 'human') {
      const c = MODELS.cradle(); c.scale.setScalar(1.3); g.add(c);
      const b = MODELS.baby(); b.scale.setScalar(1.3); b.position.y = 0.2; g.add(b);
    } else {
      const m = MODELS[YOUNG[f.id]](); m.scale.setScalar(YSIZE[YOUNG[f.id]]); g.add(m);
    }
    return g;
  }
  function withHit(model, minR = 0.45) {
    const holder = new T.Group(); holder.add(model);
    const b = new T.Box3().setFromObject(model), s = b.getSize(new T.Vector3()), c = b.getCenter(new T.Vector3());
    const r = Math.max(minR, Math.max(s.x, s.z) * 0.55);
    const hit = new T.Mesh(new T.CylinderGeometry(r, r, s.y + 0.3, 12), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    hit.position.set(c.x, s.y / 2, c.z); holder.add(hit);
    return { holder, h: s.y };
  }

  const YPOS = { lion: [1.0, 0, 0.8], elephant: [1.3, 0, 1.2], camel: [1.2, 0, 0.9], goat: [1.0, 0, 0.9], duck: [0.7, 0.04, 0.7], rabbit: [0.8, 0, 0.6], human: [0.9, 0, 0.8] };
  const PPOS = { lion: [-1.0, 0, -0.6], elephant: [-1.2, 0, -1.0], camel: [-1.0, 0, -0.9], goat: [-0.9, 0, -0.6], duck: [-0.8, 0.04, -0.6], rabbit: [-0.9, 0, -0.5], human: [-0.9, 0, -0.5] };

  function buildZones() {
    for (const f of FAMILIES) {
      ZY = 0.004 + FAMILIES.indexOf(f) * 0.0015;
      const [x, zz] = polar(f.angle, ZONE_R);
      const zoneEl = document.createElement('a-entity'); worldEl.appendChild(zoneEl);
      zoneEl.object3D.position.set(x, 0, zz); zoneEl.object3D.rotation.y = rad(-f.angle);
      const g = zoneEl.object3D, k = new Kit();
      DECOR[f.id](g, k);
      g.add(k.build());
      zoneGroups.set(f.id, zoneEl);

      // parent
      const pm = MODELS[PARENT[f.id]](); pm.scale.setScalar(PSIZE[f.id] || 1);
      const P = withHit(pm, 0.6);
      const pel = entityWith(P.holder, zoneEl);
      pel.object3D.position.set(...PPOS[f.id]); pel.object3D.rotation.y = 0.35;
      pel._fam = f; pel._role = 'parent';
      clickable(pel, () => onFamily(f, 'parent'), { hover: 1.04 });
      if (f.id !== 'duck') blobShadow(g, Math.max(0.5, P.h * 0.35), PPOS[f.id][0], PPOS[f.id][2]);
      parentEls.set(f.id, pel);
      idlers.push({ ph: rnd() * 6, step(t) { pm.rotation.y = Math.sin(t * 0.35 + this.ph) * 0.2; if (f.id === 'duck') pm.position.y = Math.sin(t * 1.6 + this.ph) * 0.03; else pm.scale.y = (PSIZE[f.id] || 1) * (1 + Math.sin(t * 2 + this.ph) * 0.012); } });

      // young
      const yg = youngGroup(f);
      const Y = withHit(yg, 0.5);
      const yel = entityWith(Y.holder, zoneEl);
      yel.object3D.position.set(...YPOS[f.id]); yel.object3D.rotation.y = -0.25;
      yel._fam = f; yel._role = 'young'; yel._h = Y.h; yel._model = yg;
      clickable(yel, () => onFamily(f, 'young'), { hover: 1.06 });
      if (f.id !== 'duck') blobShadow(g, 0.6, YPOS[f.id][0], YPOS[f.id][2]);
      creatureEls.set(f.id, yel);
      yg.children.forEach((c, i) => {
        if (f.id === 'human' && i === 0) return;
        const base = c.position.y, ph = rnd() * 6, hop = f.id === 'rabbit' || f.id === 'goat' || f.id === 'lion';
        idlers.push({ step(t) {
          const cyc = (t * 0.7 + ph) % 3;
          c.position.y = base + (hop && cyc < 0.4 ? Math.sin(cyc / 0.4 * Math.PI) * 0.12 : Math.sin(t * 2.2 + ph) * 0.015);
          c.rotation.z = f.id === 'human' ? Math.sin(t * 1.2) * 0.03 : 0;
        } });
      });
      buildSign(f, zoneEl);
    }
  }

  // Habitat sign: large board at the BACK of each habitat, above the animals.
  function signCanvas(z, rim) {
    const c = document.createElement('canvas'); c.width = 1100; c.height = 440;
    const x = c.getContext('2d'), W = c.width, H = c.height, top = 70;
    x.fillStyle = '#9a6a3c';
    // crenellated top, like an Omani fort parapet
    for (let i = 0; i < 11; i++) { const cx = 50 + i * 100; x.beginPath(); x.moveTo(cx - 34, top + 4); x.lineTo(cx, 8); x.lineTo(cx + 34, top + 4); x.closePath(); x.fill(); }
    x.beginPath(); x.roundRect(10, top, W - 20, H - top - 10, 34); x.fill();
    x.lineWidth = 16; x.strokeStyle = rim; x.stroke();
    x.fillStyle = '#fdf4e0'; x.beginPath(); x.roundRect(40, top + 30, W - 80, H - top - 70, 24); x.fill();
    x.fillStyle = z.accent + '2a'; x.beginPath(); x.arc(W - 200, (top + H) / 2 - 5, 120, 0, Math.PI * 2); x.fill();
    drawEmoji(x, z.icon, W - 200, (top + H) / 2 - 5, 150);
    x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = C.ink;
    let fs = 150; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(z.name).width > W - 460 && fs > 40) { fs -= 6; x.font = `800 ${fs}px ${FONT}`; }
    x.fillText(z.name, (80 + W - 330) / 2, (top + H) / 2);
    return c;
  }
  function buildSign(z, zoneEl) {
    const g = new T.Group();
    const k = new Kit();
    for (const s of [-1, 1]) k.add(GEO.cyl(0.09, 0.11, 4.2, 8), '#7a5234', [s * 1.7, 2.1, -0.06], [0, 0, 0], [1, 1, 1], true);
    g.add(k.build());
    const board = planeMesh(signCanvas(z, z.accent), 4.0);
    board.position.y = 3.9; g.add(board);
    const el = entityWith(g, zoneEl);
    el.object3D.position.set(0, 0, SIGN_Z);
    el._board = board; el._zone = z;
    clickable(el, () => onSign(z), { hover: 1.04 });
    signEls.set(z.id, el);
  }
  function tintSign(z, rim) {
    const el = signEls.get(z.id); const old = el._board.material.map;
    el._board.material.map = texFrom(signCanvas(z, rim)); el._board.material.needsUpdate = true; old.dispose();
  }

  function nameTag(c) {
    const el = creatureEls.get(c.id);
    if (el._tag) return;
    const cv = document.createElement('canvas'); cv.width = 640; cv.height = 150;
    const x = cv.getContext('2d');
    x.fillStyle = 'rgba(31,58,77,.25)'; x.beginPath(); x.roundRect(6, 14, 628, 128, 64); x.fill();
    x.fillStyle = '#fffdf7'; x.beginPath(); x.roundRect(6, 6, 628, 128, 64); x.fill();
    x.lineWidth = 6; x.strokeStyle = C.leaf; x.stroke();
    x.fillStyle = C.leaf; x.beginPath(); x.arc(560, 70, 42, 0, Math.PI * 2); x.fill();
    x.strokeStyle = '#fff'; x.lineWidth = 10; x.lineCap = 'round'; x.beginPath(); x.moveTo(540, 70); x.lineTo(555, 86); x.lineTo(582, 54); x.stroke();
    x.direction = 'rtl'; x.fillStyle = C.ink; x.textAlign = 'center'; x.textBaseline = 'middle';
    let fs = 64; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(c.name).width > 440 && fs > 24) { fs -= 4; x.font = `800 ${fs}px ${FONT}`; }
    x.fillText(c.name, 270, 74);
    const m = planeMesh(cv, 0.95);
    const s = el._model.scale.x;
    m.position.y = el._h + 0.3; m.scale.setScalar(1 / (el.object3D.scale.x || 1));
    el.object3D.add(m); billboards.push(m); el._tag = m;
    void s;
  }

  // =====================================================================
  // Panels near the child
  // =====================================================================
  let panel = null, infoCard = null, hudMesh = null;
  const inXR = () => scene.is('vr-mode') || scene.is('ar-mode');
  function eyeY() { return Math.min(1.75, Math.max(1.0, camPos.y - 0.08)); }
  function frontOf(dist, dirOverride) {
    const dir = dirOverride ? dirOverride.clone() : new T.Vector3();
    if (!dirOverride) scene.camera.getWorldDirection(dir);
    dir.y = 0; if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1); dir.normalize();
    const d = dist * (!inXR() && innerWidth < innerHeight ? 1.7 : 1);
    return { pos: new T.Vector3(camPos.x + dir.x * d, 0, camPos.z + dir.z * d), rotY: Math.atan2(-dir.x, -dir.z) };
  }
  function place(el, dist, dir, halfW) {
    const { pos, rotY } = frontOf(dist, dir);
    pos.y = eyeY();
    el.object3D.position.copy(pos); el.object3D.rotation.set(0, rotY, 0);
    el.object3D.scale.setScalar(0.6);
    tween(0.25, k => el.object3D.scale.setScalar(0.6 + 0.4 * (1 - Math.pow(1 - k, 3))));
    salemBeside(pos, rotY, halfW);
  }
  function closePanel() { if (panel) { panel.remove(); panel = null; } }
  function closeInfo() { if (infoCard) { infoCard.remove(); infoCard = null; } }

  function showPanel(spec, buttons = [], dist = 2.2) {
    closePanel(); closeInfo();
    const el = document.createElement('a-entity'); uiEl.appendChild(el);
    const card = planeMesh(cardCanvas(spec), spec.w);
    el.object3D.add(card);
    const h = card.userData.h;
    const bw = Math.min(0.95, (spec.w - 0.2) / Math.max(1, buttons.length) - 0.08);
    buttons.forEach((b, i) => {
      const btn = button(b.label, el, { w: bw, h: 0.22, color: b.color || C.sun, text: b.text || C.ink }, b.onClick);
      const n = buttons.length, x = (n - 1 - i - (n - 1) / 2) * (bw + 0.1);
      btn.object3D.position.set(x, -h / 2 - 0.09, 0.02);
    });
    // raise the card so its buttons sit near eye level
    card.position.y = buttons.length ? 0.12 : 0;
    el.object3D.children.forEach(o => { if (o !== card) o.position.y += 0.12; });
    panel = el;
    place(el, dist, null, spec.w / 2);
    return el;
  }

  function showInfo(spec, target) {
    closeInfo();
    const el = document.createElement('a-entity'); uiEl.appendChild(el);
    const card = planeMesh(cardCanvas(spec), spec.w);
    el.object3D.add(card);

    x.object3D.position.set(-spec.w / 2 + 0.06, card.userData.h / 2 - 0.06, 0.02);
    infoCard = el;
    const dir = new T.Vector3(); target.getWorldPosition(dir); dir.sub(camPos);
    place(el, 1.9, dir, spec.w / 2);
  }

  function setHud(text, sub) {
    const W = 900, H = 170, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = 'rgba(31,58,77,.88)'; x.beginPath(); x.roundRect(4, 4, W - 8, H - 8, (H - 8) / 2); x.fill();
    x.fillStyle = C.red; x.fillRect(H / 2, 4, 90, 8); x.fillStyle = '#fff'; x.fillRect(H / 2 + 90, 4, 90, 8); x.fillStyle = C.green; x.fillRect(H / 2 + 180, 4, 90, 8);
    x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
    let fs = sub ? 54 : 62; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(text).width > W - 90 && fs > 26) { fs -= 3; x.font = `800 ${fs}px ${FONT}`; }
    x.fillText(text, W / 2, sub ? H * 0.37 : H / 2);
    if (sub) {
      let s2 = 38; x.font = `700 ${s2}px ${FONT}`;
      while (x.measureText(sub).width > W - 90 && s2 > 20) { s2 -= 2; x.font = `700 ${s2}px ${FONT}`; }
      x.fillStyle = '#ffe28a'; x.fillText(sub, W / 2, H * 0.73);
    }
    if (hudMesh) { hudMesh.parent.remove(hudMesh); hudMesh.material.map.dispose(); }
    hudMesh = planeMesh(c, 0.72, { overlay: true });
    hudMesh.position.set(0, -0.5, -1); camEl.object3D.add(hudMesh);
  }
  function hideHud() { if (hudMesh) hudMesh.visible = false; }

  function youngModel(f) {
    if (f.id === 'duck') return MODELS.duckling(0);
    if (f.id === 'rabbit') return MODELS.bunny(0);
    return MODELS[YOUNG[f.id]]();
  }
  function startGame(replay) {
    closePanel(); closeInfo(); clearStage();
    mode = 'game';
    game = { rounds: shuffle(FAMILIES.slice()).slice(0, GAME_ROUNDS), i: 0, stars: 0, misses: 0, lost: null, busy: false, replay };
    nextRound();
  }

  function nextRound() {
    if (game.lost) { game.lost.parent && game.lost.parent.remove(game.lost); game.lost = null; }
    signEls.forEach(b => pulse(b, false));
    if (game.i >= game.rounds.length) return game.replay ? summary() : roundsDone();
    const f = game.rounds[game.i];
    game.misses = 0; game.busy = false;
    const g = new T.Group();
    const k = new Kit();
    k.add(GEO.cyl(0.3, 0.36, 0.7, 24), '#fffdf7', [0, 0.35, 0]);
    k.add(GEO.cyl(0.38, 0.38, 0.06, 24), C.sun, [0, 0.72, 0]);
    k.add(GEO.tor(0.34, 0.02), C.coral, [0, 0.5, 0], [Math.PI / 2, 0, 0]);
    g.add(k.build());
    const model = youngModel(f);
    const size = new T.Box3().setFromObject(model).getSize(new T.Vector3());
    const h = size.y, s = 0.7 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(s); model.position.y = 0.75; g.add(model);

    const qx = qc.getContext('2d'); qx.fillStyle = C.coral; qx.beginPath(); qx.arc(64, 64, 58, 0, Math.PI * 2); qx.fill();
    qx.fillStyle = '#fff'; qx.font = `800 96px ${FONT}`; qx.textAlign = 'center'; qx.textBaseline = 'middle'; qx.fillText('؟', 64, 70);
    const q = planeMesh(qc, 0.28); q.position.set(0.42, 0.75 + h * s + 0.1, 0); g.add(q); billboards.push(q);
    const { pos, rotY } = frontOf(2.4);
    g.position.copy(pos); g.rotation.y = rotY;
    scene.object3D.add(g);
    idlers.push(g.userData.idle = { step(t) { model.rotation.y = Math.sin(t * 1.2) * 0.5; } });
    game.lost = g; game.model = model;
    salemBeside(pos.clone().setY(0), rotY, 0.35);
    setHud(`مَنْ أُمُّ ${inZone(f.young)}؟`, `الْمِسِ الْأُمَّ أَوْ لَوْحَتَهَا • ${toAr(game.i + 1)} / ${toAr(game.rounds.length)}`);
    setMood('think'); say('q_' + f.id);
  }

  function answer(f) {
    if (!game || game.busy || !game.lost) return;
    const c = game.rounds[game.i];
    if (f.id === c.id) {
      game.busy = true;
      if (game.misses === 0) game.stars++;
      sfx.good(); setMood('cheer');
      tintSign(f, C.leaf);
      setHud(`أَحْسَنْتَ! ${L.lines['a_' + c.id]}`, `⭐ ${toAr(game.stars)}`);
      say([pick(['right1', 'right2', 'right3']), 'a_' + c.id]);
      const g = game.lost, from = new T.Vector3(); game.model.getWorldPosition(from);
      const to = new T.Vector3(); creatureEls.get(c.id).object3D.getWorldPosition(to); to.y += 0.6;
      const model = game.model; g.remove(model); scene.object3D.add(model); model.position.copy(from);
      idlers.splice(idlers.indexOf(g.userData.idle), 1);
      g.parent.remove(g); game.lost = null;
      tween(1.3, k => {
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        model.position.lerpVectors(from, to, e); model.position.y += Math.sin(k * Math.PI) * 2.2;
        model.rotation.y += 0.15;
      }, () => {
        burst(to); scene.object3D.remove(model); hop(creatureEls.get(c.id)); hop(parentEls.get(c.id));
        setTimeout(() => { tintSign(f, f.accent); game.i++; nextRound(); }, 2400);
      });
    } else {
      game.misses++;
      sfx.bad(); shake(signEls.get(f.id)); setMood('think');
      tintSign(f, C.red);
      setTimeout(() => tintSign(f, f.accent), 800);
      setHud('حَاوِلْ مَرَّةً أُخْرَى 🙂', game.misses >= 2 ? `تَلْمِيحٌ: ابْحَثْ عَنْ ${c.parent}` : `هَذَا صَغِيرُ ${genOf(f)}؟ لَا!`);
      if (game.misses >= 2) { pulse(signEls.get(c.id), true); say(['wrong2', 'hint']); }
      else say('wrong1');
    }
  }

  function startNest() {

      stage.ui.push(el);
      const ph = rnd() * 6;
      const idle = { step(t) { if (!el._placed) el.object3D.position.y = home.y + Math.sin(t * 1.6 + ph) * 0.04; } };
      idlers.push(idle); holder.userData.idle = idle; stage.items.push(holder);
      clickable(el, () => {
        if (el._placed || mode !== 'nest') return;
        if (!it.need) {
          sfx.bad(); shake(el); setMood('think'); say('notneed');
          setHud('لَا يَحْتَاجُهُ الْجَدْيُ 🙂', 'يَحْتَاجُ: الطَّعَامَ وَالْمَاءَ وَالْمَسْكَنَ');
          return;
        }
        el._placed = true; got.add(it.need);
        sfx.good(); setMood('cheer');
        plate.visible = false;
        const from = el.object3D.position.clone(), to = new T.Vector3(...SPOT[it.need]);
        tween(1.0, kk => { el.object3D.position.lerpVectors(from, to, kk); el.object3D.position.y += Math.sin(kk * Math.PI) * 0.6; }, () => {
          const w = to.clone(); stage.el.object3D.localToWorld(w); w.y += 0.4; burst(w);
        });
        nestCard(got);
        const need = NEEDS.find(n => n.key === it.need);
        setHud(`✅ ${need.t}`, `${toAr(got.size)} / ${toAr(NEEDS.length)}`);
        if (got.size === NEEDS.length) {
          say([it.need, 'nestdone']);
          setTimeout(() => { hopObj(kid); }, 1100);
          setTimeout(summary, 6500);
        } else say(it.need, { bubble: false });
      }, { hover: 1.1 });
    });
    setHud('اخْتَرْ مَا يَحْتَاجُهُ الْجَدْيُ', 'الطَّعَامُ • الْمَاءُ • الْمَسْكَنُ');
  }
  function hopObj(o) {
    const y0 = o.position.y;
    tween(0.5, k => { o.position.y = y0 + Math.sin(k * Math.PI) * 0.3; }, () => { o.position.y = y0; tween(0.5, k => { o.position.y = y0 + Math.sin(k * Math.PI) * 0.3; }, () => { o.position.y = y0; }); });
  }

  // ---------- What did I learn? ----------
  function summary() {
    if (mode === 'summary') return;
    mode = 'summary'; hideHud(); clearStage(); sfx.good();
    const n = game ? game.rounds.length : GAME_ROUNDS, stars = game ? game.stars : 0;
    showPanel({
      w: 2.3, accent: C.sky, icon: '🎓', title: 'مَاذَا تَعَلَّمْتُ؟', subtitle: `نُجُومُكَ: ${toAr(stars)} مِنْ ${toAr(n)}`,
      blocks: [
        { type: 'stars', n: stars, total: n },
        { type: 'bullet', t: 'يُنْجِبُ الْإِنْسَانُ وَالْحَيَوَانُ صِغَارًا.', size: 0.064 },
        { type: 'bullet', t: 'يَكْبَرُ صَغِيرُ الْإِنْسَانِ لِيُصْبِحَ بَالِغًا، وَتَكْبَرُ صِغَارُ الْحَيَوَانَاتِ لِتُصْبِحَ حَيَوَانَاتٍ بَالِغَةً.', size: 0.064 },
        { type: 'chips', label: 'أَسْمَاءُ بَعْضِ الصِّغَارِ:', items: [{ i: '🦁', t: 'الشِّبْلُ' }, { i: '🐪', t: 'الْحُوَارُ' }, { i: '🐐', t: 'الْجَدْيُ' }, { i: '👶', t: 'الطِّفْلُ' }] },
        { type: 'highlight', t: 'قَارِنْ: الْأَرْنَبُ تُنْجِبُ صِغَارًا كَثِيرَةً، وَالْأُمُّ تُنْجِبُ عَادَةً طِفْلًا وَاحِدًا.', size: 0.06, color: C.leaf },
      ],
    }, [
      { label: 'الْعَبْ «مَنْ أُمِّي؟»', onClick: () => startGame(true) },
      { label: 'اسْتَكْشِفْ بِحُرِّيَّةٍ', color: '#dff1ff', onClick: () => { closePanel(); mode = 'free'; setHud('اسْتَكْشِفْ بِحُرِّيَّةٍ 🦁', 'الْمِسْ أَيَّ حَيَوَانٍ أَوْ لَوْحَةٍ'); say('free'); } },
    ]);
    setMood('cheer'); say('end');
    const { pos } = frontOf(2.4); pos.y = eyeY() + 1.1; burst(pos);
  }

  // Developer view: ?gallery lines up every model in front of the camera.
  function gallery() {
    document.getElementById('topbar').hidden = true;
    const ids = ['lion', 'cub', 'elephant', 'calf', 'camel', 'camelCalf', 'goat', 'kid', 'duck', 'duckling', 'rabbit', 'bunny',
      'mother', 'baby', 'cradle', 'salem', 'man', 'hay', 'bowl', 'hut', 'ball', 'lolly', 'car', 'acacia'];
    window.__gallery = ids.map((id, i) => {
      const x = (i - ids.length / 2) * 3, z = -30;
      if (id === 'salem') { const s = buildSalem(); s.root.position.set(x, 0, z); scene.object3D.add(s.root); return { id, x, z, h: 1.4 }; }
      const m = MODELS[id](); m.scale.setScalar(YSIZE[id] || PSIZE[id] || 1); m.position.set(x, 0, z); m.rotation.y = 0.6; scene.object3D.add(m);
      return { id, x, z, h: heightOf(m) };
    });
  }

  // Test hooks (?test): lets the automated check drive the lesson without aiming a pointer.
  if (TEST) window.__t = {
    mode: () => mode, game: () => game, stage: () => stage, panel: () => panel, FAMILIES,
    parentEls, creatureEls, signEls,
    buttons: () => [...(panel ? panel.querySelectorAll('.clickable') : [])],
    stageEls: () => stage ? [...stage.el.querySelectorAll('.clickable')] : [],
    jump: name => ({ grow: growIntro, count: countIntro, nest: nestIntro })[name](),
  };

  // ---------- Boot ----------
  async function boot() {
    const timeout = ms => new Promise(r => setTimeout(r, ms));
    await Promise.race([
      Promise.all([document.fonts.load(`800 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`600 40px "Baloo Bhaijaan 2"`, 'عربي'),
        document.fonts.load(`700 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`40px "Noto Color Emoji"`, '🐪')]),
      timeout(3500),
    ]).catch(() => {});
    try { maxAniso = scene.renderer.capabilities.getMaxAnisotropy(); } catch (e) { /* keep default */ }
    buildSky();
    if (GALLERY) { buildLandscape(); gallery(); document.getElementById('loader').hidden = true; return; }
    buildLandscape();
    buildZones();
    salem = buildSalem(); salem.baseY = 0;
    scene.object3D.add(salem.root);
    setTimeout(() => {
      if (scene.camera) scene.camera.getWorldPosition(camPos);
      welcome();
      document.getElementById('loader').hidden = true;
    }, 200);
  }
  if (scene.hasLoaded) boot(); else scene.addEventListener('loaded', boot);
})();
</script>
