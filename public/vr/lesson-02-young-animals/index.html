<style>
  :root {
    --ink: #1f3a4d;
    --sand: #f6e7c8;
    --sun: #f4b942;
    --om-red: #d6172b;
    --om-green: #00843d;
    --paper: #fffdf7;
    --font: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #cdeefc; font-family: var(--font); color: var(--ink); }
  #loader {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(#bfe6fb, #f6e7c8); text-align: center; padding-inline: 16px;
  }
  #loader .flag { display: flex; width: 84px; height: 48px; margin: 0 auto 14px; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px rgba(31,58,77,.2); }
  #loader .flag i { display: block; }
  #loader b { display: block; font-size: clamp(26px, 6vw, 42px); font-weight: 800; }
  #loader span { font-size: 18px; opacity: .8; }
  #start { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }
  #start button { border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 22px; color: var(--ink);
    background: var(--sun); border-radius: 999px; padding: 12px 26px; box-shadow: 0 4px 14px rgba(31,58,77,.25); }
  #start #govr { background: #2a9d8f; color: #fff; }
  #start button:focus-visible, #timeBtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #timeBtn, #menuBtn { pointer-events: auto; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 15px;
    background: #fffdf7; color: var(--ink); border-radius: 999px; padding: 8px 14px; box-shadow: 0 2px 8px rgba(31, 58, 77, .2); }
  #menuBtn { background: #7a5cff; color: #fff; }
  #turnL, #turnR { pointer-events: auto; border: 0; cursor: pointer; font-size: 18px; background: #fffdf7;
    border-radius: 999px; width: 40px; height: 40px; box-shadow: 0 2px 8px rgba(31, 58, 77, .2); }
  #topbar {
    position: fixed; top: env(safe-area-inset-top, 0px); inset-inline: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 16px; pointer-events: none;
  }
  #topbar .hint {
    background: rgba(255, 253, 247, .94); border-radius: 999px; padding: 6px 14px;
    font-size: 15px; font-weight: 700; box-shadow: 0 2px 8px rgba(31, 58, 77, .15);
  }
  #sound {
    pointer-events: auto; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 15px;
    background: var(--sun); color: var(--ink); border-radius: 999px; padding: 8px 14px;
    box-shadow: 0 2px 8px rgba(31, 58, 77, .2);
  }
  #sound:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .a-enter-vr { z-index: 11; }
  [hidden] { display: none !important; }
</style>
<script>
  // Components must be registered before the scene is parsed.
  AFRAME.registerComponent('snap-turn', {
    // Right (and left) thumbstick: flick sideways to turn 30°. Arrow keys do the same on desktop.
    schema: { angle: { default: 30 } },
    init() {
      this.latched = false;
      this.cam = document.getElementById('cam');
      const onMove = e => {
        const x = e.detail.x;
        if (!this.latched && Math.abs(x) > 0.65) { this.latched = true; this.turn(x > 0 ? -1 : 1); }
        else if (Math.abs(x) < 0.3) this.latched = false;
      };
      this.el.querySelectorAll('[laser-controls]').forEach(h => h.addEventListener('thumbstickmoved', onMove));
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') this.turn(1);
        if (e.key === 'ArrowRight') this.turn(-1);
      });
    },
    turn(dir) {
      const o = this.el.object3D, before = new THREE.Vector3(), after = new THREE.Vector3();
      this.cam.object3D.getWorldPosition(before);
      o.rotation.y += dir * this.data.angle * Math.PI / 180;
      o.updateMatrixWorld(true);
      this.cam.object3D.getWorldPosition(after);
      o.position.x += before.x - after.x; o.position.z += before.z - after.z;
      this.el.emit('snapturn');
    }
  });
</script>
</head>
<body>
<div id="loader"><div>
  <div class="flag" aria-hidden="true"><i style="width:33%;background:var(--om-red)"></i><i style="flex:1;background:linear-gradient(#fff 0 33.3%,var(--om-red) 33.3% 66.6%,var(--om-green) 66.6%)"></i></div>
  <b>صَغِيرُ الْإِنْسَانِ وَصَغِيرُ الْحَيَوَانِ</b>
  <span id="loading">جَارٍ تَجْهِيزُ الرِّحْلَةِ…</span>
  <div id="start" hidden>
    <button id="go" type="button">🚀 هَيَّا نَبْدَأُ الرِّحْلَةَ</button>
    <button id="govr" type="button" hidden>🥽 ادْخُلْ بِالنَّظَّارَةِ</button>
  </div>
</div></div>
<div id="topbar">
  <span class="hint">اسحب لتنظر حولك • المس الصغار • ← → للالتفاف • T لتغيير الوقت • زر VR للنظارة</span>
  <span style="display:flex;gap:8px"><button id="turnL" type="button">↩️</button><button id="turnR" type="button">↪️</button><button id="menuBtn" type="button">🎮 القائمة</button><button id="timeBtn" type="button">🌗 الوقت</button><button id="sound" type="button" aria-pressed="true">🔊 الصوت</button></span>
</div>

<a-scene id="scene" loading-screen="enabled: false" renderer="antialias: true; foveationLevel: 1; highRefreshRate: true"
         cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 80" background="color: #cdeefc">
  <a-entity light="type: hemisphere; color: #e6f5ff; groundColor: #a08a62; intensity: 1.25"></a-entity>
  <a-entity light="type: directional; color: #fff0d2; intensity: 1.55" position="-6 12 8"></a-entity>
  <a-entity light="type: directional; color: #cfe6ff; intensity: 0.35" position="8 5 -6"></a-entity>

  <a-entity id="rig" snap-turn>
    <a-entity id="cam" camera="near: 0.05; far: 900" look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
    <a-entity id="handR" laser-controls="hand: right" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
    <a-entity id="handL" laser-controls="hand: left" raycaster="objects: .clickable; far: 80; lineColor: #ffd166; lineOpacity: 0.9"></a-entity>
    <!-- Hand tracking: only active when the headset sees bare hands (controllers set down), inert otherwise.
         A pinch is wired to the exact same click/grab pipeline as the controller trigger. -->
    <a-entity id="handTR" hand-tracking-controls="hand: right; modelStyle: mesh"></a-entity>
    <a-entity id="handTL" hand-tracking-controls="hand: left; modelStyle: mesh"></a-entity>
  </a-entity>

  <a-entity id="world"></a-entity>
  <a-entity id="ui"></a-entity>
</a-scene>

<script>
(() => {
  'use strict';
  const L = window.LESSON, T = THREE;
  const FAMILIES = L.families;
  // Sign above each enclosure: parent and young together.
  const SIGN = { lion: 'الْأَسَدُ وَالشِّبْلُ', elephant: 'الْفِيلُ وَصَغِيرُهُ', camel: 'النَّاقَةُ وَالْحُوَارُ', goat: 'الْمَاعِزُ وَالْجَدْيُ',
    duck: 'الْبَطَّةُ وَصِغَارُهَا', rabbit: 'الْأَرْنَبُ وَصِغَارُهَا', human: 'الْأُمُّ وَالطِّفْلُ' };
  FAMILIES.forEach(f => { f.name = SIGN[f.id]; });
  const ZONE_R = 9, SIGN_Z = -5.0;
  const GALLERY = /[?&]gallery\b/.test(location.search);
  const TEST = /[?&]test\b/.test(location.search);
  const GAME_ROUNDS = 5, ROUND_TIME = (TEST && +new URLSearchParams(location.search).get('rt')) || 40; // ?rt shortens the timer for the automated check

  const rad = d => d * Math.PI / 180;
  const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const fam = id => FAMILIES.find(f => f.id === id);
  const inZone = n => n.replace(/ُ$/, 'ِ'); // الشِّبْلُ → (أُمُّ) الشِّبْلِ
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const scene = document.getElementById('scene');
  const worldEl = document.getElementById('world');
  const uiEl = document.getElementById('ui');
  const camEl = document.getElementById('cam');

  // =====================================================================
  // Geometry kit: builds each model from simple shapes, then merges them into
  // one vertex-coloured mesh (one draw call per model — important on Quest).
  // =====================================================================
  const MAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0 });
  const MAT_FLAT = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true });
  const GEO = {
    sph: new T.SphereGeometry(1, 24, 18),
    sphLo: new T.SphereGeometry(1, 10, 8),
    cyl: (rt, rb, h, s = 16) => new T.CylinderGeometry(rt, rb, h, s),
    cone: (r, h, s = 16) => new T.ConeGeometry(r, h, s),
    box: (w, h, d) => new T.BoxGeometry(w, h, d),
    tor: (R, r, arc = Math.PI * 2) => new T.TorusGeometry(R, r, 8, 20, arc),
    ico: (r, d = 0) => new T.IcosahedronGeometry(r, d),
  };
  const _m = new T.Matrix4(), _q = new T.Quaternion(), _e = new T.Euler(), _p = new T.Vector3(), _s = new T.Vector3();

  class Kit {
    constructor() { this.smooth = []; this.flat = []; }
    add(geo, color, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1], flat = false) {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      _e.set(r[0], r[1], r[2], r[3] || 'XYZ'); _q.setFromEuler(_e);
      _m.compose(_p.set(p[0], p[1], p[2]), _q, _s.set(s[0], s[1], s[2]));
      // colour: one colour, or [bottom, top] for a soft vertical gradient (lighter bellies, shaded legs)
      const n = g.attributes.position.count, col = new Float32Array(n * 3), pos = g.attributes.position;
      if (Array.isArray(color)) {
        const c0 = new T.Color(color[0]), c1 = new T.Color(color[1]), c = new T.Color();
        g.computeBoundingBox(); const y0 = g.boundingBox.min.y, y1 = g.boundingBox.max.y;
        for (let i = 0; i < n; i++) { c.copy(c0).lerp(c1, (pos.getY(i) - y0) / Math.max(1e-6, y1 - y0)); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      } else {
        const c = new T.Color(color);
        for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      }
      g.setAttribute('color', new T.BufferAttribute(col, 3));
      g.applyMatrix4(_m);
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(k)) g.deleteAttribute(k);
      (flat ? this.flat : this.smooth).push(g);
      return this;
    }
    // ellipsoid
    ell(color, p, s, r = [0, 0, 0], flat = false) {
      const big = Math.max(s[0], s[1], s[2]) > 0.09;
      return this.add(big ? GEO.sph : GEO.sphLo, color, p, r, s, flat);
    }
    build() {
      const g = new T.Group();
      if (this.smooth.length) g.add(new T.Mesh(merge(this.smooth), MAT));
      if (this.flat.length) g.add(new T.Mesh(merge(this.flat), MAT_FLAT));
      return g;
    }
  }
  function merge(list) {
    let n = 0; for (const g of list) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    for (const g of list) {
      pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); col.set(g.attributes.color.array, o * 3);
      o += g.attributes.position.count; g.dispose();
    }
    const out = new T.BufferGeometry();
    out.setAttribute('position', new T.BufferAttribute(pos, 3));
    out.setAttribute('normal', new T.BufferAttribute(nor, 3));
    out.setAttribute('color', new T.BufferAttribute(col, 3));
    out.computeBoundingSphere(); out.computeBoundingBox();
    return out;
  }
  function eyes(k, x, y, z, r, iris = '#2a1b12') {
    for (const s of [-1, 1]) {
      k.ell('#ffffff', [s * x, y, z], [r, r * 1.05, r * 0.8]);
      k.ell(iris, [s * x, y, z + r * 0.5], [r * 0.64, r * 0.68, r * 0.45]);
      k.ell('#ffffff', [s * x + r * 0.22, y + r * 0.28, z + r * 0.85], [r * 0.2, r * 0.2, r * 0.12]);
    }
  }
  const legs4 = (k, color, xs, zs, len, r, y0 = 0, hoof) => {
    for (const x of xs) for (const z of zs) {
      k.add(GEO.cyl(r, r * 0.85, len, 12), color, [x, y0 + len / 2, z]);
      if (hoof) k.add(GEO.cyl(r * 1.05, r * 1.1, 0.08, 12), hoof, [x, 0.04, z]);
    }
  };
  const jitter = (geo, amt) => {
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) if (p.getY(i) > -geo.parameters.height / 2 + 0.01) {
      p.setXYZ(i, p.getX(i) + (rnd() - 0.5) * amt, p.getY(i) + (rnd() - 0.5) * amt * 0.6, p.getZ(i) + (rnd() - 0.5) * amt);
    }
    geo.computeVertexNormals(); return geo;
  };

  // =====================================================================
  // Creature and plant models. Each faces +Z, stands on y = 0.
  // =====================================================================
  const MODELS = {
    camel() {
      const k = new Kit(), fur = '#d6a468', dark = '#b58045', light = '#edc795';
      k.ell(fur, [0, 1.32, 0], [0.5, 0.42, 0.95]);
      k.ell(fur, [0, 1.74, -0.15], [0.36, 0.38, 0.44]);
      // Omani saddle cloth: red, white and green
      k.ell('#d6172b', [0, 1.52, 0.38], [0.53, 0.2, 0.3]);
      k.ell('#ffffff', [0, 1.6, 0.38], [0.47, 0.16, 0.27]);
      k.ell('#00843d', [0, 1.66, 0.38], [0.41, 0.12, 0.24]);
      for (const x of [-0.53, 0.53]) for (const z of [0.2, 0.38, 0.56]) k.ell('#f4b942', [x, 1.36, z], [0.035, 0.05, 0.035]);
      for (const x of [-0.27, 0.27]) for (const z of [-0.58, 0.58]) {
        k.add(GEO.cyl(0.13, 0.09, 0.5, 12), fur, [x, 1.02, z]);
        k.add(GEO.cyl(0.075, 0.07, 0.8, 12), dark, [x, 0.42, z]);
        k.ell(dark, [x, 0.72, z], [0.1, 0.1, 0.1]);
        k.ell('#8a6038', [x, 0.04, z + 0.04], [0.13, 0.05, 0.16]);
      }
      k.add(GEO.cyl(0.13, 0.2, 0.98, 14), fur, [0, 1.74, 0.94], [0.55, 0, 0]);
      k.ell(fur, [0, 2.2, 1.3], [0.17, 0.16, 0.3]);
      k.ell(light, [0, 2.13, 1.55], [0.14, 0.12, 0.14]);
      for (const s of [-1, 1]) {
        k.ell('#5a3b22', [s * 0.05, 2.15, 1.68], [0.022, 0.016, 0.01]);
        k.ell(fur, [s * 0.14, 2.33, 1.16], [0.04, 0.075, 0.03], [0, 0, s * -0.3]);
      }
      eyes(k, 0.13, 2.26, 1.36, 0.045);
      k.add(GEO.cyl(0.025, 0.04, 0.55, 8), dark, [0, 1.12, -1.0], [-0.25, 0, 0]);
      k.ell('#6b4a2b', [0, 0.85, -1.07], [0.05, 0.09, 0.05]);
      return k.build();
    },
    oryx() {
      const k = new Kit(), white = '#f4f0e6', dark = '#3a2c24', tan = '#cdbba0';
      k.ell(white, [0, 1.05, 0], [0.32, 0.36, 0.72]);
      k.ell('#6b5444', [0, 0.86, 0], [0.325, 0.07, 0.6]);
      for (const x of [-0.18, 0.18]) for (const z of [-0.48, 0.48]) {
        k.add(GEO.cyl(0.08, 0.06, 0.42, 12), white, [x, 0.8, z]);
        k.add(GEO.cyl(0.045, 0.04, 0.6, 10), dark, [x, 0.32, z]);
        k.ell(dark, [x, 0.03, z + 0.02], [0.05, 0.035, 0.07]);
      }
      k.add(GEO.cyl(0.1, 0.14, 0.58, 12), white, [0, 1.43, 0.62], [0.45, 0, 0]);
      k.ell(white, [0, 1.72, 0.84], [0.12, 0.13, 0.25]);
      k.ell(dark, [0, 1.73, 0.97], [0.05, 0.1, 0.12]);
      k.ell(dark, [0, 1.6, 1.04], [0.07, 0.06, 0.06]);
      for (const s of [-1, 1]) {
        k.ell(dark, [s * 0.1, 1.74, 0.88], [0.04, 0.07, 0.07]);
        k.add(GEO.cone(0.028, 0.9, 10), dark, [s * 0.06, 2.18, 0.64], [-0.45, 0, 0]);
        k.ell(white, [s * 0.13, 1.86, 0.74], [0.03, 0.08, 0.03], [0, 0, s * -0.7]);
      }
      eyes(k, 0.11, 1.78, 0.9, 0.035);
      k.add(GEO.cyl(0.025, 0.03, 0.4, 8), dark, [0, 0.92, -0.74], [-0.3, 0, 0]);
      k.ell(tan, [0, 1.2, 0.2], [0.26, 0.16, 0.4]);
      return k.build();
    },
    lizard() {
      const k = new Kit(), c = '#b8975f', spot = '#8a6a3f', belly = '#dcc79c';
      k.ell(c, [0, 0.14, 0], [0.2, 0.11, 0.42]);
      k.ell(belly, [0, 0.09, 0.02], [0.17, 0.06, 0.36]);
      for (const [x, z] of [[0.08, 0.15], [-0.07, -0.05], [0.05, -0.22], [-0.1, 0.25], [0.11, -0.1]]) k.ell(spot, [x, 0.24, z], [0.04, 0.015, 0.05]);
      k.ell(c, [0, 0.17, 0.5], [0.13, 0.09, 0.17]);
      eyes(k, 0.08, 0.23, 0.56, 0.03);
      k.add(GEO.cone(0.13, 0.95, 12), c, [0, 0.12, -0.85], [-Math.PI / 2, 0, 0]);
      for (const s of [-1, 1]) for (const z of [0.25, -0.2]) k.ell(c, [s * 0.23, 0.07, z], [0.13, 0.04, 0.05], [0, s * 0.5, 0]);
      return k.build();
    },
    palm(h = 4) {
      const k = new Kit();
      const segs = Math.round(h / 0.4);
      let top = 0;
      for (let i = 0; i < segs; i++) {
        const r = 0.2 - i * 0.006, x = 0.012 * i * i * 0.1;
        k.add(GEO.cyl(r - 0.02, r, 0.42, 10), i % 2 ? '#8b6a45' : '#76593a', [x, 0.2 + i * 0.4, 0], [0, 0, -0.01 * i], [1, 1, 1], true);
        top = 0.2 + i * 0.4 + 0.2;
      }
      const tx = 0.012 * segs * segs * 0.1;
      k.ell('#6f8f3a', [tx, top, 0], [0.22, 0.18, 0.22]);
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI * 2 / 12, droop = i % 2 ? 0.55 : 0.3, len = i % 2 ? 1.05 : 1.2;
        k.ell(i % 3 ? '#3f8f3f' : '#4fa24b', [tx + Math.sin(a) * len * 0.85, top - 0.1 - droop * 0.5, Math.cos(a) * len * 0.85], [0.2, 0.025, len], [droop, a, 0, 'YXZ'], true);
      }
      for (let i = 0; i < 3; i++) {
        const a = i * 2.1 + 0.4;
        for (let j = 0; j < 7; j++) k.ell(j % 2 ? '#d9822b' : '#c56a1f', [tx + Math.sin(a) * 0.28 + (rnd() - 0.5) * 0.12, top - 0.35 - rnd() * 0.25, Math.cos(a) * 0.28 + (rnd() - 0.5) * 0.12], [0.055, 0.07, 0.055]);
      }
      return k.build();
    },
    cow() {
      const k = new Kit(), w = '#f6f3ec', b = '#2b2b2b', pink = '#f1aaa2';
      k.ell(w, [0, 1.0, 0], [0.45, 0.42, 0.8]);
      k.ell(b, [0.3, 1.1, 0.2], [0.18, 0.22, 0.3]);
      k.ell(b, [-0.3, 0.95, -0.3], [0.17, 0.2, 0.26]);
      k.ell(b, [0.05, 1.33, -0.35], [0.26, 0.11, 0.26]);

  // =====================================================================
  // Lesson 2 models: parents, their young, people and nest items. Face +Z, stand on y = 0.
  // =====================================================================
  const _up = new T.Vector3(0, 1, 0);
  // cylinder from point a to point b (radius r1 at a, r2 at b)
  function seg(k, color, a, b, r1, r2, flat = false) {
    const A = new T.Vector3(...a), B = new T.Vector3(...b), d = B.clone().sub(A);
    const q = new T.Quaternion().setFromUnitVectors(_up, d.clone().normalize());
    const e = new T.Euler().setFromQuaternion(q);
    const mid = A.clone().add(B).multiplyScalar(0.5);
    k.add(GEO.cyl(r2, r1, d.length(), 12), color, mid.toArray(), [e.x, e.y, e.z], [1, 1, 1], flat);
  }
  // a smooth limb through several points, with a joint ball at each bend
  function limb(k, color, pts, r0, r1) {
    for (let i = 0; i < pts.length - 1; i++) {
      const a = r0 + (r1 - r0) * i / (pts.length - 1), b = r0 + (r1 - r0) * (i + 1) / (pts.length - 1);
      seg(k, color, pts[i], pts[i + 1], a, b);
      if (i > 0) k.ell(color, pts[i], [a, a, a]);
    }
  }
  // Big, friendly cartoon eyes: white, iris, pupil, two catch-lights, an eyelid and (optionally) lashes and brows.
  // ry turns the eyes outwards (animals with eyes on the sides of the head).
  function eyes2(k, x, y, z, r, o = {}) {
    const iris = o.iris || '#4a2e14', ry = o.ry || 0;
    for (const s of [-1, 1]) {
      const d = [s * Math.sin(ry), 0, Math.cos(ry)], P = (f, up = 0, side = 0) => [s * x + d[0] * f + side * d[2] * s, y + up, z + d[2] * f - side * d[0] * s];
      const rot = [0, s * ry, 0];
      k.ell('#ffffff', P(0), [r, r * 1.08, r * 0.72], rot);

  // =====================================================================
  // Salem — the Omani guide character: an embroidered kumma and a white dishdasha with its
  // stitched neckline, front placket and farrakha (the perfumed tassel)
  // =====================================================================
  const SALEM_TEX = {};
  function kummaTexture() {
    if (SALEM_TEX.kumma) return SALEM_TEX.kumma;
    // side band, unrolled: dense hand embroidery on white cotton, tiny perforations, borders top and bottom
    const W = 1024, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#fbfaf3'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#e4e0d2';
    for (let yy = 8; yy < H; yy += 9) for (let xx = (yy % 18) / 2; xx < W; xx += 9) { x.beginPath(); x.arc(xx, yy, 1.3, 0, Math.PI * 2); x.fill(); }
    const teal = '#15807f', maroon = '#8c1c3a', gold = '#c9971c', navy = '#24407a', green = '#2f7d3a';
    const band = (y, h, col) => { x.fillStyle = col; x.fillRect(0, y, W, h); };
    const zig = (y, h, col, n) => { x.fillStyle = col; x.beginPath(); for (let i = 0; i <= n; i++) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0)); } for (let i = n; i >= 0; i--) { const px = i * W / n; x.lineTo(px, y + (i % 2 ? h : 0) + 4); } x.fill(); };
    band(0, 7, teal); zig(10, 10, maroon, 64); band(26, 3, gold);
    // main field: 8 medallions (eight-point stars with rings), linked by diamond chains
    const n = 8, cy = 128;
    for (let i = 0; i < n; i++) {
      const cx = (i + 0.5) * W / n;
      const star = (r, col) => { x.fillStyle = col; x.beginPath(); for (let j = 0; j < 16; j++) { const a = j * Math.PI / 8, rr = j % 2 ? r * 0.7 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath(); x.fill(); };
      star(52, [teal, navy, maroon, green][i % 4]); star(40, '#fbfaf3'); star(32, [maroon, gold, teal, navy][i % 4]);
      x.fillStyle = '#fbfaf3'; x.beginPath(); x.arc(cx, cy, 16, 0, Math.PI * 2); x.fill();
      x.fillStyle = gold; x.beginPath(); x.arc(cx, cy, 9, 0, Math.PI * 2); x.fill();
      for (let j = 0; j < 8; j++) { const a = j * Math.PI / 4; x.fillStyle = teal; x.beginPath(); x.arc(cx + Math.cos(a) * 24, cy + Math.sin(a) * 24, 2.4, 0, Math.PI * 2); x.fill(); }
      const mx = cx + W / n / 2;
      for (const dy of [-34, 0, 34]) { x.fillStyle = dy ? gold : maroon; x.beginPath(); x.moveTo(mx, cy + dy - 9); x.lineTo(mx + 7, cy + dy); x.lineTo(mx, cy + dy + 9); x.lineTo(mx - 7, cy + dy); x.fill(); }

    const y = t.getContext('2d');

    const ring = (r, col, w) => { y.strokeStyle = col; y.lineWidth = w; y.beginPath(); y.arc(256, 256, r, 0, Math.PI * 2); y.stroke(); };
    for (let r = 230; r > 60; r -= 26) ring(r, [teal, maroon, gold, navy][(r / 26 | 0) % 4], 5);
    for (let j = 0; j < 24; j++) {
      const a = j * Math.PI / 12; y.fillStyle = j % 2 ? maroon : teal;

      y.beginPath(); y.ellipse(0, 0, 22, 8, 0, 0, Math.PI * 2); y.fill(); y.restore();

    y.fillStyle = gold; y.beginPath(); for (let j = 0; j < 16; j++) { const a = j * Math.PI / 8, rr = j % 2 ? 34 : 56; y.lineTo(256 + Math.cos(a) * rr, 256 + Math.sin(a) * rr); } y.fill();

  function dishdashaTexture() {

    const W = 1024, H = 1024, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#f9f8f3'; x.fillRect(0, 0, W, H);

    }

    return (SALEM_TEX.dish = t);
  }

  // =====================================================================

  const FONT = '"Baloo Bhaijaan 2","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif';
  const EMOJI = '"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
  const C = { ink: '#1f3a4d', soft: '#5d7486', paper: '#fffdf7', line: '#eadfc8', sun: '#f4b942', teal: '#2a9d8f', coral: '#e76f51',
    leaf: '#4f9d5d', sky: '#2f8fc4', red: '#d6172b', green: '#00843d', gold: '#e9a820' };
  let maxAniso = 4;

  function texFrom(canvas) {
    const t = new T.CanvasTexture(canvas);
    t.colorSpace = T.SRGBColorSpace; t.anisotropy = maxAniso;
    t.minFilter = T.LinearMipmapLinearFilter; t.generateMipmaps = true;
    return t;
  }
  function wrap(ctx, text, maxW) {
    const out = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const w of para.split(' ')) {
        const t = line ? line + ' ' + w : w;
        if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
      }
      out.push(line);
    }
    return out;
  }
  function drawEmoji(x, e, cx, cy, size) {
    x.save(); x.globalAlpha = 1; x.fillStyle = '#000'; x.font = `${size}px ${EMOJI}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.direction = 'ltr';
    x.fillText(e, cx, cy + size * 0.06); x.restore();
  }
  function drawOmanFlag(x, fx, fy, w, h) {
    const red = C.red, green = C.green, band = w / 3;
    x.save();
    x.beginPath(); x.roundRect(fx, fy, w, h, Math.min(w, h) * 0.06); x.clip();
    x.fillStyle = '#ffffff'; x.fillRect(fx, fy, w, h / 3);
    x.fillStyle = red; x.fillRect(fx, fy + h / 3, w, h / 3);
    x.fillStyle = green; x.fillRect(fx, fy + 2 * h / 3, w, h / 3 + 1);
    x.fillStyle = red; x.fillRect(fx, fy, band, h);
    // national emblem (khanjar over crossed swords), simplified, in white
    const cx = fx + band / 2, cy = fy + h * 0.2, s = Math.min(band, h) * 0.34;
    x.strokeStyle = '#ffffff'; x.fillStyle = '#ffffff'; x.lineCap = 'round';
    x.lineWidth = s * 0.07;
    for (const d of [-1, 1]) {
      x.beginPath(); x.moveTo(cx - d * s * 0.5, cy - s * 0.42); x.quadraticCurveTo(cx + d * s * 0.1, cy + s * 0.05, cx + d * s * 0.52, cy + s * 0.45); x.stroke();
      x.beginPath(); x.moveTo(cx - d * s * 0.52 - s * 0.08, cy - s * 0.3); x.lineTo(cx - d * s * 0.3, cy - s * 0.5); x.stroke();
    }
    x.lineWidth = s * 0.16;
    x.beginPath(); x.moveTo(cx, cy - s * 0.35); x.lineTo(cx, cy + s * 0.12); x.quadraticCurveTo(cx, cy + s * 0.42, cx + s * 0.22, cy + s * 0.36); x.stroke();
    x.fillRect(cx - s * 0.16, cy - s * 0.5, s * 0.32, s * 0.12);
    x.fillRect(cx - s * 0.3, cy - s * 0.12, s * 0.6, s * 0.08);
    x.restore();
  }

  // ---- Cards: measured first, so text always fits inside the card ----
  const PX = 520; // canvas pixels per metre for UI (sharp text in the headset)
  function renderCard(x, spec, draw) {
    const W = Math.round(spec.w * PX), pad = Math.round(0.075 * PX), M = 18; // M: shadow margin
    const inner = W - 2 * M;
    const accent = spec.accent || C.teal;
    let y = M + pad * 0.8;
    x.direction = 'rtl';
    // header: icon (or flag) on the right, title and subtitle to its left
    if (spec.title) {
      const iconD = spec.icon || spec.flag ? Math.round(0.19 * PX) : 0;
      const tSize = Math.round((spec.titleSize || 0.105) * PX);
      x.font = `800 ${tSize}px ${FONT}`;
      const titleLines = wrap(x, spec.title, inner - 2 * pad - (iconD ? iconD + pad * 0.6 : 0));
      const sSize = Math.round(0.062 * PX);
      const blockH = titleLines.length * tSize * 1.5 + (spec.subtitle ? sSize * 1.6 : 0);
      const headH = Math.max(iconD, blockH);
      if (draw) {
        const rx = W - M - pad;
        if (spec.flag) {
          drawOmanFlag(x, rx - iconD * 1.25, y + (headH - iconD * 0.72) / 2, iconD * 1.25, iconD * 0.72);
        } else if (iconD) {
          x.fillStyle = accent + '26'; x.beginPath(); x.arc(rx - iconD / 2, y + headH / 2, iconD / 2, 0, Math.PI * 2); x.fill();
          drawEmoji(x, spec.icon, rx - iconD / 2, y + headH / 2, iconD * 0.62);
        }
        const tx = rx - (iconD ? (spec.flag ? iconD * 1.25 : iconD) + pad * 0.6 : 0);
        let ty = y + (headH - blockH) / 2;
        x.textAlign = 'right'; x.textBaseline = 'top'; x.fillStyle = C.ink; x.font = `800 ${tSize}px ${FONT}`;
        for (const l of titleLines) { x.fillText(l, tx, ty); ty += tSize * 1.5; }

      R.rotation.z += (-0.12 + Math.sin(t * 1.3) * 0.04 - R.rotation.z) * 0.1;
      Lf.rotation.z += (0.12 - Math.sin(t * 1.3) * 0.04 - Lf.rotation.z) * 0.1;
    }
  }
  function setMood(m) { if (!salem) return; salem.mood = m; salem.moodT = 0; salem.arms[1].rotation.x = 0; }

  // Salem stands on the ground to the right of whatever he is presenting, facing the child.
  let bubbleMesh = null;
  function salemBeside(pos, rotY, halfW) {
    if (!salem) return;
    const right = new T.Vector3(Math.cos(rotY), 0, -Math.sin(rotY));
    const target = pos.clone().addScaledVector(right, halfW + 0.42);
    const away = new T.Vector3(target.x - camPos.x, 0, target.z - camPos.z).normalize().multiplyScalar(0.35);
    target.add(away); target.y = 0;
    const from = salem.root.position.clone(), far = from.distanceTo(target) > 0.05;
    salem.root.rotation.y = Math.atan2(camPos.x - target.x, camPos.z - target.z);
    salem.baseY = 0;
    if (!salem.placed) { salem.placed = true; salem.root.position.copy(target); return; }
    if (!far) return;
    tween(0.45, k => {
      salem.root.position.lerpVectors(from, target, k);
      salem.root.position.y = Math.sin(k * Math.PI) * 0.35;
    }, () => { salem.root.position.y = 0; });
    if (bubbleMesh) bubbleMesh.visible = false;
  }
  function showBubble(text) {
    if (!salem) return;
    hideBubble();
    const c = cardCanvas({ w: 1.0, accent: C.coral, blocks: [{ t: `💬 ${L.character.name}`, size: 0.05, bold: true, color: C.coral }, { t: text, size: 0.066, bold: true }] });
    bubbleMesh = planeMesh(c, 0.95);
    bubbleMesh.position.set(0, 1.5 + bubbleMesh.userData.h / 2, 0);
    salem.root.add(bubbleMesh); billboards.push(bubbleMesh);
  }
  function hideBubble() {
    if (!bubbleMesh) return;
    bubbleMesh.parent && bubbleMesh.parent.remove(bubbleMesh);
    billboards.splice(billboards.indexOf(bubbleMesh), 1); bubbleMesh.material.map.dispose(); bubbleMesh = null;
  }

  function burst(pos) {
    const icons = ['⭐', '✨', '🌟', '🎉'];
    for (let i = 0; i < 16; i++) {
      const c = document.createElement('canvas'); c.width = c.height = 96;
      drawEmoji(c.getContext('2d'), icons[i % 4], 48, 48, 72);
      const p = planeMesh(c, 0.3);
      p.position.copy(pos); scene.object3D.add(p); billboards.push(p);
      const v = [(Math.random() - 0.5) * 3, 2 + Math.random() * 2.5, (Math.random() - 0.5) * 3];
      tween(1.3, (k, d) => {
        v[1] -= 5 * d;
        p.position.x += v[0] * d; p.position.y += v[1] * d; p.position.z += v[2] * d;
        p.material.opacity = 1 - k;
      }, () => { scene.object3D.remove(p); billboards.splice(billboards.indexOf(p), 1); });
    }
  }
  function pulse(el, on) {
    el._pulse = on;
    if (!on) { el.object3D.scale.setScalar(el._base || 1); return; }
    const loop = () => tween(0.9, k => { if (el._pulse) el.object3D.scale.setScalar((el._base || 1) * (1 + 0.1 * Math.sin(k * Math.PI))); }, () => { if (el._pulse) loop(); });
    loop();
  }
  function shake(el) {
    const r0 = el.object3D.rotation.z;
    tween(0.5, k => { el.object3D.rotation.z = r0 + Math.sin(k * Math.PI * 6) * 0.06 * (1 - k); }, () => { el.object3D.rotation.z = r0; });
  }

  // =====================================================================
  // World building
  // =====================================================================
  const polar = (deg, r) => [r * Math.sin(rad(deg)), -r * Math.cos(rad(deg))];

  function noiseTexture(base, dots, { size = 256, n = 1400, rep = 1, soft = false } = {}) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    if (soft) {
      const g = x.createRadialGradient(size / 2, size / 2, size * 0.36, size / 2, size / 2, size / 2);
      g.addColorStop(0, base); g.addColorStop(1, base + '00');
      x.fillStyle = g;
    } else x.fillStyle = base;
    x.fillRect(0, 0, size, size);
    for (let i = 0; i < n; i++) {
      const px = rnd() * size, py = rnd() * size;
      if (soft && Math.hypot(px - size / 2, py - size / 2) > size * 0.44) continue;
      x.fillStyle = dots[i % dots.length]; x.globalAlpha = 0.35 + rnd() * 0.4;
      x.beginPath(); x.ellipse(px, py, 1 + rnd() * 3, 1 + rnd() * 2, rnd() * 3, 0, Math.PI * 2); x.fill();
    }
    x.globalAlpha = 1;
    const t = texFrom(c);
    if (rep > 1) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rep, rep); }
    return t;
  }
  function blobShadow(parent, r, x = 0, z = 0) {
    if (!blobShadow.mat) {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 4, 32, 32, 32);
      gr.addColorStop(0, 'rgba(40,30,20,0.38)'); gr.addColorStop(1, 'rgba(40,30,20,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      blobShadow.mat = new T.MeshBasicMaterial({ map: texFrom(c), transparent: true, depthWrite: false });
    }
    const m = new T.Mesh(new T.PlaneGeometry(1, 1), blobShadow.mat);
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.02, z); m.scale.set(r * 2, r * 2, 1); m.renderOrder = 1;
    parent.add(m); return m;
  }
  function disc(parent, r, tex, y = 0.01, opts = {}) {
    const m = new T.Mesh(new T.CircleGeometry(r, 48), new T.MeshStandardMaterial({ map: tex, transparent: true, depthWrite: false, roughness: 1, ...opts }));
    m.rotation.x = -Math.PI / 2; m.position.y = y; m.renderOrder = 0;
    parent.add(m); return m;
  }

  // =====================================================================
  // Setting: Salalah in the khareef — green Dhofar hills in light mist, coconut palms, banana
  // plants, frankincense trees and a Darbat-style waterfall. The sky has four times of day.
  // =====================================================================
  const TOD = {
    sunrise: { sky: ['#6f8fcf', '#f5b48c', '#ffe0b0', '#f1dcc0'], sun: '#ffcf8a', sunPos: [95, 18, -110], hemi: ['#ffe8d2', '#8a7a5a', 1.05], dir: ['#ffc896', 1.25], fog: ['#f2dcc4', 0.0085], stars: 0, cloud: '#ffe6da', lamp: 0.15, moon: 0 },
    day: { sky: ['#4fa6e0', '#9fd3f3', '#e3f3f4', '#e8efe0'], sun: '#fff3b0', sunPos: [-70, 95, 120], hemi: ['#e6f5ff', '#90a070', 1.25], dir: ['#fff0d2', 1.55], fog: ['#e4f0ea', 0.0075], stars: 0, cloud: '#ffffff', lamp: 0, moon: 0 },
    sunset: { sky: ['#34488f', '#e27a5c', '#ffb46e', '#f0c79a'], sun: '#ff9a50', sunPos: [-110, 14, 80], hemi: ['#ffd6b8', '#6a5a4a', 0.98], dir: ['#ff9e66', 1.15], fog: ['#ecbc98', 0.0085], stars: 0.25, cloud: '#ffc2a0', lamp: 0.7, moon: 0.3 },
    night: { sky: ['#070d24', '#152650', '#2c4675', '#1d2a44'], sun: '#fff3b0', sunPos: [-70, -60, 120], hemi: ['#9fb4ff', '#2e3a55', 0.8], dir: ['#c4d4ff', 0.6], fog: ['#1a2744', 0.008], stars: 1, cloud: '#46557a', lamp: 1, moon: 1 },
  };
  const TOD_ORDER = ['sunrise', 'day', 'sunset', 'night'];
  const TOD_ICON = { sunrise: '🌅', day: '☀️', sunset: '🌇', night: '🌙' };
  const TOD_NAME = { sunrise: 'الشُّرُوقُ', day: 'النَّهَارُ', sunset: 'الْغُرُوبُ', night: 'اللَّيْلُ' };
  const sky = { name: 'day', cur: null };

  function paintSky(cols) {
    const x = sky.canvas.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, cols[0]); g.addColorStop(0.42, cols[1]); g.addColorStop(0.5, cols[2]); g.addColorStop(1, cols[3]);
    x.fillStyle = g; x.fillRect(0, 0, 4, 256); sky.tex.needsUpdate = true;
  }
  function buildSky() {
    sky.canvas = document.createElement('canvas'); sky.canvas.width = 4; sky.canvas.height = 256;
    sky.tex = texFrom(sky.canvas);
    sky.mesh = new T.Mesh(new T.SphereGeometry(300, 24, 16), new T.MeshBasicMaterial({ map: sky.tex, side: T.BackSide, depthWrite: false, fog: false }));
    scene.object3D.add(sky.mesh);
    sky.sun = new T.Mesh(new T.SphereGeometry(6, 16, 12), new T.MeshBasicMaterial({ color: '#fff3b0', fog: false }));
    scene.object3D.add(sky.sun);
    sky.moon = new T.Group();
    const mk = new Kit(); mk.ell('#f4f1de', [0, 0, 0], [5, 5, 5]); for (const [a, b, r] of [[1.5, 1, 1.1], [-1.8, -0.6, 0.8], [0.3, -2, 0.7]]) mk.ell('#dcd6bd', [a, b, 4.4], [r, r, 0.6]);
    const moonMesh = mk.build(); moonMesh.children.forEach(m => { m.material = new T.MeshBasicMaterial({ vertexColors: true, fog: false, transparent: true }); });
    sky.moon.add(moonMesh); sky.moon.position.set(60, 80, -140); sky.moon.lookAt(0, 0, 0); scene.object3D.add(sky.moon);
    const sp = new Float32Array(900 * 3);
    for (let i = 0; i < 900; i++) {
      const u = rnd() * Math.PI * 2, v = 0.08 + rnd() * 0.9, r = 280;
      sp[i * 3] = Math.cos(u) * Math.cos(v) * r; sp[i * 3 + 1] = Math.sin(v) * r; sp[i * 3 + 2] = Math.sin(u) * Math.cos(v) * r;
    }
    const sg = new T.BufferGeometry(); sg.setAttribute('position', new T.BufferAttribute(sp, 3));
    sky.stars = new T.Points(sg, new T.PointsMaterial({ color: '#ffffff', size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
    scene.object3D.add(sky.stars);
    const k = new Kit();
    for (const [cx, cy, cz, s] of [[-30, 26, -60, 3], [40, 30, -50, 2.6], [60, 24, 20, 3.2], [-55, 28, 30, 2.8], [10, 32, 70, 3], [-20, 34, -90, 3.5], [70, 22, -30, 2.4]])
      for (const [a, b, c2, r] of [[0, 0, 0, 1.4], [1.3, -0.2, 0.2, 1], [-1.3, -0.25, 0, 1], [0.5, 0.5, -0.2, 0.9], [-0.6, 0.4, 0.3, 0.8]])
        k.add(GEO.ico(1, 1), '#ffffff', [cx + a * s, cy + b * s, cz + c2 * s], [0, 0, 0], [r * s, r * s * 0.7, r * s], true);
    sky.clouds = k.build();
    sky.cloudMat = new T.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.95, fog: false });
    sky.clouds.children.forEach(m => { m.material = sky.cloudMat; });
    scene.object3D.add(sky.clouds);
    scene.object3D.fog = new T.FogExp2('#e4f0ea', 0.0075);
    sky.lights = [...document.querySelectorAll('[light]')];
    setTimeOfDay('day', true);
  }
  // blend two presets (k = 0..1) and apply everything: sky, sun, moon, stars, lights, fog, lanterns
  function applySky(a, b, k) {
    const col = (p, q) => '#' + new T.Color(p).lerp(new T.Color(q), k).getHexString();
    const num = (p, q) => p + (q - p) * k;
    paintSky(a.sky.map((c, i) => col(c, b.sky[i])));
    sky.sun.material.color.set(col(a.sun, b.sun));
    sky.sun.position.set(num(a.sunPos[0], b.sunPos[0]), num(a.sunPos[1], b.sunPos[1]), num(a.sunPos[2], b.sunPos[2]));
    sky.stars.material.opacity = num(a.stars, b.stars);
    sky.moon.children[0].children.forEach(m => { m.material.opacity = num(a.moon, b.moon); });
    sky.moon.visible = num(a.moon, b.moon) > 0.02;
    sky.cloudMat.color.set(col(a.cloud, b.cloud));
    const [hemi, dir] = sky.lights;
    if (hemi) hemi.setAttribute('light', { color: col(a.hemi[0], b.hemi[0]), groundColor: col(a.hemi[1], b.hemi[1]), intensity: num(a.hemi[2], b.hemi[2]) });
    if (dir) dir.setAttribute('light', { color: col(a.dir[0], b.dir[0]), intensity: num(a.dir[1], b.dir[1]) });
    scene.object3D.fog.color.set(col(a.fog[0], b.fog[0])); scene.object3D.fog.density = num(a.fog[1], b.fog[1]);
    const lamp = num(a.lamp, b.lamp);
    for (const l of lanterns) { l.glow.material.opacity = 0.35 + lamp * 0.65; l.halo.material.opacity = lamp * 0.55; }
    if (fireflies) fireflies.material.opacity = Math.max(0, lamp - 0.3) * 1.2;
    if (waterfall) waterfall.material.color.set(col(a.cloud, b.cloud));
  }
  function setTimeOfDay(name, instant) {
    const from = sky.cur || TOD[name], to = TOD[name];
    sky.name = name;
    if (instant) { applySky(to, to, 1); sky.cur = to; return; }
    const snap = JSON.parse(JSON.stringify(from));
    tween(1.6, k => applySky(snap, to, k * k * (3 - 2 * k)), () => { sky.cur = to; });
    ambience.set(name);
  }
  function cycleTime() {
    const next = TOD_ORDER[(TOD_ORDER.indexOf(sky.name) + 1) % TOD_ORDER.length];
    setTimeOfDay(next);
    if (timeDial) drawDial(next);
    sfx.pop(); setMood('point');
    say('t_' + next);
  }

  // The sun dial: a little post near the child. Touch it to change the time of day.
  let timeDial = null;
  function dialCanvas(name) {
    const c = document.createElement('canvas'); c.width = 360; c.height = 430;
    const x = c.getContext('2d');
    x.fillStyle = 'rgba(31,58,77,.25)'; x.beginPath(); x.arc(180, 186, 168, 0, Math.PI * 2); x.fill();
    const g = x.createRadialGradient(180, 170, 20, 180, 180, 170); g.addColorStop(0, '#fffdf7'); g.addColorStop(1, name === 'night' ? '#b9c6f0' : '#ffe6a8');
    x.fillStyle = g; x.beginPath(); x.arc(180, 178, 164, 0, Math.PI * 2); x.fill();
    x.lineWidth = 12; x.strokeStyle = name === 'night' ? '#24407a' : '#e9a820'; x.stroke();
    drawEmoji(x, TOD_ICON[name], 180, 160, 150);
    x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = C.ink; x.font = `800 44px ${FONT}`;
    x.fillText(TOD_NAME[name], 180, 272);
    x.fillStyle = '#1f3a4d'; x.beginPath(); x.roundRect(40, 350, 280, 70, 35); x.fill();
    x.fillStyle = '#fff'; x.font = `800 36px ${FONT}`; x.fillText('غَيِّرِ الْوَقْتَ 🔄', 180, 387);
    return c;
  }
  function drawDial(name) { const old = timeDial.face.material.map; timeDial.face.material.map = texFrom(dialCanvas(name)); timeDial.face.material.needsUpdate = true; old.dispose(); }
  function buildTimeDial() {
    const g = new T.Group(), k = new Kit();
    seg(k, '#8a5a34', [0, 0, 0], [0, 1.05, 0], 0.05, 0.04, true);
    k.add(GEO.cyl(0.2, 0.25, 0.08, 16), '#a8784a', [0, 0.04, 0], [0, 0, 0], [1, 1, 1], true);
    g.add(k.build());
    const face = planeMesh(dialCanvas(sky.name), 0.5); face.position.y = 1.3; g.add(face);
    const el = entityWith(g, worldEl);
    const [x, z] = polar(-62, 3.3); el.object3D.position.set(x, 0, z); el.object3D.rotation.y = Math.atan2(-x, -z);
    billboards.push(face);
    clickable(el, cycleTime, { hover: 1.06 });
    timeDial = { el, face };
  }

  // Omani brass lanterns between the enclosures; they glow at sunset and at night
  const lanterns = [];
  let fireflies = null, waterfall = null;
  function buildLanterns() {
    for (let i = 0; i < FAMILIES.length; i++) {
      const a = FAMILIES[i].angle + 360 / FAMILIES.length / 2, [x, z] = polar(a, 5.0);
      const g = new T.Group(); g.position.set(x, 0, z);
      const k = new Kit(), brass = '#c9a24a';
      seg(k, '#5a3a22', [0, 0, 0], [0, 1.7, 0], 0.045, 0.035, true);
      seg(k, '#5a3a22', [0, 1.65, 0], [0.3, 1.72, 0], 0.025, 0.02);
      k.add(GEO.cone(0.14, 0.14, 8), brass, [0.3, 1.66, 0], [0, 0, 0], [1, 1, 1], true);
      for (let j = 0; j < 6; j++) { const t = j / 6 * Math.PI * 2; seg(k, brass, [0.3 + Math.cos(t) * 0.1, 1.58, Math.sin(t) * 0.1], [0.3 + Math.cos(t) * 0.1, 1.36, Math.sin(t) * 0.1], 0.008, 0.008); }
      k.add(GEO.cyl(0.12, 0.1, 0.05, 8), brass, [0.3, 1.33, 0], [0, 0, 0], [1, 1, 1], true);
      g.add(k.build());
      const glow = new T.Mesh(new T.SphereGeometry(0.075, 12, 10), new T.MeshBasicMaterial({ color: '#ffd27a', transparent: true, opacity: 0.35 }));
      glow.position.set(0.3, 1.46, 0); g.add(glow);
      const hc = document.createElement('canvas'); hc.width = hc.height = 128;
      const hx = hc.getContext('2d'), hg = hx.createRadialGradient(64, 64, 4, 64, 64, 64);
      hg.addColorStop(0, 'rgba(255,214,130,1)'); hg.addColorStop(1, 'rgba(255,214,130,0)'); hx.fillStyle = hg; hx.fillRect(0, 0, 128, 128);
      const halo = new T.Mesh(new T.PlaneGeometry(1.1, 1.1), new T.MeshBasicMaterial({ map: texFrom(hc), transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending, fog: false }));
      halo.position.set(0.3, 1.46, 0); g.add(halo); billboards.push(halo);
      worldEl.object3D.add(g);
      lanterns.push({ glow, halo });
    }
    // fireflies drifting over the grass at night
    const n = 70, fp = new Float32Array(n * 3), seed0 = [];
    for (let i = 0; i < n; i++) { const [x, z] = polar(rnd() * 360, 2.5 + rnd() * 11); fp[i * 3] = x; fp[i * 3 + 1] = 0.4 + rnd() * 2; fp[i * 3 + 2] = z; seed0.push([x, fp[i * 3 + 1], z, rnd() * 6]); }
    const fg = new T.BufferGeometry(); fg.setAttribute('position', new T.BufferAttribute(fp, 3));
    fireflies = new T.Points(fg, new T.PointsMaterial({ color: '#fff27a', size: 0.09, transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending }));
    worldEl.object3D.add(fireflies);
    tickers.push({ step(t) {
      if (fireflies.material.opacity <= 0.01) return;
      const p = fireflies.geometry.attributes.position;
      for (let i = 0; i < n; i++) { const s = seed0[i]; p.setXYZ(i, s[0] + Math.sin(t * 0.5 + s[3]) * 0.4, s[1] + Math.sin(t * 0.9 + s[3] * 2) * 0.25, s[2] + Math.cos(t * 0.4 + s[3]) * 0.4); }
      p.needsUpdate = true;
    } });
  }

  function buildLandscape() {
    const w = worldEl.object3D;
    const groundMat = new T.MeshStandardMaterial({ map: noiseTexture('#86c95a', ['#74b84c', '#9ad46c', '#68a844', '#a9da7c'], { n: 2600, rep: 12 }), roughness: 1 });
    const near = new T.Mesh(new T.PlaneGeometry(60, 60, 60, 60), groundMat);
    near.rotation.x = -Math.PI / 2; w.add(near);
    const farTex = groundMat.map.clone(); farTex.repeat.set(60, 60); farTex.needsUpdate = true;
    const far = new T.Mesh(new T.RingGeometry(29.9, 200, 64, 6), new T.MeshStandardMaterial({ map: farTex, roughness: 1 }));
    far.rotation.x = -Math.PI / 2; far.position.y = -0.01; w.add(far);
    // Dhofar mountains: rounded and green in the khareef
    const k = new Kit();
    for (let i = 0; i < 24; i++) {
      const a = i * 15 + rnd() * 8, r = 85 + rnd() * 25, h = 10 + rnd() * 10, br = 18 + rnd() * 8;
      const [x, z] = polar(a, r);
      k.add(jitter(new T.SphereGeometry(1, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), 0.12), ['#5f8f45', '#6f9e4f', '#4f7f3a', '#7aa85a'][i % 4], [x, -1, z], [0, rnd() * 3, 0], [br, h, br * 0.8], true);
    }
    for (let i = 0; i < 14; i++) {
      const a = i * (360 / 14) + 12, [x, z] = polar(a, 36 + rnd() * 6);
      k.add(GEO.sph, i % 2 ? '#7fb35a' : '#6fa54e', [x, -3, z], [0, 0, 0], [9, 5, 7], true);
    }
    w.add(k.build());
    buildWaterfall(w);
    buildCenter(w);
    // coconut palms, banana plants and frankincense trees between the enclosures
    const gap = 360 / FAMILIES.length;
    FAMILIES.forEach((f, i) => {
      const a = f.angle + gap / 2;
      for (const off of [-5, 5]) {
        const [x, z] = polar(a + off, 15 + rnd() * 3);
        const p = MODELS.coconut(4.2 + rnd() * 1.6); p.position.set(x, 0, z); p.rotation.y = rnd() * 6; w.add(p);
      }
      const [bx, bz] = polar(a, 12.5); const b = i % 2 ? MODELS.banana() : MODELS.frankincense(); b.position.set(bx, 0, bz); b.rotation.y = rnd() * 6; w.add(b);
    });
    buildLanterns();
    buildTimeDial();
  }

  // Darbat-style waterfall: a green cliff, falling water, a pool with foam
  function buildWaterfall(w) {
    const g = new T.Group(); const [x, z] = polar(180, 32); g.position.set(x, 0, z); g.rotation.y = rad(-180);
    const k = new Kit();

  let panel = null, infoCard = null, hudMesh = null;
  const inXR = () => scene.is('vr-mode') || scene.is('ar-mode');
  function eyeY() { return Math.min(1.75, Math.max(1.0, camPos.y - 0.08)); }
  function frontOf(dist, dirOverride) {
    const dir = dirOverride ? dirOverride.clone() : new T.Vector3();
    if (!dirOverride) scene.camera.getWorldDirection(dir);
    dir.y = 0; if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1); dir.normalize();
    const d = dist * (!inXR() && innerWidth < innerHeight ? 1.7 : 1);
    return { pos: new T.Vector3(camPos.x + dir.x * d, 0, camPos.z + dir.z * d), rotY: Math.atan2(-dir.x, -dir.z) };
  }
  function place(el, dist, dir, halfW) {
    const { pos, rotY } = frontOf(dist, dir);
    pos.y = eyeY();
    el.object3D.position.copy(pos); el.object3D.rotation.set(0, rotY, 0);
    el.object3D.scale.setScalar(0.6);
    tween(0.25, k => el.object3D.scale.setScalar(0.6 + 0.4 * (1 - Math.pow(1 - k, 3))));

  function showPanel(spec, buttons = [], dist = 2.2) {
    closePanel(); closeInfo();

    const card = planeMesh(cardCanvas(spec), spec.w);
    el.object3D.add(card);
    const h = card.userData.h;
    const bw = Math.min(0.95, (spec.w - 0.2) / Math.max(1, buttons.length) - 0.08);
    buttons.forEach((b, i) => {
      const btn = button(b.label, el, { w: bw, h: 0.22, color: b.color || C.sun, text: b.text || C.ink }, b.onClick);
      const n = buttons.length, x = (n - 1 - i - (n - 1) / 2) * (bw + 0.1);
      btn.object3D.position.set(x, -h / 2 - 0.09, 0.02);
    });
    // raise the card so its buttons sit near eye level
    card.position.y = buttons.length ? 0.12 : 0;
    el.object3D.children.forEach(o => { if (o !== card) o.position.y += 0.12; });

  function setHud(text, sub) {
    const W = 900, H = 170, c = document.createElement('canvas'); c.width = W; c.height = H;

    x.fillStyle = C.red; x.fillRect(H / 2, 4, 90, 8); x.fillStyle = '#fff'; x.fillRect(H / 2 + 90, 4, 90, 8); x.fillStyle = C.green; x.fillRect(H / 2 + 180, 4, 90, 8);
    x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
    let fs = sub ? 54 : 62; x.font = `800 ${fs}px ${FONT}`;
    while (x.measureText(text).width > W - 90 && fs > 26) { fs -= 3; x.font = `800 ${fs}px ${FONT}`; }
    x.fillText(text, W / 2, sub ? H * 0.37 : H / 2);

      k.ell('#e9a820', [s * 1.45, 2.95, 0], [0.09, 0.09, 0.09]);

  function startGame(replay) {
    closePanel(); closeInfo(); clearStage(); stopTimer();
    mode = 'game';
    game = { rounds: shuffle(FAMILIES.slice()).slice(0, GAME_ROUNDS), i: 0, stars: 0, misses: 0, lost: null, lostEl: null, busy: false, replay };

  // Mission 2, in the body: a lost young sits on the grass crying; the child picks it up (trigger /
  // mouse button), carries it through the park towards its mother's call, and puts it down in her
  // enclosure. Touching the right mother or sign still works for children who can't carry yet.
  function nextRound() {
    if (game.lostEl) { game.lostEl.remove(); game.lostEl = null; game.lost = null; }
    signEls.forEach(b => pulse(b, false));
    if (game.i >= game.rounds.length) return game.replay ? summary() : roundsDone();
    const f = game.rounds[game.i];
    game.misses = 0; game.busy = false;
    const g = new T.Group();
    const model = youngModel(f);
    const size = new T.Box3().setFromObject(model).getSize(new T.Vector3());
    const h = size.y, s = 0.55 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(s); g.add(model);
    // a soft glowing spot under it so it is easy to find
    const sk = new Kit(); sk.add(GEO.tor(0.36, 0.03), C.coral, [0, 0.02, 0], [Math.PI / 2, 0, 0]); g.add(sk.build());
    const qc = document.createElement('canvas'); qc.width = qc.height = 128;
    const qx = qc.getContext('2d'); qx.fillStyle = C.coral; qx.beginPath(); qx.arc(64, 64, 58, 0, Math.PI * 2); qx.fill();
    qx.fillStyle = '#fff'; qx.font = `800 96px ${FONT}`; qx.textAlign = 'center'; qx.textBaseline = 'middle'; qx.fillText('؟', 64, 70);
    const q = planeMesh(qc, 0.24); q.position.set(0.3, h * s + 0.2, 0); g.add(q); billboards.push(q);
    // the timer ring
    const tc = document.createElement('canvas'); tc.width = tc.height = 180;
    const ring = planeMesh(tc, 0.3); ring.position.set(-0.3, h * s + 0.22, 0); g.add(ring); billboards.push(ring);
    const hit = new T.Mesh(new T.CylinderGeometry(0.4, 0.4, h * s + 0.4, 12), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    hit.position.y = (h * s + 0.4) / 2; g.add(hit);
    const { pos, rotY } = frontOf(1.5);
    const el = entityWith(g, uiEl);

      setHud(`خُذْ ${f.young} إِلَى أُمِّهِ`, 'اتْرُكْهُ دَاخِلَ حَظِيرَةِ أُمِّهِ');
    }, (el2, w, cursorEl) => {

    });
    let shown = -1; game.left = ROUND_TIME;
    const draw = sec => {
      const x = tc.getContext('2d'), k = Math.max(0, game.left / ROUND_TIME), warn = sec <= 10;
      x.clearRect(0, 0, 180, 180);
      x.fillStyle = '#fffdf7'; x.beginPath(); x.arc(90, 90, 84, 0, Math.PI * 2); x.fill();
      x.lineWidth = 16; x.strokeStyle = '#e8e1d2'; x.beginPath(); x.arc(90, 90, 68, 0, Math.PI * 2); x.stroke();
      x.strokeStyle = warn ? C.red : C.leaf; x.lineCap = 'round'; x.beginPath(); x.arc(90, 90, 68, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); x.stroke();
      x.fillStyle = warn ? C.red : C.ink; x.font = `800 64px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(toAr(sec), 90, 98);

    draw(ROUND_TIME);
    let nextCall = 3;
    game.timer = { step(t, d) {

    setHud(`مَنْ أُمُّ ${inZone(f.young)}؟`, `امْسِكْهُ وَخُذْهُ إِلَيْهَا • ${toAr(game.i + 1)} / ${toAr(game.rounds.length)}`);
    setMood('think'); say(game.i === 0 && !game.replay ? ['q_' + f.id, 'listen'] : 'q_' + f.id);
  }

  function stopTimer() { if (game && game.timer) { const i = tickers.indexOf(game.timer); if (i >= 0) tickers.splice(i, 1); game.timer = null; } }
  function timeUp() {

  // the young goes to its mother: it walks the last bit if it was carried, or flies there
  function flyHome(c, happy, carried = false) {
    const el = game.lostEl, model = game.model, from = new T.Vector3(); model.getWorldPosition(from);

  // ---------- A small stage in front of the child (missions 3–5) ----------

  // ---------- Mission 3: the young grow up ----------
  const GROW = [

  // ---------- Mission 4: count the young ----------

  const COUNT = [

    { id: 'human', q: 'كَمْ طِفْلًا عِنْدَ الْأُمِّ؟', res: () => 'عِنْدَ الْأُمِّ طِفْلٌ وَاحِدٌ' },

  console.assert(fam('duck').count === 8 && fam('rabbit').count === 9 && fam('human').count === 1, 'counting data does not match the book');
  console.assert(/ثَمَانِيَةُ/.test(L.lines.c_duck) && /تِسْعَةُ/.test(L.lines.c_rabbit), 'counting lines do not match the data');
  function countIntro() {
    goHome();
    mode = 'intro4'; clearStage();
    showPanel({
      w: 2.1, accent: C.sky, icon: '🔢', title: 'الْمَهَمَّةُ الرَّابِعَةُ: عُدَّ الصِّغَارَ',

    }, [{ label: 'هَيَّا نَعُدُّ', color: C.sky, text: '#fff', onClick: () => { mode = 'count'; makeStage(3.0, { platform: false }); countSet(0); } }]);

  function slotCanvas(n, lit) {
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const x = c.getContext('2d');
    x.fillStyle = lit ? C.sky : 'rgba(255,253,247,.92)'; x.beginPath(); x.arc(80, 80, 72, 0, Math.PI * 2); x.fill();
    x.lineWidth = 8; x.strokeStyle = lit ? '#ffffff' : '#b8c4cc'; x.stroke();
    x.fillStyle = lit ? '#ffffff' : '#9aa7b0'; x.font = `800 96px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(toAr(n), 80, 90);
    return c;

  function countSet(ci) {

    stage.items = []; stage.ui.forEach(e => e.remove()); stage.ui = [];
    if (stage.btn) { stage.btn.remove(); stage.btn = null; }
    // the counting row: a bench with one numbered spot per young, counted right to left like Arabic
    const gap = total > 1 ? Math.min(0.42, 3.4 / total) : 0.5, benchW = gap * total + 0.25;
    const bk = new Kit();
    bk.add(GEO.box(benchW, 0.07, 0.4), G('#8a5a34', '#b08050'), [0, 0.36, -1.05], [0, 0, 0], [1, 1, 1], true);
    for (const s of [-1, 1]) bk.add(GEO.box(0.07, 0.36, 0.34), '#7a4a2a', [s * (benchW / 2 - 0.06), 0.18, -1.05], [0, 0, 0], [1, 1, 1], true);
    const bench = bk.build(); stage.el.object3D.add(bench); stage.items.push(bench);
    const slots = [];
    for (let i = 0; i < total; i++) {
      const x = ((total - 1) / 2 - i) * gap;
      const tag = planeMesh(slotCanvas(i + 1, false), Math.min(0.3, gap * 0.8));
      tag.position.set(x, 0.2, -0.83); stage.el.object3D.add(tag); stage.items.push(tag);

    const parent = MODELS[PARENT[f.id]]();

      const holder = withHit(m, 0.24).holder;

      el.object3D.rotation.y = (rnd() - 0.5) * 1.4;
      stage.ui.push(el);
      const ph = rnd() * 6, idle = { step(t) { if (!el._counted) m.position.y = Math.max(0, Math.sin(t * 3 + ph)) * 0.05; } };
      idlers.push(idle); holder.userData.idle = idle; stage.items.push(holder);
      clickable(el, () => {

          el.object3D.rotation.y = 0; m.position.y = 0;

  // =====================================================================
  // Immersion: walk (teleport), grab and carry, feel (haptics), hear in 3D, a living world,
  // and becoming as small as a duckling.
  // =====================================================================
  const rigEl = document.getElementById('rig');
  const hands = [document.getElementById('handR'), document.getElementById('handL')];
  const WALK_R = 17; // how far from the centre the child may walk

  // --- comfort fade (teleports and big changes blink through black) ---
  const fader = new T.Mesh(new T.SphereGeometry(0.25, 16, 12), new T.MeshBasicMaterial({ color: '#000', side: T.BackSide, transparent: true, opacity: 0, depthTest: false, depthWrite: false, fog: false }));
  fader.renderOrder = 999; fader.visible = false;
  camEl.object3D.add(fader);
  function blink(mid, dur = 0.18) {
    fader.visible = true;
    tween(dur, k => { fader.material.opacity = k; }, () => { mid(); tween(dur, k => { fader.material.opacity = 1 - k; }, () => { fader.visible = false; }); });
  }

  // --- haptics: a short buzz in the controller that did something ---
  function buzz(cursorEl, strength = 0.4, ms = 50) {
    try {
      const src = cursorEl && cursorEl.components && cursorEl.components['tracked-controls'] && cursorEl.components['tracked-controls'].controller;
      const act = src && src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0];
      if (act) act.pulse(strength, ms);
    } catch (e) { /* no haptics */ }
  }
  let lastCursor = null;
  document.addEventListener('mousedown', e => { if (e.detail && e.detail.cursorEl) lastCursor = e.detail.cursorEl; }, true);
  for (const h of hands) h.addEventListener('mouseenter', () => buzz(h, 0.12, 15));

  // --- hearts: when a child pets an animal ---
  function hearts(pos) {
    const icons = ['💖', '💛', '💕', '🧡'];
    for (let i = 0; i < 10; i++) {
      const c = document.createElement('canvas'); c.width = c.height = 96;
      drawEmoji(c.getContext('2d'), icons[i % 4], 48, 48, 72);
      const p = planeMesh(c, 0.2);
      p.position.copy(pos); scene.object3D.add(p); billboards.push(p);
      const v = [(Math.random() - 0.5) * 0.8, 0.8 + Math.random() * 0.8, (Math.random() - 0.5) * 0.8];
      tween(1.4, (k, d) => { p.position.x += v[0] * d; p.position.y += v[1] * d; p.position.z += v[2] * d; p.material.opacity = 1 - k; p.scale.setScalar(1 + k * 0.5); },
        () => { scene.object3D.remove(p); billboards.splice(billboards.indexOf(p), 1); });

  // --- 3D sound: animal voices come from where the animal is ---
  function updateListener() {
    if (!actx || !scene.camera) return;
    const l = actx.listener, m = scene.camera.matrixWorld, p = new T.Vector3().setFromMatrixPosition(m);
    const f = new T.Vector3(0, 0, -1).transformDirection(m), u = new T.Vector3(0, 1, 0).transformDirection(m);
    if (l.positionX) {
      l.positionX.value = p.x; l.positionY.value = p.y; l.positionZ.value = p.z;
      l.forwardX.value = f.x; l.forwardY.value = f.y; l.forwardZ.value = f.z; l.upX.value = u.x; l.upY.value = u.y; l.upZ.value = u.z;
    } else { l.setPosition(p.x, p.y, p.z); l.setOrientation(f.x, f.y, f.z, u.x, u.y, u.z); }
  }
  tickers.push({ step: updateListener });
  let soundAt = null; // world position for the next call() — set by voiceAt()
  function voiceAt(pos, fn) { soundAt = pos; soundRipple(pos); try { fn(); } finally { soundAt = null; } }
  function worldPosOf(el, up = 0.5) { const v = new T.Vector3(); el.object3D.getWorldPosition(v); v.y += up; return v; }

  // --- walking: push the thumbstick forward, aim the arc, let go to jump there ---
  // the arc is a row of glowing beads (thin lines are almost invisible in a headset)
  const arcMat = new T.MeshBasicMaterial({ color: '#ffd166', fog: false });
  const arc = new T.Group(), beads = [], beadGeo = new T.SphereGeometry(0.035, 8, 6);
  for (let i = 0; i < 40; i++) { const b = new T.Mesh(beadGeo, arcMat); b.scale.setScalar(1 - i / 60); arc.add(b); beads.push(b); }
  arc.visible = false; scene.object3D.add(arc);
  const marker = new T.Group();
  const mk = new Kit(); mk.add(GEO.tor(0.32, 0.03), '#ffd166', [0, 0.03, 0], [Math.PI / 2, 0, 0]); mk.add(GEO.cyl(0.26, 0.26, 0.01, 24), '#fff3c4', [0, 0.02, 0]);
  marker.add(mk.build());
  const footprint = new T.Mesh(new T.PlaneGeometry(0.45, 0.45), new T.MeshBasicMaterial({ map: (() => { const c = document.createElement('canvas'); c.width = c.height = 128; drawEmoji(c.getContext('2d'), '👣', 64, 64, 96); return texFrom(c); })(), transparent: true, depthWrite: false }));
  footprint.rotation.x = -Math.PI / 2; footprint.position.y = 0.04; marker.add(footprint);
  marker.visible = false; scene.object3D.add(marker);
  let aimHand = null, aimTarget = null, aimOk = false;
  function canWalkTo(p) {
    if (Math.hypot(p.x, p.z) > WALK_R) return false;
    // not into the middle of an animal: keep 0.8 m from any parent
    for (const pel of parentEls.values()) { const w = worldPosOf(pel, 0); if (Math.hypot(w.x - p.x, w.z - p.z) < 0.8) return false; }
    return true;
  }
  function updateAim() {
    if (!aimHand) return;
    const rc = aimHand.components.raycaster && aimHand.components.raycaster.raycaster;
    if (!rc) return;
    const o = rc.ray.origin.clone(), d = rc.ray.direction.clone();
    if (![o.x, o.y, o.z, d.x, d.y, d.z].every(Number.isFinite) || d.lengthSq() < 0.5) return;
    const v = 7.5, g = 9.8; let hit = null, last = o.clone();
    for (let i = 0; i < 40; i++) {
      const t = i * 0.05, p = new T.Vector3(o.x + d.x * v * t, o.y + d.y * v * t - 0.5 * g * t * t, o.z + d.z * v * t);
      // beads follow the curve until it touches the ground; the rest are hidden
      beads[i].visible = !hit && i >= 2;
      if (!hit && p.y <= 0) { const k = last.y / (last.y - p.y); hit = last.clone().lerp(p, k); hit.y = 0; }
      if (beads[i].visible) beads[i].position.set(p.x, Math.max(0.02, p.y), p.z);
      last = p;
    }
    aimTarget = hit; aimOk = !!hit && canWalkTo(hit);
    arc.visible = true; arcMat.color.set(aimOk ? '#ffd166' : '#e76f51');
    marker.visible = !!hit; if (hit) { marker.position.copy(hit); footprint.material.opacity = aimOk ? 1 : 0.3; }
  }
  tickers.push({ step: updateAim });
  function walkTo(target, faceTo) {
    const cam = new T.Vector3(); camEl.object3D.getWorldPosition(cam);
    blink(() => {
      rigEl.object3D.position.x += target.x - cam.x; rigEl.object3D.position.z += target.z - cam.z;
      if (faceTo) {
        // turn so the child faces faceTo
        const o = rigEl.object3D, want = Math.atan2(-(faceTo.x - target.x), -(faceTo.z - target.z));
        const camDir = new T.Vector3(); scene.camera.getWorldDirection(camDir);
        const have = Math.atan2(-camDir.x, -camDir.z);
        const before = new T.Vector3(); camEl.object3D.getWorldPosition(before);
        o.rotation.y += want - have; o.updateMatrixWorld(true);
        const after = new T.Vector3(); camEl.object3D.getWorldPosition(after);
        o.position.x += before.x - after.x; o.position.z += before.z - after.z;
      }
    });
    sfx.pop();
  }
  for (const h of hands) h.addEventListener('thumbstickmoved', e => {
    const { x, y } = e.detail;
    if (y < -0.6 && Math.abs(x) < 0.55 && mode !== 'intro' && !small.on) { aimHand = h; }
    else if (aimHand === h && Math.abs(y) < 0.3) {
      if (aimOk && aimTarget) { walkTo(aimTarget); buzz(h, 0.3, 40); if (!walked) { walked = true; } }
      aimHand = null; aimTarget = null; arc.visible = false; marker.visible = false;
    }
  });
  let walked = false;
  // on screen: arrow up/down (or W/S) steps forward and back
  window.addEventListener('keydown', e => {
    if (mode === 'intro' || small.on) return;
    const k = e.key.toLowerCase(), dir = k === 'arrowup' || k === 'w' ? 1 : k === 'arrowdown' || k === 's' ? -1 : 0;
    if (!dir) return;
    const f = new T.Vector3(); scene.camera.getWorldDirection(f); f.y = 0; f.normalize().multiplyScalar(0.7 * dir);
    const cam = new T.Vector3(); camEl.object3D.getWorldPosition(cam); cam.add(f); cam.y = 0;
    if (canWalkTo(cam)) { rigEl.object3D.position.x += f.x; rigEl.object3D.position.z += f.z; }
  });

  // --- a living world: parents watch the child, the young wander, ducks swim round the pond ---
  function liveAnimals() {
    for (const f of FAMILIES) {
      const pel = parentEls.get(f.id), yel = creatureEls.get(f.id), zone = zoneGroups.get(f.id).object3D;
      const home = new T.Vector3(...YPOS[f.id]), st = { target: home.clone(), wait: rnd() * 3, ph: rnd() * 6 };
      const local = new T.Vector3();
      tickers.push({ step(t, d) {
        if (reduceMotion || grab.el === yel) return;
        local.copy(camPos); zone.worldToLocal(local);
        if (f.id === 'duck') {
          // mother duck and her ducklings swim round the pond, in a line
          const a = t * 0.12 + st.ph, r = 1.7;
          pel.object3D.position.set(Math.cos(a) * r, 0.04, Math.sin(a) * r); pel.object3D.rotation.y = -a + Math.PI;
          const b = a - 0.6; yel.object3D.position.set(Math.cos(b) * r, 0.04, Math.sin(b) * r); yel.object3D.rotation.y = -b + Math.PI;
          return;
        }
        // the parent turns its head (body) towards a child who comes close
        const pp = pel.object3D.position, dp = Math.hypot(local.x - pp.x, local.z - pp.z);
        const want = dp < 5 ? Math.atan2(local.x - pp.x, local.z - pp.z) : 0.35;
        pel.object3D.rotation.y += (want - pel.object3D.rotation.y) * Math.min(1, d * 1.5);
        if (f.id === 'human' || f.id === 'rabbit') return;
        // the young wanders near its parent; it comes to the child if the child is close
        const yp = yel.object3D.position, dy = Math.hypot(local.x - yp.x, local.z - yp.z);
        if (dy < 2.2) { st.target.set(local.x, 0, local.z).sub(yp).setLength(Math.max(0, dy - 0.9)).add(yp); }
        else if ((st.wait -= d) <= 0 && yp.distanceTo(st.target) < 0.05) {

  // a small stylised falcon — Salem's companion, grown from an egg as the child explores
  function companionModel(stage) {
    const k = new Kit(), tan = '#c88a4a', dark = '#8a5a2a', cream = '#f4e6c8', speck = '#a87840', eyeC = '#2a1810';
    if (stage === 0) {
      k.ell(cream, [0, 0.09, 0], [0.09, 0.11, 0.095]);
      for (const [x, y, z] of [[0.03, 0.14, 0.04], [-0.04, 0.06, -0.03], [0.02, 0.03, 0.06]]) k.ell(speck, [x, y, z], [0.012, 0.01, 0.012]);
      return k.build();
    }
    const s = stage === 1 ? 0.6 : stage === 2 ? 0.85 : 1.1;
    k.ell(tan, [0, 0.11 * s, 0], [0.11 * s, 0.11 * s, 0.14 * s]);
    k.ell(cream, [0, 0.07 * s, 0.06 * s], [0.08 * s, 0.075 * s, 0.09 * s]);
    k.ell(tan, [0, 0.19 * s, 0.08 * s], [0.075 * s, 0.075 * s, 0.075 * s]);
    for (const sx of [-1, 1]) { k.ell('#ffffff', [sx * 0.035 * s, 0.2 * s, 0.13 * s], [0.024 * s, 0.024 * s, 0.02 * s]); k.ell(eyeC, [sx * 0.035 * s, 0.2 * s, 0.145 * s], [0.013 * s, 0.013 * s, 0.008 * s]); }
    k.add(GEO.cone(0.02 * s, 0.045 * s, 8), dark, [0, 0.185 * s, 0.155 * s], [Math.PI / 2, 0, 0]);
    // wings: folded at stage 1, half-open at 2, spread at 3

    for (const sx of [-1, 1]) k.ell(dark, [sx * 0.1 * s, 0.1 * s, -0.02 * s], [0.05 * s, 0.09 * s * (0.6 + wingA * 0.5), 0.13 * s], [0, 0, sx * (0.25 + wingA * 0.9)]);
    if (stage >= 2) for (const sx of [-1, 1]) for (let i = 0; i < 3; i++) k.ell(speck, [sx * (0.12 + i * 0.03) * s, 0.03 * s, -0.2 * s], [0.018 * s, 0.012 * s, 0.05 * s], [0, 0, sx * 0.3]);
