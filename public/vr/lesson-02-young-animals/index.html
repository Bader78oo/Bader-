      teach.busy = true; sfx.good(); setMood('cheer');
      const y0 = teach.pupil.position.y;
      tween(0.5, k => { teach.pupil.position.y = y0 + Math.sin(k * Math.PI) * 0.3; }, () => { teach.pupil.position.y = y0; });
      say('teachRight');
      setTimeout(() => { teach.busy = false; teach.i++; teachRound(); }, 1600);
    } else { sfx.bad(); setMood('think'); say('teachWrong'); }
  }
  function teachDone() {
    mode = 'teachDone'; sfx.good();
    const top = stage.pos.clone(); top.y = 1.2; burst(top);
    clearStage();
    showPanel({ w: 1.8, accent: '#7a5cff', icon: '🏅', title: 'صِرْتَ مُعَلِّمًا صَغِيرًا!', blocks: [{ type: 'stars', n: TEACH_N, total: TEACH_N }] },
      [{ label: 'رُجُوعٌ لِلْمُلَخَّصِ', onClick: summary }]);
    setMood('cheer'); say('teachDone');
  }

  // =====================================================================
  // Games menu: jump straight into any activity, any time — no need to play the whole lesson
  // in order. Also clears whatever UI/timer the child was in before switching.
  // =====================================================================
  function hardReset() {
    if (activeCancel) activeCancel();
    stopTimer();
    closePanel(); closeInfo(); closeMagicWords_(); closeAskSalem_(); clearStage();
    if (teach && teach.opts) teach.opts.forEach(o => o.remove()); teach = null;
    if (game && game.lostEl) { game.lostEl.remove(); game.lostEl = null; game.lost = null; }
    if (askUi) { askUi.el.remove(); askUi = null; }
    hideHud(); stopVoice();
  }
  function closeMagicWords_() { if (magicUi) { magicUi.el.remove(); magicUi = null; } clearMagic(); }
  function closeAskSalem_() { if (askUi) { askUi.el.remove(); askUi = null; } }

  const MENU_ITEMS = [
    { icon: '🔍', label: 'اكْتَشِفِ الصِّغَارَ', fn: exploreIntro },
    { icon: '🧭', label: 'مَنْ أُمِّي؟', fn: gameIntro },
    { icon: '🌱', label: 'الصَّغِيرُ يَكْبَرُ', fn: growIntro },
    { icon: '🔢', label: 'عُدَّ الصِّغَارَ', fn: countIntro },
    { icon: '🏡', label: 'حَاضِنَةُ الْجَدْيِ', fn: nestIntro },
    { icon: '🪄', label: 'الْكَلِمَاتُ السِّحْرِيَّةُ', fn: startMagicWords },
    { icon: '🎓', label: 'عَلِّمْ صَغِيرِي', fn: teachIntro },
    { icon: '🎙️', label: 'تَكَلَّمْ مَعَ سَالِمٍ', fn: startAskSalem },
    { icon: '📖', label: 'دَفْتَرِي', fn: showJournal },
    { icon: '🦅', label: 'رَفِيقِي', fn: showCompanion },
    { icon: '🎓', label: 'مَاذَا تَعَلَّمْتُ؟', fn: summary },
    { icon: '🏠', label: 'مِنَ الْبِدَايَةِ', fn: welcome },
  ];
  let menuTiles = [];
  function openLevelMenu() {
    hardReset(); goHome();
    mode = 'menu'; menuTiles = [];
    const { pos, rotY } = frontOf(2.6);
    const el = document.createElement('a-entity'); uiEl.appendChild(el);
    el.object3D.position.set(pos.x, eyeY(), pos.z); el.object3D.rotation.y = rotY;
    const spec = { w: 2.3, accent: '#7a5cff', icon: '🎮', title: 'قَائِمَةُ الْأَلْعَابِ', blocks: [{ t: 'اخْتَرْ أَيَّ لُعْبَةٍ تَبِي تَلْعَبُهَا الْآنَ:', size: 0.058 }] };
    const card = planeMesh(cardCanvas(spec), spec.w);
    const h = card.userData.h; card.position.y = h * 0.38; el.object3D.add(card);
    const cols = 4, w = 0.5, gap = 0.06, rowH = 0.26;
    const top = -h * 0.62 - 0.05;
    MENU_ITEMS.forEach((it, i) => {
      const row = Math.floor(i / cols), col = i % cols, n = Math.min(cols, MENU_ITEMS.length - row * cols);
      const c = buttonCanvas(`${it.icon} ${it.label}`, { color: '#fffdf7', text: C.ink, w: 1.0, h: 0.28 });
      const tile = entityWith(planeMesh(c, w), el);
      tile.object3D.position.set((col - (n - 1) / 2) * (w + gap), top - row * rowH, 0.02);
      clickable(tile, () => { el.remove(); it.fn(); }, { hover: 1.08 });
      menuTiles.push(tile);
    });
    const back = button('إِغْلَاقٌ', el, { w: 0.7, h: 0.22, color: '#dff1ff', text: C.ink }, () => el.remove());
    back.object3D.position.set(0, top - Math.ceil(MENU_ITEMS.length / cols) * rowH - 0.06, 0.02);
    salemBeside(new T.Vector3(pos.x, 0, pos.z), rotY, 1.15);
    setMood('point'); say('menuIntro');
  }

  // =====================================================================
  // Hand tracking, v2: near-field touch for the one grabbable object (the lost young), a
  // head-gaze pointer + centre dot for far things (menus, buttons, panels — a bare hand can't
  // reach those), and a pinch to confirm either. Walking still happens when neither is targeted.
  // =====================================================================
  const HAND_GRAB_REACH = 0.32; // metres, measured to the object's bounding box, not just its centre
  const _box = new T.Box3();
  function nearestGrabbable(handPos) {
    const el = game && game.lostEl;
    if (!el || !el.object3D) return null;
    _box.setFromObject(el.object3D);
    if (_box.isEmpty()) return null;
    return _box.distanceToPoint(handPos) < HAND_GRAB_REACH ? el : null;
  }
  // the centre-of-view dot: a 3D mesh riding on the camera (HTML overlays don't render inside
  // an immersive WebXR session — only the scene itself does), so it always sits in the middle
  // of what the child sees and works as a gaze cursor for things too far to touch.
  let gazeDot = null, gazeRay = null, gazeTarget = null;
  function buildGazeDot() {
    gazeDot = new T.Mesh(new T.RingGeometry(0.006, 0.011, 20), new T.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.85, depthTest: false, fog: false }));
    gazeDot.position.set(0, 0, -0.6); gazeDot.renderOrder = 998;
    camEl.object3D.add(gazeDot);
    gazeRay = document.createElement('a-entity');
    gazeRay.setAttribute('raycaster', 'objects: .clickable; far: 60; interval: 100');
    camEl.appendChild(gazeRay);
    tickers.push({ step() {
      const rc = gazeRay.components.raycaster;
      const hit = rc && rc.intersectedEls && rc.intersectedEls[0];
      gazeTarget = (hit && hit.object3D && hit.object3D.visible !== false) ? hit : null;
      gazeDot.material.color.set(gazeTarget ? '#ffd166' : '#ffffff');
      gazeDot.scale.setScalar(gazeTarget ? 1.8 : 1);
    } });
  }
  function handWalk(he) {
    const dir = new T.Vector3(); scene.camera.getWorldDirection(dir);
    const o = new T.Vector3(); camEl.object3D.getWorldPosition(o);
    const v = 7.5, g = 9.8; let hit = null, last = o.clone();
    for (let i = 0; i < 40 && !hit; i++) {
      const t = i * 0.05, p = new T.Vector3(o.x + dir.x * v * t, o.y + dir.y * v * t - 0.5 * g * t * t, o.z + dir.z * v * t);
      if (p.y <= 0) { const k = last.y / (last.y - p.y); hit = last.clone().lerp(p, k); hit.y = 0; }
      last = p;
    }
    if (hit && canWalkTo(hit)) { walkTo(hit); buzz(he, 0.3, 40); }
  }
  function setupHandInteract() {
    buildGazeDot();
    // a light glow on the lost young once a hand is close enough to grab it
    tickers.push({ step() {
      if (!game || !game.lostEl || grab.el) return;
      const hL = document.getElementById('handTL'), hR = document.getElementById('handTR');
      const near = [hL, hR].some(h => {
        if (!h || !h.object3D.visible) return false;
        const hp = new T.Vector3(); h.object3D.getWorldPosition(hp);
        return !!nearestGrabbable(hp);
      });
      pulse(game.lostEl, near);
    } });
    for (const id of ['handTL', 'handTR']) {
      const he = document.getElementById(id);
      if (!he) continue;
      let held = null;
      he.addEventListener('pinchstarted', () => {
        const hp = new T.Vector3(); he.object3D.getWorldPosition(hp);
        const grabTarget = nearestGrabbable(hp);
        if (grabTarget) {
          held = grabTarget; buzz(he, 0.4, 50); pulse(grabTarget, false);
          grabTarget.emit('mousedown', { cursorEl: he }, false);
        } else if (gazeTarget) {
          held = gazeTarget; buzz(he, 0.25, 30);
          if (held._onDrop) held.emit('mousedown', { cursorEl: he }, false);
        } else handWalk(he);
      });
      he.addEventListener('pinchended', () => {
        if (held) { if (held._onDrop) held.emit('mouseup', { cursorEl: he }, false); else held.emit('click', {}, false); }
        held = null;
      });
    }
  }

 // Developer view: ?gallery lines up every model in front of the camera.
  function gallery() {
    document.getElementById('topbar').hidden = true;
    const ids = ['lion', 'cub', 'elephant', 'calf', 'camel', 'camelCalf', 'goat', 'kid', 'duck', 'duckling', 'rabbit', 'bunny',
      'mother', 'baby', 'cradle', 'salem', 'man', 'hay', 'bowl', 'hut', 'ball', 'lolly', 'car', 'acacia', 'coconut', 'banana', 'frankincense'];
    window.__gallery = ids.map((id, i) => {
      const x = (i - ids.length / 2) * 3, z = -20;
      if (id === 'salem') { const s = buildSalem(); s.root.position.set(x, 0, z); scene.object3D.add(s.root); return { id, x, z, h: 1.4 }; }
      const m = MODELS[id](); m.scale.setScalar(YSIZE[id] || PSIZE[id] || 1); m.position.set(x, 0, z); m.rotation.y = 0.6; scene.object3D.add(m);
      return { id, x, z, h: heightOf(m) };
    });
  }

  // Test hooks (?test): lets the automated check drive the lesson without aiming a pointer.
  if (TEST) window.__t = {
    mode: () => mode, game: () => game, stage: () => stage, panel: () => panel, FAMILIES,
    parentEls, creatureEls, signEls,
    buttons: () => [...(panel ? panel.querySelectorAll('.clickable') : [])],
    stageEls: () => stage ? [...stage.el.querySelectorAll('.clickable')] : [],
    jump: name => ({ grow: growIntro, count: countIntro, nest: nestIntro })[name](),
    time: () => cycleTime(), sky: () => sky.name,
    carryTo: id => { const el = game.lostEl, f = fam(id), [x, z] = polar(f.angle, ZONE_R - 1.2); el._onDrop(el, new T.Vector3(x, 0, z), null); },
    walk: (x, z) => walkToNow(new T.Vector3(x, 0, z)), small: () => becomeSmall(), big: () => becomeBig(),
    aim: on => { aimHand = on ? scene : null; if (!on) { arc.visible = false; marker.visible = false; } },
    magic: () => startMagicWords(), sayWord: t => (mode === 'magic' ? (matchWord(t) ? summonWord(matchWord(t)) : onMagicMiss()) : null), magicKey: k => summonWord(k),
    micTap: () => magicUi && magicUi.mic && magicUi.mic.el.emit('click'), askMicTap: () => askUi && startAsking(),
    micBroken: () => micBroken, turn: dir => rigEl.components['snap-turn'].turn(dir),
    gazeAt: el => { gazeTarget = el; }, gazeTarget: () => gazeTarget, handPinch: (id, on) => document.getElementById(id).emit(on ? 'pinchstarted' : 'pinchended'),
    ask: () => startAskSalem(), askText: q => askSalem(q), askUrl: () => SALEM_BRAIN_URL,
    menu: () => openLevelMenu(), menuItems: () => MENU_ITEMS.map(i => i.label), menuPick: i => menuTiles[i].emit('click'),
    companion: () => ({ stage: companion.stage, xp: hub.xp() }), showCompanion, journal: () => hub.journalList(), showJournal,
    teach: () => teachIntro(), teachStart: startTeach, teachPick: id => { const f = teach.rounds[teach.i]; teachAnswer(f, fam(id)); },
    portal: () => onPortal('رِحْلَةِ الْبِيئَاتِ الْمَحَلِّيَّةِ', '../lesson-01-local-habitats/'), portalWent: () => window.__portalWent, portalConfirm: () => panel.querySelectorAll('.clickable')[0].emit('click'),
    arcInfo: () => { const r = scene.components.raycaster.raycaster.ray; return { vis: arc.visible, beads: beads.filter(b => b.visible).length, marker: marker.visible, at: marker.position.toArray().map(v => +v.toFixed(2)), ok: aimOk, o: r.origin.toArray().map(v => +v.toFixed(2)), d: r.direction.toArray().map(v => +v.toFixed(2)) }; },
  };

  // ---------- Boot ----------
  async function boot() {
    const timeout = ms => new Promise(r => setTimeout(r, ms));
    await Promise.race([
      Promise.all([document.fonts.load(`800 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`600 40px "Baloo Bhaijaan 2"`, 'عربي'),
        document.fonts.load(`700 40px "Baloo Bhaijaan 2"`, 'عربي'), document.fonts.load(`40px "Noto Color Emoji"`, '🐪')]),
      timeout(3500),
    ]).catch(() => {});
    try { maxAniso = scene.renderer.capabilities.getMaxAnisotropy(); } catch (e) { /* keep default */ }
    buildSky();
    if (GALLERY) { buildLandscape(); gallery(); document.getElementById('loader').hidden = true; return; }
    buildLandscape();
    buildZones();
    liveAnimals();
    if (!GALLERY) {
      hub.recordVisit(LESSON_ID);
      buildCompanionEntity();
      buildPortal('رِحْلَةِ الْبِيئَاتِ الْمَحَلِّيَّةِ', '١ — الْبِيئَاتُ الْمَحَلِّيَّةُ 🌍', '../lesson-01-local-habitats/');
      buildPortal('سَفِينَةِ مَسْقَطَ الْغَارِقَةِ', '٣ — سَفِينَةُ مَسْقَطَ الْغَارِقَةُ 🚢', '../lesson-03-sunken-ship/', 90);
    }
    salem = buildSalem(); salem.baseY = 0;
    scene.object3D.add(salem.root);
    document.getElementById('timeBtn').addEventListener('click', () => { unlockAudio(); cycleTime(); });
    document.getElementById('menuBtn').addEventListener('click', () => { unlockAudio(); openLevelMenu(); });
    const snapTurn = () => rigEl.components['snap-turn'];
    document.getElementById('turnL').addEventListener('click', () => { unlockAudio(); snapTurn().turn(1); });
    document.getElementById('turnR').addEventListener('click', () => { unlockAudio(); snapTurn().turn(-1); });
    scene.addEventListener('enter-vr', setupHandInteract, { once: true });
    if (TEST) setupHandInteract(); // no real WebXR session in the automated check to fire enter-vr
    window.addEventListener('keydown', e => { if ((e.key === 't' || e.key === 'T') && mode !== 'intro') { unlockAudio(); cycleTime(); } });
    const begin = () => {
      document.getElementById('loader').hidden = true;
      unlockAudio();
      primeMicPermission();
      setTimeout(intro, 150);
    };
    document.getElementById('loading').hidden = true;
    document.getElementById('start').hidden = false;
    document.getElementById('go').addEventListener('click', begin);
    const vrBtn = document.getElementById('govr');
    if (navigator.xr && navigator.xr.isSessionSupported) navigator.xr.isSessionSupported('immersive-vr').then(ok => { vrBtn.hidden = !ok; }).catch(() => {});
    vrBtn.addEventListener('click', () => { try { scene.enterVR(); } catch (e) { /* stays on screen */ } begin(); });
    if (TEST) begin();
  }
  if (scene.hasLoaded) boot(); else scene.addEventListener('loaded', boot);
})();
</script>
