<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"></head><body>
<title>هبوب رالي عُمان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D race; instrument cluster in the corners, slanted racing plates; menu is a pit-wall panel on the right. */
:root{
  color-scheme:dark;
  --ink:#0d0f12;            /* asphalt at night */
  --panel:rgba(13,15,18,.82);
  --chalk:#f4f1ea;
  --dim:#a9adb3;
  --red:#d3202f;            /* Omani red */
  --green:#12a05a;          /* flag green */
  --amber:#ffb224;          /* nitro / highlights */
  --line:rgba(244,241,234,.18);
  --display:"Lalezar","Tajawal","Segoe UI",Tahoma,sans-serif;
  --body:"Tajawal","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden}
#app{position:fixed;inset:0;direction:rtl;font-family:var(--body);color:var(--chalk);overflow:hidden;background:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#app button{font-family:var(--body);color:var(--chalk);cursor:pointer}
#app button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;line-height:1}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.plate{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px)}
#pos{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:6px 18px 4px;transform:skewX(8deg);border-inline-start:5px solid var(--red)}
#pos > div{transform:skewX(-8deg);display:flex;align-items:baseline;gap:6px}
#posN{font-size:54px;color:var(--amber)}#posT{font-size:22px;color:var(--dim)}
#lap{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:8px 14px;font-size:15px;font-weight:700;display:flex;flex-direction:column;gap:2px;direction:rtl;border-inline-end:5px solid var(--green)}
#lap b{font-family:var(--display);font-size:24px;font-weight:400}
#time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
#map{position:absolute;top:calc(max(12px,env(safe-area-inset-top,0px)) + 78px);left:max(16px,env(safe-area-inset-left,0px));width:150px;height:150px;opacity:.95}
#speedo{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));text-align:center;min-width:150px}
#spd{font-size:76px;text-shadow:0 3px 14px rgba(0,0,0,.7)}
#speedo small{display:block;font-size:13px;font-weight:700;color:var(--dim);margin-top:-6px;text-shadow:0 1px 6px #000}
#nitro{margin-top:8px;height:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);transform:skewX(-14deg);overflow:hidden}
#nitro i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ff5a1f);margin-inline-start:auto}
#nitroL{font-size:12px;font-weight:700;color:var(--amber);margin-top:3px;text-shadow:0 1px 6px #000}
#big{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--display);font-size:clamp(90px,22vw,190px);color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.7);line-height:1}
#msg{position:absolute;left:50%;top:20%;transform:translateX(-50%);padding:8px 22px;font-size:18px;font-weight:900;background:var(--red);white-space:nowrap}
#note{position:absolute;left:50%;top:13%;transform:translateX(-50%);padding:7px 18px;font-size:16px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s}
#note.on{opacity:1}
#bPause{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;pointer-events:auto;font-size:15px;padding:0}

/* touch */
#touch{position:absolute;inset:0;pointer-events:none}
#touch button{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(13,15,18,.55);border:1px solid var(--line);font-weight:900;font-size:15px}
#touch button.on{background:rgba(255,178,36,.85);color:#111}
#tL,#tR{width:84px;height:84px;font-size:30px;bottom:max(26px,env(safe-area-inset-bottom,0px))}
#tL{left:max(18px,env(safe-area-inset-left,0px))}#tR{left:calc(max(18px,env(safe-area-inset-left,0px)) + 96px)}
#tB,#tD,#tN{width:68px;height:68px;right:max(18px,env(safe-area-inset-right,0px))}
#tB{bottom:max(26px,env(safe-area-inset-bottom,0px));right:calc(max(18px,env(safe-area-inset-right,0px)) + 78px)}
#tD{bottom:max(26px,env(safe-area-inset-bottom,0px))}
#tN{bottom:calc(max(26px,env(safe-area-inset-bottom,0px)) + 78px);background:rgba(211,32,47,.7)}
.touch #speedo{right:50%;transform:translateX(50%);bottom:auto;top:calc(max(12px,env(safe-area-inset-top,0px)) + 56px)}
.touch #spd{font-size:46px}

/* ---------- menu ---------- */
.veil{position:absolute;inset:0;display:grid;box-sizing:border-box;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#menu{place-items:center start;background:linear-gradient(to left,rgba(13,15,18,.94) 0%,rgba(13,15,18,.72) 38%,rgba(13,15,18,0) 68%)}
#menuIn{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;margin-inline-start:min(4vw,48px)}
#brand{display:flex;align-items:baseline;gap:14px}
#brand h1{font-family:var(--display);font-weight:400;font-size:clamp(72px,13vw,118px);line-height:.95;margin:0;color:#fff;letter-spacing:.01em}
#brand span{font-weight:900;font-size:17px;color:var(--amber);letter-spacing:.08em}
#stripe{height:8px;background:linear-gradient(90deg,var(--red) 0 34%,var(--chalk) 34% 67%,var(--green) 67%);transform:skewX(-24deg);width:72%}
.lbl{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--dim)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{padding:10px 8px 9px;background:rgba(244,241,234,.06);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:start;min-width:0}
.pick button.sel{border-color:var(--amber);background:rgba(255,178,36,.14)}
.pick button:disabled{opacity:.4;cursor:default}
.pick b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}
.pick small{font-size:11.5px;color:var(--dim);line-height:1.35}
.bar{height:4px;background:rgba(244,241,234,.14);position:relative}
.bar i{position:absolute;inset:0 0 0 auto;background:var(--amber)}
.barL{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}
#go{padding:13px 20px;font-family:var(--display)!important;font-size:28px;background:var(--red);border:0;border-radius:3px;transform:skewX(-8deg)}
#go:hover{background:#e8303f}
#keys{font-size:12.5px;color:var(--dim);line-height:1.7;margin:0}
#snd{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:3px;padding:6px 12px;font-size:13px;font-weight:700}

.card{place-self:center;width:min(480px,100%);box-sizing:border-box;padding:22px 24px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--red);display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(8px)}
.card h2{font-family:var(--display);font-weight:400;font-size:40px;margin:0;line-height:1.1}
.card p{margin:0;font-size:15px;color:var(--dim);line-height:1.7}
#table{display:flex;flex-direction:column;gap:4px}
#table div{display:grid;grid-template-columns:34px 16px 1fr auto auto;gap:10px;align-items:center;padding:6px 10px;background:rgba(244,241,234,.05);font-weight:700;font-size:15px}
#table div.me{background:rgba(255,178,36,.18)}
#table .n{font-family:var(--display);font-size:22px;color:var(--amber)}
#table .dot{width:14px;height:14px;border-radius:50%}
#table .t{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
#table .p{font-variant-numeric:tabular-nums;color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 18px;font-size:16px;font-weight:900;background:rgba(244,241,234,.08);border:1px solid var(--line);border-radius:3px}
.btn.go{background:var(--red);border-color:var(--red)}
#fade{position:absolute;inset:0;background:var(--ink);pointer-events:none;transition:opacity .45s}
#fade.clear{opacity:0}
@media (max-width:620px){
  #menu{place-items:end center;background:linear-gradient(to top,rgba(13,15,18,.96) 0%,rgba(13,15,18,.8) 62%,rgba(13,15,18,0) 100%)}
  #menuIn{margin-inline-start:0;gap:10px}
  #keys{display:none}
  #map{width:104px;height:104px}
  #posN{font-size:40px}
}
@media (prefers-reduced-motion:reduce){#fade,#note{transition:none}}
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div id="hud" hidden>
    <div id="pos" class="plate"><div><span id="posN" class="num">١</span><span id="posT" class="num">/٦</span></div></div>
    <div id="lap" class="plate"><span>اللفة <b id="lapN"></b></span><span id="time">٠:٠٠٫٠</span></div>
    <canvas id="map" width="300" height="300"></canvas>
    <div id="speedo"><div id="spd" class="num">٠</div><small>كم/س</small><div id="nitro"><i></i></div><div id="nitroL">نيترو</div></div>
    <div id="big" hidden></div>
    <div id="msg" hidden>اتجاه معاكس!</div>
    <div id="note" class="plate"></div>
    <button id="bPause" class="plate" aria-label="إيقاف مؤقت">❚❚</button>
    <div id="touch" hidden>
      <button id="tL" aria-label="يسار">◀</button><button id="tR" aria-label="يمين">▶</button>
      <button id="tN">نيترو</button><button id="tB">فرامل</button><button id="tD">انجراف</button>
    </div>
  </div>

  <div id="menu" class="veil">
    <div id="menuIn">
      <div id="brand"><h1>هبوب</h1><span>رالي عُمان</span></div>
      <div id="stripe"></div>
      <div class="lbl">اختر سيارتك</div>
      <div class="pick" id="cars"></div>
      <div class="lbl">اختر الحلبة</div>
      <div class="pick" id="tracks"></div>
      <button id="go">انطلق</button>
      <p id="keys">القيادة: الأسهم أو WASD · انجراف: مسافة · نيترو: Shift · إعادة للمسار: R · الانجراف يملأ النيترو</p>
      <button id="snd">الصوت: يعمل</button>
    </div>
  </div>
  <div id="res" class="veil" hidden><div class="card">
    <h2 id="rTitle"></h2><p id="rSub"></p><div id="table"></div>
    <div class="row"><button id="rNext" class="btn go">الحلبة التالية</button><button id="rAgain" class="btn">إعادة السباق</button><button id="rMenu" class="btn">القائمة</button></div>
  </div></div>
  <div id="pause" class="veil" hidden><div class="card">
    <h2>توقّف مؤقت</h2><p>المحرّك دافئ والمنافسون ينتظرون.</p>
    <div class="row"><button id="pGo" class="btn go">متابعة</button><button id="pAgain" class="btn">إعادة السباق</button><button id="pMenu" class="btn">القائمة</button></div>
  </div></div>
  <div id="fade"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const T=window.THREE,$=id=>document.getElementById(id);
if(!T){document.body.textContent='تعذّر تحميل المحرك ثلاثي الأبعاد';return}

/* ===================================================== utils */
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry(1);const rr=(a,b)=>a+R()*(b-a);
function hash(x,z){const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return lerp(lerp(hash(xi,zi),hash(xi+1,zi),u),lerp(hash(xi,zi+1),hash(xi+1,zi+1),u),v)}
function fbm(x,z,o){o=o||4;let a=.5,f=1,s=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,z*f);a*=.5;f*=2}return s}
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};
const AR='٠١٢٣٤٥٦٧٨٩',ar=n=>String(n).replace(/\d/g,d=>AR[d]).replace('.','٫');
const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return ar(m+':'+(s<10?'0':'')+s.toFixed(1))};
const lin=h=>new T.Color(h).convertSRGBToLinear();

/* ===================================================== renderer */
const canvas=$('c');
const COARSE=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
const renderer=new T.WebGLRenderer({canvas,antialias:!COARSE,powerPreference:'high-performance'});
let PR=Math.min(window.devicePixelRatio||1,COARSE?1.5:1.75);renderer.setPixelRatio(PR);
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.fog=new T.Fog(0xffffff,120,900);
const camera=new T.PerspectiveCamera(62,1,.4,2400);
const hemi=new T.HemisphereLight(0xffffff,0x886644,1);scene.add(hemi);
const sun=new T.DirectionalLight(0xffffff,2.4);sun.castShadow=true;sun.shadow.mapSize.set(COARSE?1024:2048,COARSE?1024:2048);
{const c=sun.shadow.camera;c.left=-70;c.right=70;c.top=70;c.bottom=-70;c.near=1;c.far=420;sun.shadow.bias=-.0005;sun.shadow.normalBias=.06}
scene.add(sun);scene.add(sun.target);const sunDir=new T.Vector3(.4,.8,.3).normalize();
const skyMat=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new T.Color()},hor:{value:new T.Color()},sunD:{value:new T.Vector3()},sunC:{value:new T.Color()}},
  vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 hor;uniform vec3 sunD;uniform vec3 sunC;varying vec3 p;void main(){vec3 n=normalize(p);float t=pow(max(n.y,0.),.45);vec3 c=mix(hor,top,t);float s=max(dot(n,sunD),0.);c+=sunC*(pow(s,600.)*6.+pow(s,10.)*.35);gl_FragColor=vec4(c,1.);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}'});
const sky=new T.Mesh(new T.SphereGeometry(1800,24,14),skyMat);sky.frustumCulled=false;scene.add(sky);
let pScale=400;
function resize(){const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();pScale=h*PR/(2*Math.tan(camera.fov*Math.PI/360))}
addEventListener('resize',resize);
function setSky(top,hor,fogN,fogF,az,el,sunC,sunI,hemI,hemS,hemG){skyMat.uniforms.top.value.copy(lin(top));skyMat.uniforms.hor.value.copy(lin(hor));scene.fog.color.copy(lin(hor));scene.fog.near=fogN;scene.fog.far=fogF;
  sunDir.set(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az));skyMat.uniforms.sunD.value.copy(sunDir);skyMat.uniforms.sunC.value.copy(lin(sunC));
  sun.color.copy(lin(sunC));sun.intensity=sunI;hemi.intensity=hemI;hemi.color.copy(lin(hemS));hemi.groundColor.copy(lin(hemG))}

/* ---- caches */
const mats={},geos={};
function M(c,o){const k=c+(o?JSON.stringify(o):'');if(mats[k])return mats[k];const p=Object.assign({flatShading:true,roughness:.9,metalness:0},o||{}),em=p.emissive;delete p.emissive;const m=new T.MeshStandardMaterial(p);m.color.copy(lin(c));if(em!==undefined)m.emissive.copy(lin(em));return mats[k]=m}
function MB(c,o){const k='b'+c+(o?JSON.stringify(o):'');if(mats[k])return mats[k];const m=new T.MeshBasicMaterial(o||{});m.color.copy(lin(c));return mats[k]=m}
const geo=(k,f)=>geos[k]||(geos[k]=f());
const GB=(w,h,d)=>geo('b'+w+','+h+','+d,()=>new T.BoxGeometry(w,h,d));
const GC=(a,b,h,s,open)=>geo('c'+a+','+b+','+h+','+(s||8)+(open?'o':''),()=>new T.CylinderGeometry(a,b,h,s||8,1,!!open));
const GS=(r,w,h)=>geo('s'+r+','+(w||8)+','+(h||6),()=>new T.SphereGeometry(r,w||8,h||6));
const GI=(r,d)=>geo('i'+r+','+(d||0),()=>new T.DodecahedronGeometry(r,d||0));
function mesh(g,m,x,y,z,p){const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=true;o.receiveShadow=true;if(p)p.add(o);return o}
function grp(p,x,y,z){const g=new T.Group();g.position.set(x||0,y||0,z||0);if(p)p.add(g);return g}
let batches=new Map();
function bake(obj){obj.updateMatrixWorld(true);obj.traverse(o=>{if(o.isMesh){const k=o.geometry.uuid+'|'+o.material.uuid;let b=batches.get(k);if(!b)batches.set(k,b={g:o.geometry,m:o.material,arr:[],sh:o.castShadow});b.arr.push(o.matrixWorld.clone())}})}
function flush(parent){batches.forEach(b=>{const im=new T.InstancedMesh(b.g,b.m,b.arr.length);for(let i=0;i<b.arr.length;i++)im.setMatrixAt(i,b.arr[i]);im.castShadow=b.sh;im.receiveShadow=true;im.frustumCulled=false;parent.add(im)});batches=new Map()}

/* ---- particles (dust, smoke, sparks, flame) */
const PN=900,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*4),pSize=new Float32Array(PN),pVel=new Float32Array(PN*3),pLife=new Float32Array(PN),pMax=new Float32Array(PN),pA=new Float32Array(PN),pGrow=new Float32Array(PN);let pI=0;
for(let i=0;i<PN;i++)pPos[i*3+1]=-9999;
const pGeo=new T.BufferGeometry();pGeo.setAttribute('position',new T.BufferAttribute(pPos,3));pGeo.setAttribute('pcol',new T.BufferAttribute(pCol,4));pGeo.setAttribute('psize',new T.BufferAttribute(pSize,1));
const pMat=new T.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{sc:{value:400}},
  vertexShader:'attribute vec4 pcol;attribute float psize;varying vec4 c;uniform float sc;void main(){c=pcol;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=psize*sc/-mv.z;gl_Position=projectionMatrix*mv;}',
  fragmentShader:'varying vec4 c;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(c.rgb,c.a*smoothstep(.5,.12,d));}'});
const points=new T.Points(pGeo,pMat);points.frustumCulled=false;points.renderOrder=5;scene.add(points);
function puff(x,y,z,r,g,b,a,size,vx,vy,vz,life,grow){const i=pI;pI=(pI+1)%PN;const j=i*3,k=i*4;pPos[j]=x;pPos[j+1]=y;pPos[j+2]=z;pVel[j]=vx;pVel[j+1]=vy;pVel[j+2]=vz;pCol[k]=r;pCol[k+1]=g;pCol[k+2]=b;pA[i]=a;pSize[i]=size;pLife[i]=pMax[i]=life;pGrow[i]=grow||0}
function updParticles(dt){for(let i=0;i<PN;i++){if(pLife[i]<=0)continue;pLife[i]-=dt;const j=i*3;if(pLife[i]<=0){pPos[j+1]=-9999;continue}
    pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt;pSize[i]+=pGrow[i]*dt;pCol[i*4+3]=pA[i]*(pLife[i]/pMax[i])}
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.pcol.needsUpdate=true;pGeo.attributes.psize.needsUpdate=true;pMat.uniforms.sc.value=pScale}

/* ===================================================== audio */

function nearest(x,z,hint,wb,wf){const N=TK.N,X=TK.X,Z=TK.Z;let b=hint,bd=1e18;for(let k=-wb;k<=wf;k++){const i=((hint+k)%N+N)%N,dx=x-X[i],dz=z-Z[i],d=dx*dx+dz*dz;if(d<bd){bd=d;b=i}}

$('rNext').addEventListener('click',()=>{sfx.ui();G.mode='load';fade(()=>{G.track++;loadTrack(G.track);beginRace()})});
['rMenu','pMenu'].forEach(id=>$(id).addEventListener('click',()=>{sfx.ui();toMenu()}));$('pGo').addEventListener('click',resume);$('bPause').addEventListener('click',()=>{if(G.mode==='race'||G.mode==='count')pause()});
$('snd').addEventListener('click',()=>{audioInit();setSound(!AU.on)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&(G.mode==='race'||G.mode==='count'))pause()});

/* ===================================================== loop */
const tmp={thr:0,steer:0,hand:false,boost:false},idle={thr:0,steer:0,hand:true,boost:false};
function update(dt){G.now+=dt;
  for(const p of PICK){p.g.rotation.y+=dt*2;if(p.t>0){p.t-=dt;if(p.t<=0)p.g.visible=true}}
  for(const o of OB)if(o.move){o.t+=dt;const ph=o.t*.16,lat=Math.sin(ph)*24;o.x=TK.X[o.i]+TK.RX[o.i]*lat;o.z=TK.Z[o.i]+TK.RZ[o.i]*lat;const fwd=Math.cos(ph)>0?1:-1;o.g.position.set(o.x,groundAt(o.x,o.z,o.i),o.z);o.g.rotation.y=Math.atan2(TK.RX[o.i]*fwd,TK.RZ[o.i]*fwd);
      const l=o.g.userData.legs,a=Math.sin(G.now*5)*.45;l[0].rotation.x=l[3].rotation.x=a;l[1].rotation.x=l[2].rotation.x=-a}
  if(G.mode==='count'){G.count-=dt;const n=Math.ceil(G.count-.6);if(n!==G.lastBeep&&n>=0&&n<=3){G.lastBeep=n;$('big').textContent=n>0?ar(n):'انطلق!';sfx.beep(n===0)}
    if(G.count<=.6){G.mode='race';setTimeout(()=>show('big',false),700)}for(const c of cars){stepCar(c,idle,dt);syncCar(c)}engineSound(8+Math.random()*3,1,0,false,true);return}
  if(G.mode==='race'||G.mode==='done'){if(G.mode==='race')G.t+=dt;
    for(const c of cars){let io;if(c.isP&&G.mode==='race'&&!G.auto){readInput();io=inp}else{aiInput(c,dt,tmp);io=tmp}stepCar(c,io,dt);carFx(c,io);
      if(!c.fin&&c.lap>=LAPS)c.fin=G.t;
      if(!c.isP||G.auto||G.mode==='done'){if(Math.abs(c.spd)<2)c.stuck+=dt;else c.stuck=0;if(c.stuck>2.5)resetCar(c)}}
    collide();for(const c of cars)syncCar(c);
    if(G.mode==='race'){const order=hud();const p=player,w=(Math.sin(p.h)*TK.TX[p.idx]+Math.cos(p.h)*TK.TZ[p.idx])<-.3&&p.spd>4;p.wrong=w?p.wrong+dt:0;show('msg',p.wrong>1);drawMap();
      engineSound(p.spd,inp.thr,p.slip,p.boost,true);if(p.fin)finish(order)}else engineSound(player.spd,1,0,false,true)}
  else if(G.mode==='menu'){for(const c of cars)syncCar(c)}}
const clock=new T.Clock();let slow=0;
function frame(){requestAnimationFrame(frame);const raw=clock.getDelta(),dt=Math.min(raw,.05);if(G.mode==='paused'||G.mode==='boot'||G.mode==='load'||!TK)return;
  update(dt);updateCamera(dt);updParticles(dt);sky.position.copy(camera.position);
  const fx=player?player.x:0,fz=player?player.z:0,fy=player?player.y:0;sun.position.set(fx+sunDir.x*200,fy+Math.max(sunDir.y,.25)*200,fz+sunDir.z*200);sun.target.position.set(fx,fy,fz);
  renderer.render(scene,camera);
  if(raw>.045)slow+=raw;else slow=Math.max(0,slow-raw*.5);if(slow>3){slow=0;if(PR>1){PR=1;renderer.setPixelRatio(1);resize()}else if(renderer.shadowMap.enabled){renderer.shadowMap.enabled=false;sun.castShadow=false;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true})}}}
resize();loadTrack(0);setupRace();buildMenu();G.mode='menu';
requestAnimationFrame(()=>{$('fade').classList.add('clear');frame()});
window.__h={G,get cars(){return cars},get TK(){return TK},start(t,car){G.track=t;if(car!==undefined)G.car=car;loadTrack(t);beginRace()},sim(sec,auto){G.auto=!!auto;const n=Math.round(sec/.02);for(let i=0;i<n;i++)update(.02);G.auto=false}};
})();
</script>
</body></html>
