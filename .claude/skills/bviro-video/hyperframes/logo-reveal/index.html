<style>

@font-face{font-family:Cairo;font-weight:600;src:url(fonts/Cairo-600.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#root{width:100%;height:100%;position:relative;font-family:Cairo;overflow:hidden;background:#fff}
#a{position:absolute;inset:0}

.t{position:absolute;left:0;right:0;text-align:center;direction:rtl;color:#fff;white-space:nowrap}

#l2{top:610px;font-size:124px;font-weight:900;color:#01CEC9}

#by .k{font-size:40px;font-weight:600;color:#bfb3df;direction:rtl}
#by .row{display:flex;align-items:center;gap:24px;direction:ltr}
#by .s{height:110px} #by .e{height:66px} #by .ar{height:74px} #by .bar{width:4px;height:80px;background:#01CEC9;border-radius:2px}

</head>
<body>

    <div id="presents">تقدّم</div>

tl.set("#b", { clipPath: "inset(100% 0 0 0)" }, 0)

  .from("#rule", { scaleX: 0, duration: 0.45, ease: "expo.out" }, 0.3)
  .from("#presents", { opacity: 0, y: 20, duration: 0.35, ease: "power2.out" }, 0.3)

  .to("#a", { scale: 1.05, duration: 3.1, ease: "none" }, 0)
  .to("#b", { clipPath: "inset(0% 0 0 0)", duration: 0.55, ease: "expo.inOut" }, 3.0)

  .from("#l2", { scale: 1.5, opacity: 0, filter: "blur(14px)", duration: 0.45, ease: "expo.out" }, 3.5)
  .from("#l3", { y: 30, opacity: 0, duration: 0.35, ease: "power3.out" }, 3.75)
  .from("#l4", { scale: 0.6, opacity: 0, duration: 0.45, ease: "back.out(2)" }, 3.9)
  .from("#l5", { opacity: 0, duration: 0.4 }, 4.15)

  .to("#b", { scale: 1.03, duration: 4.7, ease: "none" }, 3.0);
window.__timelines["main"] = tl;
tl.seek(0);

</html>
