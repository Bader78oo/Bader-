[["#hook", 2.0], ["#g1", 3.5], ["#g2", 4.8], ["#g3", 6.1], ["#g4", 7.7], ["#g5", 9.75], ["#g6", 11.4], ["#g7", 12.2], ["#n1", 13.6], ["#n2", 15.8], ["#ttl", 99]].forEach(([id, out]) => {

});
